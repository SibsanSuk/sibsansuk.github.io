<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAME_DEV - เลือกบทเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap">
  <style>
    :root {
      --font: "Mitr", sans-serif;
      --ink: #1a1d20;
      --muted: #5f6770;
      --paper: #fbfbf7;
      --panel: rgba(255, 255, 255, 0.9);
      --line: #1f2328;
      --accent: #ffd400;
      --accent-soft: #fff5c2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #fff3c9 0%, transparent 38%),
        radial-gradient(circle at 100% 100%, #dcecff 0%, transparent 32%),
        linear-gradient(180deg, #f1f1ec 0%, #e8ecef 100%);
      min-height: 100vh;
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 24px auto 34px;
    }

    .hero {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--accent);
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      line-height: 1.2;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font);
    }

    .button.primary { background: var(--accent); }
    .button.secondary { background: var(--accent-soft); }

    .button:hover { transform: translateY(-1px); }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 8px;
      min-height: 156px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.06);
    }

    .card .chip {
      width: fit-content;
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      background: #fff;
    }

    .card h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      color: #3e4349;
      font-size: 13px;
      line-height: 1.45;
    }

    .card a {
      justify-self: start;
      margin-top: auto;
    }

    .foot {
      margin-top: 16px;
      text-align: center;
      color: #6c7480;
      font-size: 12px;
    }

    @media (max-width: 940px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .wrap { width: min(1120px, calc(100% - 20px)); margin-top: 14px; }
      .hero { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 136px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">GAME_DEV</div>
      <h1>Game Design and Development</h1>
      <p class="subtitle">เลือกบทเรียนเพื่อเข้าสู่หน้า Presentation ของแต่ละบท</p>
      <div class="actions">
        <button id="continueBtn" class="button primary" type="button" hidden>Continue</button>
        <a class="button secondary" href="./presentation.html?week=01">เริ่มที่บทที่ 01</a>
        <a class="button" href="./README.md">Open README</a>
      </div>
    </section>

    <section class="grid" id="chapterGrid"></section>

    <footer class="foot">Game Design and Development : Sibsan Suksuchano</footer>
  </main>

  <script>
    const chapters = [
      { id: '01', topic: 'Game Engine Fundamentals + Unity Basics' },
      { id: '02', topic: 'Scene, Prefab, Transform System' },
      { id: '03', topic: 'Input + Basic Gameplay Loop' },
      { id: '04', topic: 'Physics-driven Gameplay' },
      { id: '05', topic: 'UI, Feedback, and Game Feel' },
      { id: '06', topic: 'Production Workflow + Build' },
      { id: '07', topic: 'Final Playtest and Presentation' }
    ];

    const grid = document.getElementById('chapterGrid');
    grid.innerHTML = chapters.map((chapter) => `
      <article class="card">
        <div class="chip">บทที่ ${chapter.id}</div>
        <h2>${chapter.topic}</h2>
        <p>เปิดสไลด์สำหรับการสอนบทที่ ${chapter.id}</p>
        <a class="button" href="./presentation.html?week=${chapter.id}">Open Chapter</a>
      </article>
    `).join('');

    const last = localStorage.getItem('game_dev_last_week');
    const continueBtn = document.getElementById('continueBtn');
    if (last && chapters.some((chapter) => chapter.id === last)) {
      continueBtn.hidden = false;
      continueBtn.textContent = `Continue: บทที่ ${last}`;
      continueBtn.addEventListener('click', () => {
        window.location.href = `./presentation.html?week=${last}`;
      });
    }
  </script>
</body>
</html>
