<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Thailand Satellite 3D View – MapLibre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MapLibre GL CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #map-container {
      position: relative;
      flex: 1 1 auto;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 13px;
      z-index: 10;
      border-radius: 4px;
      line-height: 1.4;
    }
    #sidebar {
      width: 320px;
      max-width: 40%;
      height: 100%;
      box-sizing: border-box;
      border-left: 1px solid #444;
      background: #111;
      color: #eee;
      padding: 8px;
      font-size: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tab-panel {
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #pm25-editor,
    #pm25-sub-editor {
      width: 100%;
      flex: 1 1 auto;
      height: auto;
      min-height: 0;
      box-sizing: border-box;
      resize: none;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      background: #000;
      color: #0f0;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map-container">
      <div id="map"></div>
      <div id="info">
        <label style="display:block; margin-top:2px; font-size:12px;">
          <input type="checkbox" id="toggle-3d" />
          แสดง 3D mesh รายอำเภอ
        </label>
        <label style="display:block; margin-top:4px; font-size:12px;">
          <input type="checkbox" id="toggle-cube" checked />
          แสดง 3D cube ตามค่า PM2.5
        </label>
        <label style="display:block; margin-top:6px; font-size:12px;">
          ขนาดตัวอักษร:
          <input
            type="range"
            id="font-scale"
            min="0.7"
            max="1.5"
            step="0.1"
            value="1"
            style="vertical-align:middle;"
          />
          <span id="font-scale-value">100%</span>
        </label>
        <label style="display:block; margin-top:6px; font-size:12px;">
          เริ่มแสดงตำบลที่ระดับซูม:
          <input
            type="range"
            id="sub-minzoom"
            min="6"
            max="14"
            step="0.1"
            value="10.5"
            style="vertical-align:middle;"
          />
          <span id="sub-minzoom-value">10.5</span>
        </label>
        <div style="margin-top:4px; font-size:11px; opacity:0.85;">
          Zoom: <span id="zoom-value">-</span>
        </div>
      </div>
    </div>
    <aside id="sidebar">
      <h3 style="margin:4px 0 6px;">ข้อมูล PM2.5</h3>
      <div id="sidebar-tabs" style="margin-bottom:6px;">
        <button type="button" class="tab-button active" data-target="district" style="font-size:12px; padding:2px 6px; margin-right:4px;">
          อำเภอ
        </button>
        <button type="button" class="tab-button" data-target="subdistrict" style="font-size:12px; padding:2px 6px;">
          ตำบล
        </button>
      </div>
      <div id="district-tab" class="tab-panel active">
        <textarea id="pm25-editor" spellcheck="false"></textarea>
        <p style="margin:6px 0 0; font-size:11px; color:#ccc;">
          รูปแบบ: <code>amp_en,pm25</code> หนึ่งแถวต่อหนึ่งอำเภอ<br />
          เมื่อแก้ค่าที่นี่ แผนที่ (mesh/cube + label) จะอัปเดตทันที
        </p>
      </div>
      <div id="subdistrict-tab" class="tab-panel" style="display:none;">
        <textarea id="pm25-sub-editor" spellcheck="false"></textarea>
        <p style="margin:6px 0 0; font-size:11px; color:#ccc;">
          รูปแบบ: <code>tam_en,pm25</code> หนึ่งแถวต่อหนึ่งตำบล<br />
          สามารถใส่บรรทัดคอมเมนต์ขึ้นต้นด้วย <code>#</code> เพื่อบอกว่าเป็นข้อมูลของอำเภอใด
        </p>
      </div>
    </aside>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    // สร้าง style แบบ custom เพื่อใช้ Esri World Imagery เป็น satellite layer
    const style = {
  version: 8,
  glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
  sources: {
    "esri-imagery": {
      type: "raster",
      tiles: [
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      ],
      tileSize: 256,
      attribution:
        "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community"
    }
  },
  layers: [
    {
      id: "esri-imagery",
      type: "raster",
      source: "esri-imagery",
      minzoom: 0,
      maxzoom: 19
    }
  ]
};


    const map = new maplibregl.Map({
      container: "map",
      style,
      center: [100.5, 15.5], // ใจกลางประเทศไทยโดยคร่าว ๆ
      zoom: 5.3,
      pitch: 60, // เอียงกล้องให้เป็นมุมมอง 3D
      bearing: -30, // หมุนแผนที่เล็กน้อย
      antialias: true
    });

    // แสดงระดับการซูมมุมขวาบน (ใน info)
    const zoomValueEl = document.getElementById("zoom-value");
    function updateZoomIndicator() {
      if (!zoomValueEl) return;
      zoomValueEl.textContent = map.getZoom().toFixed(1);
    }
    map.on("zoom", updateZoomIndicator);
    map.on("load", updateZoomIndicator);

    // เพิ่มปุ่มควบคุมมาตรฐาน
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    // ตั้งค่า drag + pitch/bearing แบบ Mapbox/MapLibre:
    // - ลากปกติ: แพน
    // - Shift + ลาก: หมุน/เอียงมุมกล้อง
    map.dragRotate.enable();
    map.touchZoomRotate.enableRotation();

    // โหลด GeoJSON จังหวัด + อำเภอ (+ ตำบล) แล้วดึงเฉพาะเชียงราย
    map.on("load", () => {
      // URLs จาก OpenGISData-Thailand
      const PROVINCES_URL =
        "https://raw.githubusercontent.com/chingchai/OpenGISData-Thailand/master/provinces.geojson";
      const DISTRICTS_URL =
        "https://raw.githubusercontent.com/chingchai/OpenGISData-Thailand/master/districts.geojson";
      const SUBDISTRICTS_URL =
        "https://raw.githubusercontent.com/chingchai/OpenGISData-Thailand/master/subdistricts.geojson";

      Promise.all([fetch(PROVINCES_URL), fetch(DISTRICTS_URL), fetch(SUBDISTRICTS_URL)])
        .then(async ([provRes, distRes, subdistRes]) => {
          if (!provRes.ok) throw new Error("โหลด provinces.geojson ไม่สำเร็จ");
          if (!distRes.ok) throw new Error("โหลด districts.geojson ไม่สำเร็จ");
          if (!subdistRes.ok) throw new Error("โหลด subdistricts.geojson ไม่สำเร็จ");

          const provinces = await provRes.json();
          const districts = await distRes.json();
          const subdistricts = await subdistRes.json();

          // ---------- 1) จังหวัดเชียงราย ----------
          const chiangRaiProvince = provinces.features.find((f) => {
            const p = f.properties || {};
            return p.pro_en === "Chiang Rai" || p.pro_th === "เชียงราย";
          });

          if (!chiangRaiProvince) {
            throw new Error("ไม่พบจังหวัดเชียงรายใน provinces.geojson");
          }

          map.addSource("chiang-rai-boundary", {
            type: "geojson",
            data: chiangRaiProvince
          });

          // fill โปร่ง ๆ
          map.addLayer({
            id: "chiang-rai-fill",
            type: "fill",
            source: "chiang-rai-boundary",
            paint: {
              "fill-color": "#ff3333",
              "fill-opacity": 0.05
            }
          });

          // เส้นขอบจังหวัด
          map.addLayer({
            id: "chiang-rai-outline",
            type: "line",
            source: "chiang-rai-boundary",
            paint: {
              "line-color": "#ff3333",
              "line-width": 3
            }
          });

          

          // ---------- 2) เส้นขอบ "อำเภอ" ทั้งหมดในจังหวัดเชียงราย ----------
          const chiangRaiDistricts = {
            type: "FeatureCollection",
            features: districts.features.filter((f) => {
              const p = f.properties || {};
              return p.pro_en === "Chiang Rai" || p.pro_th === "เชียงราย";
            })
          };

          // ---------- 2.1) เส้นขอบ "ตำบล" ทั้งหมดในจังหวัดเชียงราย (แสดงเมื่อซูมลึก) ----------
          const chiangRaiSubdistricts = {
            type: "FeatureCollection",
            features: subdistricts.features.filter((f) => {
              const p = f.properties || {};
              return p.pro_en === "Chiang Rai" || p.pro_th === "เชียงราย";
            })
          };

          // ตัวอย่างข้อมูล PM2.5 ต่ออำเภอ (สมมติค่า)
          // key = amp_en จาก districts.geojson
          const pm25ByDistrict = {
            "Mueang Chiang Rai": 45,
            "Chiang Saen": 38,
            "Chiang Khong": 52,
            "Mae Sai": 60,
            "Mae Chan": 55,
            "Wiang Chai": 35,
            "Thoeng": 48,
            "Phan": 40,
            "Pa Daet": 10,
            "Mae Lao": 12,
            "Wiang Chiang Rung": 37,
            "Doi Luang": 50
          };
          const defaultPmCsv =
            "Mueang Chiang Rai,45\n" +
            "Chiang Saen,38\n" +
            "Chiang Khong,52\n" +
            "Mae Sai,60\n" +
            "Mae Chan,55\n" +
            "Wiang Chai,35\n" +
            "Thoeng,48\n" +
            "Phan,40\n" +
            "Pa Daet,10\n" +
            "Mae Lao,12\n" +
            "Wiang Chiang Rung,37\n" +
            "Doi Luang,50\n";

          function parsePmCsv(text) {
            const map = {};
            if (!text) return map;
            text.split(/\r?\n/).forEach((line) => {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) return;
              const parts = trimmed.split(",");
              if (parts.length < 2) return;
              const name = parts[0].trim();
              const value = parseFloat(parts[1]);
              if (!name || Number.isNaN(value)) return;
              map[name] = value;
            });
            return map;
          }

          // ผูกค่า PM อำเภอ + คำนวณความสูงเก็บไว้ใน properties (ใช้ csv ถ้ามี)
          function applyDistrictPmFromEditor() {
            const editor = document.getElementById("pm25-editor");
            const csvText = editor && editor.value ? editor.value : defaultPmCsv;
            const csvMap = parsePmCsv(csvText);

            chiangRaiDistricts.features.forEach((f) => {
              const props = f.properties || {};
              const nameEn = props.amp_en;
              const pm = (csvMap[nameEn] ?? pm25ByDistrict[nameEn]) ?? 25;
              props.pm25 = pm;
              // scale ความสูง (ย่อ mesh ลงเล็กน้อยเพื่อไม่ให้ชนกันเกินไป)
              props.pm25_height = pm * 200;
              f.properties = props;
            });

            chiangRaiDistrictCubes.features.forEach((f) => {
              const props = f.properties || {};
              const nameEn = props.amp_en;
              const pm = (csvMap[nameEn] ?? pm25ByDistrict[nameEn]) ?? 25;
              props.pm25 = pm;
              props.pm25_height = pm * 200;
              f.properties = props;
            });

            const distSrc = map.getSource("chiang-rai-districts");
            if (distSrc) distSrc.setData(chiangRaiDistricts);
            const cubeSrc = map.getSource("chiang-rai-district-cubes");
            if (cubeSrc) cubeSrc.setData(chiangRaiDistrictCubes);
          }

// สร้าง GeoJSON ใหม่สำหรับ 3D cube (สี่เหลี่ยมเล็ก ๆ ที่จุดกึ่งกลางอำเภอ)
const chiangRaiDistrictCubes = {
  type: "FeatureCollection",
  features: chiangRaiDistricts.features.map((f) => {
    const geom = f.geometry;
    const bbox = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };

    function collectCoords(coords) {
      coords.forEach((c) => {
        if (Array.isArray(c[0])) {
          collectCoords(c);
        } else {
          const [lng, lat] = c;
          if (lng < bbox.minX) bbox.minX = lng;
          if (lng > bbox.maxX) bbox.maxX = lng;
          if (lat < bbox.minY) bbox.minY = lat;
          if (lat > bbox.maxY) bbox.maxY = lat;
        }
      });
    }

    if (geom && geom.coordinates) {
      collectCoords(geom.coordinates);
    }

    const centerLng = (bbox.minX + bbox.maxX) / 2;
    const centerLat = (bbox.minY + bbox.maxY) / 2;
    const width = (bbox.maxX - bbox.minX) * 0.25 || 0.05;
    const height = (bbox.maxY - bbox.minY) * 0.25 || 0.05;
    const halfW = width / 2;
    const halfH = height / 2;

    const square = [
      [centerLng - halfW, centerLat - halfH],
      [centerLng + halfW, centerLat - halfH],
      [centerLng + halfW, centerLat + halfH],
      [centerLng - halfW, centerLat + halfH],
      [centerLng - halfW, centerLat - halfH]
    ];

    return {
      type: "Feature",
      properties: { ...f.properties },
      geometry: {
        type: "Polygon",
        coordinates: [square]
      }
    };
  })
};

// สร้าง GeoJSON ใหม่สำหรับ 3D cube (สี่เหลี่ยมเล็ก ๆ ที่จุดกึ่งกลางตำบล)
const chiangRaiSubdistrictCubes = {
  type: "FeatureCollection",
  features: chiangRaiSubdistricts.features.map((f) => {
    const geom = f.geometry;
    const bbox = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };

    function collectCoords(coords) {
      coords.forEach((c) => {
        if (Array.isArray(c[0])) {
          collectCoords(c);
        } else {
          const [lng, lat] = c;
          if (lng < bbox.minX) bbox.minX = lng;
          if (lng > bbox.maxX) bbox.maxX = lng;
          if (lat < bbox.minY) bbox.minY = lat;
          if (lat > bbox.maxY) bbox.maxY = lat;
        }
      });
    }

    if (geom && geom.coordinates) {
      collectCoords(geom.coordinates);
    }

    const centerLng = (bbox.minX + bbox.maxX) / 2;
    const centerLat = (bbox.minY + bbox.maxY) / 2;
    const width = (bbox.maxX - bbox.minX) * 0.25 || 0.02;
    const height = (bbox.maxY - bbox.minY) * 0.25 || 0.02;
    const halfW = width / 2;
    const halfH = height / 2;

    const square = [
      [centerLng - halfW, centerLat - halfH],
      [centerLng + halfW, centerLat - halfH],
      [centerLng + halfW, centerLat + halfH],
      [centerLng - halfW, centerLat + halfH],
      [centerLng - halfW, centerLat - halfH]
    ];

    return {
      type: "Feature",
      properties: { ...f.properties },
      geometry: {
        type: "Polygon",
        coordinates: [square]
      }
    };
  })
};


          map.addSource("chiang-rai-districts", {
            type: "geojson",
            data: chiangRaiDistricts
          });

          // source สำหรับเส้นขอบตำบล
          map.addSource("chiang-rai-subdistricts", {
            type: "geojson",
            data: chiangRaiSubdistricts
          });

          // source สำหรับ cube 3D (อำเภอ)
          map.addSource("chiang-rai-district-cubes", {
            type: "geojson",
            data: chiangRaiDistrictCubes
          });

          // source สำหรับ cube 3D (ตำบล)
          map.addSource("chiang-rai-subdistrict-cubes", {
            type: "geojson",
            data: chiangRaiSubdistrictCubes
          });

          // เติมค่าจาก CSV (หรือค่า default) ครั้งแรก
          const pmEditor = document.getElementById("pm25-editor");
          const pmSubEditor = document.getElementById("pm25-sub-editor");
          if (pmEditor && !pmEditor.value) {
            pmEditor.value = defaultPmCsv;
          }
          applyDistrictPmFromEditor();

          // เตรียม default CSV สำหรับตำบล (group ตามอำเภอ)
          if (pmSubEditor && !pmSubEditor.value) {
            const byAmp = {};
            chiangRaiSubdistricts.features.forEach((f) => {
              const p = f.properties || {};
              const amp = p.amp_en || "Unknown";
              const tam = p.tam_en || p.tam_th || "";
              if (!tam) return;
              if (!byAmp[amp]) byAmp[amp] = [];
              byAmp[amp].push(tam);
            });
            const ampNames = Object.keys(byAmp).sort();
            const lines = [];
            ampNames.forEach((amp) => {
              lines.push(`# amphoe: ${amp}`);
              byAmp[amp].sort().forEach((tam) => {
                // สุ่มค่า PM เริ่มต้นให้แต่ละตำบล (ช่วง 10–80)
                const randPm = Math.round(10 + Math.random() * 70);
                lines.push(`${tam},${randPm}`);
              });
              lines.push("");
            });
            pmSubEditor.value = lines.join("\n");
            const csvMapSub = parsePmCsv(pmSubEditor.value);
            chiangRaiSubdistricts.features.forEach((f) => {
              const props = f.properties || {};
              const tam = props.tam_en;
              const pm = (csvMapSub[tam] ?? 25);
              props.tam_pm25 = pm;
              // ใช้สูตรเดียวกับอำเภอ (pm * 200)
              props.tam_pm25_height = pm * 200;
              f.properties = props;
            });
            chiangRaiSubdistrictCubes.features.forEach((f) => {
              const props = f.properties || {};
              const tam = props.tam_en;
              const pm = (csvMapSub[tam] ?? 25);
              props.tam_pm25 = pm;
              props.tam_pm25_height = pm * 200;
              f.properties = props;
            });
            const subSrc = map.getSource("chiang-rai-subdistricts");
            if (subSrc) subSrc.setData(chiangRaiSubdistricts);
            const subCubeSrc = map.getSource("chiang-rai-subdistrict-cubes");
            if (subCubeSrc) subCubeSrc.setData(chiangRaiSubdistrictCubes);
          }

          // วาดเส้นอำเภอ (บางกว่าและคนละสี เพื่อแยกกับเส้นจังหวัด)
          map.addLayer({
            id: "chiang-rai-districts-outline",
            type: "line",
            source: "chiang-rai-districts",
            paint: {
              "line-color": "#ffff66",  // เหลืองอ่อน
              "line-width": 1.5
            }
          });

          // ---------- 2.1b) เส้นขอบตำบล (ซูมลึกเท่านั้น) ----------
          map.addLayer({
            id: "chiang-rai-subdistricts-outline",
            type: "line",
            source: "chiang-rai-subdistricts",
            minzoom: 10.5,
            paint: {
              "line-color": [
                "interpolate",
                ["linear"],
                ["coalesce", ["get", "tam_pm25"], 0],
                0, "#00ffff",
                25, "#ffcc00",
                50, "#ff6600",
                75, "#ff0000"
              ],
              "line-width": 0.8
            }
          });

          // ---------- 2.1c) ชื่อตำบล + ค่า PM (ซูมลึกเท่านั้น) ----------
          map.addLayer({
            id: "chiang-rai-subdistrict-labels",
            type: "symbol",
            source: "chiang-rai-subdistricts",
            minzoom: 10.5,
            layout: {
              // แสดงชื่อตำบล + ค่า PM เช่น "Mae Yao\n35"
              "text-field": [
                "concat",
                ["get", "tam_en"],
                "\n",
                ["to-string", ["coalesce", ["get", "tam_pm25"], 0]]
              ],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                10.5, 10,
                12,  12,
                14,  14
              ],
              "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              "text-anchor": "bottom",
              "text-allow-overlap": true,
              "text-ignore-placement": true,
              // ยกตัวหนังสือให้ลอยเหนือ mesh/cube ตามค่า PM
              "text-offset": [
                "interpolate",
                ["linear"],
                ["coalesce", ["get", "tam_pm25"], 0],
                0,   ["literal", [0, 1.5]],
                30,  ["literal", [0, 2.5]],
                60,  ["literal", [0, 3.5]],
                100, ["literal", [0, 4.5]]
              ],
              "text-pitch-alignment": "viewport",
              "text-rotation-alignment": "viewport"
            },
            paint: {
              "text-color": "#ffffff",
              "text-halo-color": "#000000",
              "text-halo-width": 1.4
            }
          });

          // ---------- 2.2) แท่ง 3D ตามค่า PM2.5 ----------
          map.addLayer({
            id: "chiang-rai-district-bars",
            type: "fill-extrusion",
            source: "chiang-rai-districts",
            minzoom: 6,
            maxzoom: 10.49,
            paint: {
              // ไล่ระดับ "ความเขียว" ตามค่า PM2.5 (แท่งสูง → เขียวสว่าง, แท่งเตี้ย → เขียวเข้มทึม)
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   "#021002",  // เขียวเกือบดำ (ค่าต่ำมาก)
                30,  "#145a32",  // เขียวเข้ม
                60,  "#32cd32",  // เขียวสดกลาง ๆ
                100, "#7fff00"   // เขียวสะท้อนแสง (ค่าสูงสุด)
              ],
              "fill-extrusion-height": ["get", "pm25_height"],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.9
            }
          });

          // ---------- 2.2b) 3D cube ตามค่า PM2.5 ----------
          map.addLayer({
            id: "chiang-rai-district-cubes-3d",
            type: "fill-extrusion",
            source: "chiang-rai-district-cubes",
            maxzoom: 10.49,
            layout: {
              visibility: "none" // เริ่มต้นปิดไว้ รอให้ user ติ๊กเปิด
            },
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   "#021002",
                30,  "#145a32",
                60,  "#32cd32",
                100, "#7fff00"
              ],
              "fill-extrusion-height": ["get", "pm25_height"],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.9
            }
          });

          // ---------- 2.2c) mesh 3D ตามค่า PM2.5 รายตำบล (ซูมลึก) ----------
          map.addLayer({
            id: "chiang-rai-subdistrict-bars",
            type: "fill-extrusion",
            source: "chiang-rai-subdistricts",
            minzoom: 10.5,
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["coalesce", ["get", "tam_pm25"], 0],
                0,   "#021002",
                30,  "#145a32",
                60,  "#32cd32",
                100, "#7fff00"
              ],
              "fill-extrusion-height": ["coalesce", ["get", "tam_pm25_height"], 0],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.8
            }
          });

          // ---------- 2.2d) 3D cube ตามค่า PM2.5 รายตำบล (ซูมลึก) ----------
          map.addLayer({
            id: "chiang-rai-subdistrict-cubes-3d",
            type: "fill-extrusion",
            source: "chiang-rai-subdistrict-cubes",
            minzoom: 10.5,
            layout: {
              visibility: "none"
            },
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["coalesce", ["get", "tam_pm25"], 0],
                0,   "#021002",
                30,  "#145a32",
                60,  "#32cd32",
                100, "#7fff00"
              ],
              "fill-extrusion-height": ["coalesce", ["get", "tam_pm25_height"], 0],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.9
            }
          });

          // ---------- 2.3) ชื่ออำเภอ (label) ลอยเหนือแท่ง 3D ----------
          map.addLayer({
            id: "chiang-rai-district-labels",
            type: "symbol",
            source: "chiang-rai-districts",
            minzoom: 5,
            maxzoom: 10.49,
            layout: {
              // แสดงชื่ออำเภอ + ค่า PM เช่น "Mueang Chiang Rai\nPM 45"
              "text-field": [
                "concat",
                ["get", "amp_en"],
                "\n",
                ["to-string", ["get", "pm25"]]
              ],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                5, 11,
                8, 13,
                11, 15
              ],
              "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              "text-anchor": "bottom",
              "text-allow-overlap": true,
              "text-ignore-placement": true,
              // ยกตัวหนังสือขึ้นมาก-น้อยตามค่า PM2.5
              "text-offset": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   ["literal", [0, 0.3]],
                30,  ["literal", [0, 0.9]],
                60,  ["literal", [0, 1.5]],
                100, ["literal", [0, 2.2]]
              ],
              "text-pitch-alignment": "viewport",
              "text-rotation-alignment": "viewport"
            },
            paint: {
              "text-color": "#ffffff",
              "text-halo-color": "#000000",
              "text-halo-width": 1.5
            }
          });

          // ---------- 2.3b) ชื่ออำเภอบนยอด 3D cube ----------
          map.addLayer({
            id: "chiang-rai-district-cube-labels",
            type: "symbol",
            source: "chiang-rai-district-cubes",
            maxzoom: 10.49,
            layout: {
              // แสดงชื่ออำเภอ + ค่า PM เช่น "Mueang Chiang Rai\nPM 45"
              "text-field": [
                "concat",
                ["get", "amp_en"],
                "\n",
                ["to-string", ["get", "pm25"]]
              ],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                5, 10,
                8, 12,
                11, 14
              ],
              "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              "text-anchor": "bottom",
              "text-allow-overlap": true,
              "text-ignore-placement": true,
              // ยกตัวหนังสือขึ้นตามค่า PM2.5 ให้ลอยเหนือ cube
              "text-offset": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   ["literal", [0, 0.4]],
                30,  ["literal", [0, 1.0]],
                60,  ["literal", [0, 1.7]],
                100, ["literal", [0, 2.4]]
              ],
              "text-pitch-alignment": "viewport",
              "text-rotation-alignment": "viewport"
            },
            paint: {
              "text-color": "#ffffff",
              "text-halo-color": "#000000",
              "text-halo-width": 1.5
            }
          });

          // จัดลำดับให้ label ตำบลอยู่บนสุด
          if (map.getLayer("chiang-rai-subdistrict-labels")) {
            map.moveLayer("chiang-rai-subdistrict-labels");
          }

          // ---------- 2.4) ผูก checkbox ให้เปิด/ปิด 3D mesh รายอำเภอ ----------
          const toggle3d = document.getElementById("toggle-3d");
          if (toggle3d) {
            const applyVisibility = () => {
              const vis = toggle3d.checked ? "visible" : "none";
              if (map.getLayer("chiang-rai-district-bars")) {
                map.setLayoutProperty("chiang-rai-district-bars", "visibility", vis);
              }
              if (map.getLayer("chiang-rai-district-labels")) {
                map.setLayoutProperty("chiang-rai-district-labels", "visibility", vis);
              }
              if (map.getLayer("chiang-rai-subdistrict-bars")) {
                map.setLayoutProperty("chiang-rai-subdistrict-bars", "visibility", vis);
              }
            };
            toggle3d.addEventListener("change", applyVisibility);
            // ตั้งค่าครั้งแรกตามสถานะ checkbox
            applyVisibility();
          }

          // ---------- 2.5) ผูก checkbox 3D cube รายอำเภอ ----------
          const toggleCube = document.getElementById("toggle-cube");
          if (toggleCube) {
            const applyCubeVisibility = () => {
              const vis = toggleCube.checked ? "visible" : "none";
              if (map.getLayer("chiang-rai-district-cubes-3d")) {
                map.setLayoutProperty("chiang-rai-district-cubes-3d", "visibility", vis);
              }
              if (map.getLayer("chiang-rai-district-cube-labels")) {
                map.setLayoutProperty("chiang-rai-district-cube-labels", "visibility", vis);
              }
              if (map.getLayer("chiang-rai-subdistrict-cubes-3d")) {
                map.setLayoutProperty("chiang-rai-subdistrict-cubes-3d", "visibility", vis);
              }
            };
            toggleCube.addEventListener("change", applyCubeVisibility);
            applyCubeVisibility();
          }

          // ---------- 2.6) สไลเดอร์ปรับขนาดตัวอักษร ----------
          const fontScaleInput = document.getElementById("font-scale");
          const fontScaleValue = document.getElementById("font-scale-value");
          if (fontScaleInput) {
            const applyFontScale = () => {
              const scale = parseFloat(fontScaleInput.value) || 1;
              if (fontScaleValue) {
                fontScaleValue.textContent = Math.round(scale * 100) + "%";
              }
              const districtSize = [
                "interpolate",
                ["linear"],
                ["zoom"],
                5, 11 * scale,
                8, 13 * scale,
                11, 15 * scale
              ];
              const cubeSize = [
                "interpolate",
                ["linear"],
                ["zoom"],
                5, 10 * scale,
                8, 12 * scale,
                11, 14 * scale
              ];
              const subSize = [
                "interpolate",
                ["linear"],
                ["zoom"],
                10.5, 10 * scale,
                12,   12 * scale,
                14,   14 * scale
              ];
              if (map.getLayer("chiang-rai-district-labels")) {
                map.setLayoutProperty("chiang-rai-district-labels", "text-size", districtSize);
              }
              if (map.getLayer("chiang-rai-district-cube-labels")) {
                map.setLayoutProperty("chiang-rai-district-cube-labels", "text-size", cubeSize);
              }
              if (map.getLayer("chiang-rai-subdistrict-labels")) {
                map.setLayoutProperty("chiang-rai-subdistrict-labels", "text-size", subSize);
              }
            };
            fontScaleInput.addEventListener("input", applyFontScale);
            applyFontScale();
          }

          // ---------- 2.7) ปรับระดับซูมที่เริ่มแสดงข้อมูลตำบล ----------
          const subMinZoomInput = document.getElementById("sub-minzoom");
          const subMinZoomValue = document.getElementById("sub-minzoom-value");
          if (subMinZoomInput) {
            const applySubMinZoom = () => {
              const z = parseFloat(subMinZoomInput.value) || 10.5;
              if (subMinZoomValue) subMinZoomValue.textContent = z.toFixed(1);
              // ปรับซูมของชั้นตำบล
              const subLayers = [
                "chiang-rai-subdistricts-outline",
                "chiang-rai-subdistricts",
                "chiang-rai-subdistrict-bars",
                "chiang-rai-subdistrict-cubes-3d",
                "chiang-rai-subdistrict-labels"
              ];
              subLayers.forEach((id) => {
                if (map.getLayer(id)) {
                  map.setLayerZoomRange(id, z, 24);
                }
              });
              // ปรับ maxzoom ของชั้นอำเภอให้จบก่อนถึงตำบล
              const districtRanges = [
                ["chiang-rai-district-bars", 6],
                ["chiang-rai-district-cubes-3d", 6],
                ["chiang-rai-district-labels", 5],
                ["chiang-rai-district-cube-labels", 5]
              ];
              const districtMax = Math.max(z - 0.01, 6.01);
              districtRanges.forEach(([id, min]) => {
                if (map.getLayer(id)) {
                  map.setLayerZoomRange(id, min, districtMax);
                }
              });
            };
            subMinZoomInput.addEventListener("input", applySubMinZoom);
            applySubMinZoom();
          }

          // เมื่อแก้ CSV ให้อัปเดตค่า PM บนแผนที่ทันที
          if (pmEditor) {
            pmEditor.addEventListener("input", () => {
              applyDistrictPmFromEditor();
            });
          }
          if (pmSubEditor) {
            pmSubEditor.addEventListener("input", () => {
              const csvText = pmSubEditor.value;
              const csvMap = parsePmCsv(csvText);
              chiangRaiSubdistricts.features.forEach((f) => {
                const props = f.properties || {};
                const tam = props.tam_en;
                const pm = (csvMap[tam] ?? 25);
                props.tam_pm25 = pm;
                // ใช้สูตรเดียวกับอำเภอ (pm * 200)
                props.tam_pm25_height = pm * 200;
                f.properties = props;
              });
              chiangRaiSubdistrictCubes.features.forEach((f) => {
                const props = f.properties || {};
                const tam = props.tam_en;
                const pm = (csvMap[tam] ?? 25);
                props.tam_pm25 = pm;
                props.tam_pm25_height = pm * 200;
                f.properties = props;
              });
              const subSrc = map.getSource("chiang-rai-subdistricts");
              if (subSrc) subSrc.setData(chiangRaiSubdistricts);
              const subCubeSrc = map.getSource("chiang-rai-subdistrict-cubes");
              if (subCubeSrc) subCubeSrc.setData(chiangRaiSubdistrictCubes);
            });
          }

          // สลับแท็บ CSV (อำเภอ / ตำบล)
          const tabButtons = document.querySelectorAll("#sidebar-tabs .tab-button");
          const districtTab = document.getElementById("district-tab");
          const subdistrictTab = document.getElementById("subdistrict-tab");
          tabButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
              const target = btn.getAttribute("data-target");
              tabButtons.forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              if (target === "subdistrict") {
                districtTab.style.display = "none";
                subdistrictTab.style.display = "flex";
              } else {
                districtTab.style.display = "flex";
                subdistrictTab.style.display = "none";
              }
            });
          });

          // ---------- 3) fitBounds ให้พอดีกับทั้งจังหวัด ----------
          const bounds = new maplibregl.LngLatBounds();

          function addCoords(coords) {
            coords.forEach((c) => {
              if (Array.isArray(c[0])) {
                // MultiPolygon / ซ้อนหลายวง
                addCoords(c);
              } else {
                bounds.extend(c); // [lng, lat]
              }
            });
          }

          if (
            chiangRaiProvince.geometry &&
            chiangRaiProvince.geometry.coordinates
          ) {
            addCoords(chiangRaiProvince.geometry.coordinates);
          }

          if (!bounds.isEmpty()) {
            map.fitBounds(bounds, {
              padding: 40,
              pitch: map.getPitch(),
              bearing: map.getBearing()
            });
          }
        })
        .catch((err) => {
          console.error("โหลดขอบเขตเชียงราย/อำเภอไม่สำเร็จ:", err);
          alert("โหลดขอบเขตเชียงราย/อำเภอจาก GitHub ไม่สำเร็จ ลองรีเฟรชหรือเช็คเน็ตดูครับ");
        });
    });
  </script>
</body>
</html>
