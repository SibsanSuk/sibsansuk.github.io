<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Thailand Satellite 3D View – MapLibre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MapLibre GL CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #map-container {
      position: relative;
      flex: 1 1 auto;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 13px;
      z-index: 10;
      border-radius: 4px;
      line-height: 1.4;
    }
    #sidebar {
      width: 320px;
      max-width: 40%;
      height: 100%;
      box-sizing: border-box;
      border-left: 1px solid #444;
      background: #111;
      color: #eee;
      padding: 8px;
      font-size: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tab-panel {
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #pm25-province-editor,
    #pm25-district-editor {
      width: 100%;
      flex: 1 1 auto;
      height: auto;
      min-height: 0;
      box-sizing: border-box;
      resize: none;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      background: #000;
      color: #0f0;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map-container">
      <div id="map"></div>
      <div id="info">
        <label style="display:block; margin-top:2px; font-size:12px;">
          <input type="checkbox" id="toggle-3d" />
          แสดง 3D mesh รายจังหวัด/อำเภอ
        </label>
        <label style="display:block; margin-top:4px; font-size:12px;">
          <input type="checkbox" id="toggle-cube" checked />
          แสดง 3D cube ตามค่า PM2.5
        </label>
        <label style="display:block; margin-top:6px; font-size:12px;">
          ขนาดตัวอักษร:
          <input
            type="range"
            id="font-scale"
            min="0"
            max="1.5"
            step="0.1"
            value="1"
            style="vertical-align:middle;"
          />
          <span id="font-scale-value">100%</span>
        </label>
        <label style="display:block; margin-top:6px; font-size:12px;">
          เริ่มแสดงอำเภอที่ระดับซูม:
          <input
            type="range"
            id="district-minzoom"
            min="5"
            max="12"
            step="0.1"
            value="7"
            style="vertical-align:middle;"
          />
          <span id="district-minzoom-value">7.0</span>
        </label>
        <div style="margin-top:6px; font-size:12px;">
          <div style="margin-bottom:2px;">สีค่า PM ต่ำสุด / สูงสุด:</div>
          <input type="color" id="color-min" value="#021002" aria-label="สีค่าต่ำสุด" />
          <input type="color" id="color-max" value="#7fff00" aria-label="สีค่าสูงสุด" style="margin-left:6px;" />
        </div>
        <label style="display:block; margin-top:6px; font-size:12px;">
          สเกลความสูง:
          <input
            type="range"
            id="height-scale"
            min="0"
            max="3"
            step="0.1"
            value="1"
            style="vertical-align:middle;"
          />
          <span id="height-scale-value">100%</span>
        </label>
        <div style="margin-top:4px; font-size:11px; opacity:0.85;">
          Zoom: <span id="zoom-value">-</span>
        </div>
        <label style="display:block; margin-top:6px; font-size:12px;">
          <input type="checkbox" id="toggle-threejs-demo" checked />
          ทดลองแสดง 3D text (Three.js)
        </label>
      </div>
    </div>
    <aside id="sidebar">
      <h3 style="margin:4px 0 6px;">ข้อมูล PM2.5</h3>
      <div id="sidebar-tabs" style="margin-bottom:6px;">
        <button type="button" class="tab-button active" data-target="province" style="font-size:12px; padding:2px 6px; margin-right:4px;">
          จังหวัด
        </button>
        <button type="button" class="tab-button" data-target="district" style="font-size:12px; padding:2px 6px;">
          อำเภอ
        </button>
      </div>
      <div id="province-tab" class="tab-panel active">
        <textarea id="pm25-province-editor" spellcheck="false"></textarea>
        <p style="margin:6px 0 0; font-size:11px; color:#ccc;">
          รูปแบบ: <code>pro_en,pm25</code> หนึ่งแถวต่อหนึ่งจังหวัด<br />
          เมื่อแก้ค่าที่นี่ แผนที่ (mesh/cube + label) จะอัปเดตทันที
        </p>
      </div>
      <div id="district-tab" class="tab-panel" style="display:none;">
        <textarea id="pm25-district-editor" spellcheck="false"></textarea>
        <p style="margin:6px 0 0; font-size:11px; color:#ccc;">
          รูปแบบ: <code>amp_en,pm25</code> หนึ่งแถวต่อหนึ่งอำเภอของภาคเหนือ<br />
          สามารถใส่บรรทัดคอมเมนต์ขึ้นต้นด้วย <code>#</code> เพื่อบอกกลุ่มจังหวัด/อำเภอ
        </p>
      </div>
    </aside>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- ใช้ global build ของ Three + GLTFLoader (เวอร์ชัน 0.128.0 ที่ใช้งานได้ในอีกไฟล์) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    // กระจาย GLTFLoader ไปบน window เพื่อให้โค้ด custom layer ใช้ได้
    window.THREE_GLTFLoader = window.THREE && window.THREE.GLTFLoader;
  </script>
  <script>
    // helper สำหรับทำ text เป็น sprite เพื่อวางใน custom 3D layer
    function createTextSprite(text, { fontSize = 72, color = "#fff" } = {}) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const lines = String(text || "").split("\n");
      ctx.font = `${fontSize}px "Open Sans", sans-serif`;
      const width = Math.max(...lines.map((l) => ctx.measureText(l).width), 1);
      const lineHeight = fontSize * 1.2;
      canvas.width = Math.max(Math.ceil(width + fontSize), 1);
      canvas.height = Math.max(Math.ceil(lineHeight * lines.length + fontSize * 0.5), 1);
      ctx.font = `${fontSize}px "Open Sans", sans-serif`;
      ctx.textBaseline = "top";
      ctx.fillStyle = color;
      ctx.strokeStyle = "black";
      ctx.lineWidth = Math.max(fontSize * 0.12, 1);
      lines.forEach((line, i) => {
        const y = i * lineHeight + fontSize * 0.25;
        ctx.strokeText(line, fontSize * 0.3, y);
        ctx.fillText(line, fontSize * 0.3, y);
      });
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.SpriteMaterial({
        map: texture,
        depthTest: false
      });
      return new THREE.Sprite(material);
    }

    function disposeSprite(sprite) {
      if (!sprite) return;
      if (sprite.material?.map) sprite.material.map.dispose();
      if (sprite.material) sprite.material.dispose();
    }

    let threeDemoLayer = null;
    let gltfModelLayer = null;

    // สร้าง style แบบ custom เพื่อใช้ Esri World Imagery เป็น satellite layer
    const style = {
  version: 8,
  glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
  sources: {
    "esri-imagery": {
      type: "raster",
      tiles: [
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      ],
      tileSize: 256,
      attribution:
        "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community"
    }
  },
  layers: [
    {
      id: "esri-imagery",
      type: "raster",
      source: "esri-imagery",
      minzoom: 0,
      maxzoom: 19
    }
  ]
};


    const map = new maplibregl.Map({
      container: "map",
      style,
      center: [100.5, 15.5], // ใจกลางประเทศไทยโดยคร่าว ๆ
      zoom: 5.3,
      pitch: 60, // เอียงกล้องให้เป็นมุมมอง 3D
      bearing: -30, // หมุนแผนที่เล็กน้อย
      antialias: true
    });

    // แสดงระดับการซูมมุมขวาบน (ใน info)
    const zoomValueEl = document.getElementById("zoom-value");
    function updateZoomIndicator() {
      if (!zoomValueEl) return;
      zoomValueEl.textContent = map.getZoom().toFixed(1);
    }
    map.on("zoom", updateZoomIndicator);
    map.on("load", updateZoomIndicator);

    // เพิ่มปุ่มควบคุมมาตรฐาน
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    // ตั้งค่า drag + pitch/bearing แบบ Mapbox/MapLibre:
    // - ลากปกติ: แพน
    // - Shift + ลาก: หมุน/เอียงมุมกล้อง
    map.dragRotate.enable();
    map.touchZoomRotate.enableRotation();

    const NORTHERN_PROVINCES = [
      { en: "Chiang Rai", th: "เชียงราย" },
      { en: "Chiang Mai", th: "เชียงใหม่" },
      { en: "Lampang", th: "ลำปาง" },
      { en: "Lamphun", th: "ลำพูน" },
      { en: "Phayao", th: "พะเยา" },
      { en: "Phrae", th: "แพร่" },
      { en: "Nan", th: "น่าน" },
      { en: "Mae Hong Son", th: "แม่ฮ่องสอน" },
      { en: "Uttaradit", th: "อุตรดิตถ์" },
      { en: "Sukhothai", th: "สุโขทัย" },
      { en: "Tak", th: "ตาก" },
      { en: "Kamphaeng Phet", th: "กำแพงเพชร" },
      { en: "Phitsanulok", th: "พิษณุโลก" },
      { en: "Phichit", th: "พิจิตร" },
      { en: "Phetchabun", th: "เพชรบูรณ์" },
      { en: "Nakhon Sawan", th: "นครสวรรค์" },
      { en: "Uthai Thani", th: "อุทัยธานี" }
    ];
    const northernProvinceEn = new Set(NORTHERN_PROVINCES.map((p) => p.en));
    const northernProvinceTh = new Set(NORTHERN_PROVINCES.map((p) => p.th));

    function isNorthernProvince(props = {}) {
      return northernProvinceEn.has(props.pro_en) || northernProvinceTh.has(props.pro_th);
    }

    // โหลด GeoJSON จังหวัด + อำเภอ ของภาคเหนือทั้งหมด
    map.on("load", () => {
      const PROVINCES_URL =
        "https://raw.githubusercontent.com/chingchai/OpenGISData-Thailand/master/provinces.geojson";
      const DISTRICTS_URL =
        "https://raw.githubusercontent.com/chingchai/OpenGISData-Thailand/master/districts.geojson";

      Promise.all([fetch(PROVINCES_URL), fetch(DISTRICTS_URL)])
        .then(async ([provRes, distRes]) => {
          if (!provRes.ok) throw new Error("โหลด provinces.geojson ไม่สำเร็จ");
          if (!distRes.ok) throw new Error("โหลด districts.geojson ไม่สำเร็จ");

          const provinces = await provRes.json();
          const districts = await distRes.json();

          const northernProvinces = {
            type: "FeatureCollection",
            features: provinces.features.filter((f) => isNorthernProvince(f.properties || {}))
          };

          const northernDistricts = {
            type: "FeatureCollection",
            features: districts.features.filter((f) => isNorthernProvince(f.properties || {}))
          };

          if (!northernProvinces.features.length || !northernDistricts.features.length) {
            throw new Error("ไม่พบข้อมูลภาคเหนือใน GeoJSON");
          }

          function getFeatureCenter(feature) {
            const bounds = new maplibregl.LngLatBounds();
            function addCoords(coords) {
              coords.forEach((c) => {
                if (Array.isArray(c[0])) {
                  addCoords(c);
                } else {
                  bounds.extend(c); // [lng, lat]
                }
              });
            }
            if (feature?.geometry?.coordinates) {
              addCoords(feature.geometry.coordinates);
              const c = bounds.getCenter();
              return c ? [c.lng, c.lat] : null;
            }
            return null;
          }

          function createCenteredSquares(collection, shrinkFactor = 0.25, fallbackSize = 0.05) {
            return {
              type: "FeatureCollection",
              features: collection.features.map((f) => {
                const geom = f.geometry;
                const bbox = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };

                function collectCoords(coords) {
                  coords.forEach((c) => {
                    if (Array.isArray(c[0])) {
                      collectCoords(c);
                    } else {
                      const [lng, lat] = c;
                      if (lng < bbox.minX) bbox.minX = lng;
                      if (lng > bbox.maxX) bbox.maxX = lng;
                      if (lat < bbox.minY) bbox.minY = lat;
                      if (lat > bbox.maxY) bbox.maxY = lat;
                    }
                  });
                }

                if (geom && geom.coordinates) {
                  collectCoords(geom.coordinates);
                }

                const centerLng = (bbox.minX + bbox.maxX) / 2;
                const centerLat = (bbox.minY + bbox.maxY) / 2;
                const width = (bbox.maxX - bbox.minX) * shrinkFactor || fallbackSize;
                const height = (bbox.maxY - bbox.minY) * shrinkFactor || fallbackSize;
                const halfW = width / 2;
                const halfH = height / 2;

                const square = [
                  [centerLng - halfW, centerLat - halfH],
                  [centerLng + halfW, centerLat - halfH],
                  [centerLng + halfW, centerLat + halfH],
                  [centerLng - halfW, centerLat + halfH],
                  [centerLng - halfW, centerLat - halfH]
                ];

                return {
                  type: "Feature",
                  properties: { ...f.properties },
                  geometry: {
                    type: "Polygon",
                    coordinates: [square]
                  }
                };
              })
            };
          }

          const provinceCubes = createCenteredSquares(northernProvinces, 0.25, 0.12);
          const districtCubes = createCenteredSquares(northernDistricts, 0.25, 0.05);

          function seededRandom(text) {
            let h = 0;
            const str = String(text || "");
            for (let i = 0; i < str.length; i++) {
              h = (h << 5) - h + str.charCodeAt(i);
              h |= 0;
            }
            const x = Math.sin(h || 1) * 10000;
            return x - Math.floor(x);
          }

          const pm25ByProvinceDefault = {
            "Chiang Rai": 58,
            "Chiang Mai": 52,
            "Lampang": 45,
            "Lamphun": 38,
            "Phayao": 50,
            "Phrae": 42,
            "Nan": 40,
            "Mae Hong Son": 35,
            "Uttaradit": 44,
            "Sukhothai": 48,
            "Tak": 43,
            "Kamphaeng Phet": 39,
            "Phitsanulok": 46,
            "Phichit": 41,
            "Phetchabun": 47,
            "Nakhon Sawan": 37,
            "Uthai Thani": 33
          };

          const defaultProvinceCsv = NORTHERN_PROVINCES
            .map(({ en }) => `${en},${pm25ByProvinceDefault[en] ?? 35}`)
            .join("\n");

          const pm25ByDistrictDefault = {};
          northernDistricts.features.forEach((f) => {
            const name = (f.properties || {}).amp_en || "unknown";
            pm25ByDistrictDefault[name] = Math.round(18 + seededRandom(name) * 62);
          });

          const defaultDistrictCsv = (() => {
            const byProvince = {};
            northernDistricts.features.forEach((f) => {
              const p = f.properties || {};
              const prov = p.pro_en || "Unknown Province";
              const amp = p.amp_en || "Unknown District";
              if (!byProvince[prov]) byProvince[prov] = [];
              byProvince[prov].push(amp);
            });
            const provNames = Object.keys(byProvince).sort();
            const lines = [];
            provNames.forEach((prov) => {
              lines.push(`# province: ${prov}`);
              byProvince[prov].sort().forEach((amp) => {
                lines.push(`${amp},${pm25ByDistrictDefault[amp] ?? 25}`);
              });
              lines.push("");
            });
            return lines.join("\n");
          })();

          function parsePmCsv(text) {
            const map = {};
            if (!text) return map;
            text.split(/\r?\n/).forEach((line) => {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) return;
              const parts = trimmed.split(",");
              if (parts.length < 2) return;
              const name = parts[0].trim();
              const value = parseFloat(parts[1]);
              if (!name || Number.isNaN(value)) return;
              map[name] = value;
            });
            return map;
          }

          function applyProvincePmFromEditor() {
            const editor = document.getElementById("pm25-province-editor");
            const csvText = editor && editor.value ? editor.value : defaultProvinceCsv;
            const csvMap = parsePmCsv(csvText);

            northernProvinces.features.forEach((f) => {
              const props = f.properties || {};
              const nameEn = props.pro_en;
              const pm = (csvMap[nameEn] ?? pm25ByProvinceDefault[nameEn]) ?? 30;
              props.pm25 = pm;
              props.pm25_height = pm * 320;
              f.properties = props;
            });

            provinceCubes.features.forEach((f) => {
              const props = f.properties || {};
              const nameEn = props.pro_en;
              const pm = (csvMap[nameEn] ?? pm25ByProvinceDefault[nameEn]) ?? 30;
              props.pm25 = pm;
              props.pm25_height = pm * 320;
              f.properties = props;
            });

            const provSrc = map.getSource("north-provinces");
            if (provSrc) provSrc.setData(northernProvinces);
            const provCubeSrc = map.getSource("north-province-cubes");
            if (provCubeSrc) provCubeSrc.setData(provinceCubes);
          }

          function applyDistrictPmFromEditor() {
            const editor = document.getElementById("pm25-district-editor");
            const csvText = editor && editor.value ? editor.value : defaultDistrictCsv;
            const csvMap = parsePmCsv(csvText);

            northernDistricts.features.forEach((f) => {
              const props = f.properties || {};
              const nameEn = props.amp_en;
              const pm = (csvMap[nameEn] ?? pm25ByDistrictDefault[nameEn]) ?? 25;
              props.pm25 = pm;
              props.pm25_height = pm * 200;
              f.properties = props;
            });

            districtCubes.features.forEach((f) => {
              const props = f.properties || {};
              const nameEn = props.amp_en;
              const pm = (csvMap[nameEn] ?? pm25ByDistrictDefault[nameEn]) ?? 25;
              props.pm25 = pm;
              props.pm25_height = pm * 200;
              f.properties = props;
            });

            const distSrc = map.getSource("north-districts");
            if (distSrc) distSrc.setData(northernDistricts);
            const distCubeSrc = map.getSource("north-district-cubes");
            if (distCubeSrc) distCubeSrc.setData(districtCubes);
          }

          const pmProvinceEditor = document.getElementById("pm25-province-editor");
          const pmDistrictEditor = document.getElementById("pm25-district-editor");
          if (pmProvinceEditor && !pmProvinceEditor.value) {
            pmProvinceEditor.value = defaultProvinceCsv;
          }
          if (pmDistrictEditor && !pmDistrictEditor.value) {
            pmDistrictEditor.value = defaultDistrictCsv;
          }

          applyProvincePmFromEditor();
          applyDistrictPmFromEditor();

          map.addSource("north-provinces", {
            type: "geojson",
            data: northernProvinces
          });

          map.addSource("north-districts", {
            type: "geojson",
            data: northernDistricts
          });

          map.addSource("north-province-cubes", {
            type: "geojson",
            data: provinceCubes
          });

          map.addSource("north-district-cubes", {
            type: "geojson",
            data: districtCubes
          });

          map.addLayer({
            id: "north-province-fill",
            type: "fill",
            source: "north-provinces",
            paint: {
              "fill-color": "#ff3333",
              "fill-opacity": 0.05
            }
          });

          map.addLayer({
            id: "north-province-outline",
            type: "line",
            source: "north-provinces",
            paint: {
              "line-color": "#ff3333",
              "line-width": 2.5
            }
          });

          map.addLayer({
            id: "north-district-outline",
            type: "line",
            source: "north-districts",
            paint: {
              "line-color": "#ffff66",
              "line-width": 1.2
            }
          });

          map.addLayer({
            id: "north-province-bars",
            type: "fill-extrusion",
            source: "north-provinces",
            minzoom: 4,
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   "#021002",
                30,  "#145a32",
                60,  "#32cd32",
                100, "#7fff00"
              ],
              "fill-extrusion-height": ["get", "pm25_height"],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.85
            }
          });

          map.addLayer({
            id: "north-province-cubes-3d",
            type: "fill-extrusion",
            source: "north-province-cubes",
            layout: {
              visibility: "none"
            },
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   "#021002",
                30,  "#145a32",
                60,  "#32cd32",
                100, "#7fff00"
              ],
              "fill-extrusion-height": ["get", "pm25_height"],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.9
            }
          });

          map.addLayer({
            id: "north-district-bars",
            type: "fill-extrusion",
            source: "north-districts",
            minzoom: 6,
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   "#021002",
                30,  "#145a32",
                60,  "#32cd32",
                100, "#7fff00"
              ],
              "fill-extrusion-height": ["get", "pm25_height"],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.9
            }
          });

          map.addLayer({
            id: "north-district-cubes-3d",
            type: "fill-extrusion",
            source: "north-district-cubes",
            layout: {
              visibility: "none"
            },
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   "#021002",
                30,  "#145a32",
                60,  "#32cd32",
                100, "#7fff00"
              ],
              "fill-extrusion-height": ["get", "pm25_height"],
              "fill-extrusion-base": 0,
              "fill-extrusion-opacity": 0.9
            }
          });

          map.addLayer({
            id: "north-province-labels",
            type: "symbol",
            source: "north-provinces",
            minzoom: 4,
            layout: {
              "text-field": [
                "concat",
                ["get", "pro_en"],
                "\n",
                ["to-string", ["get", "pm25"]]
              ],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                4, 12,
                6, 14,
                8, 16
              ],
              "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              "text-anchor": "bottom",
              "text-allow-overlap": true,
              "text-ignore-placement": true,
              "text-offset": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   ["literal", [0, 0.4]],
                30,  ["literal", [0, 1.0]],
                60,  ["literal", [0, 1.6]],
                100, ["literal", [0, 2.2]]
              ],
              "text-pitch-alignment": "viewport",
              "text-rotation-alignment": "viewport"
            },
            paint: {
              "text-color": "#ffffff",
              "text-halo-color": "#000000",
              "text-halo-width": 1.4
            }
          });

          map.addLayer({
            id: "north-province-cube-labels",
            type: "symbol",
            source: "north-province-cubes",
            layout: {
              "text-field": [
                "concat",
                ["get", "pro_en"],
                "\n",
                ["to-string", ["get", "pm25"]]
              ],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                4, 11,
                6, 13,
                8, 15
              ],
              "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              "text-anchor": "bottom",
              "text-allow-overlap": true,
              "text-ignore-placement": true,
              "text-offset": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   ["literal", [0, 0.5]],
                30,  ["literal", [0, 1.1]],
                60,  ["literal", [0, 1.7]],
                100, ["literal", [0, 2.3]]
              ],
              "text-pitch-alignment": "viewport",
              "text-rotation-alignment": "viewport"
            },
            paint: {
              "text-color": "#ffffff",
              "text-halo-color": "#000000",
              "text-halo-width": 1.4
            }
          });

          map.addLayer({
            id: "north-district-labels",
            type: "symbol",
            source: "north-districts",
            minzoom: 6,
            layout: {
              "text-field": [
                "concat",
                ["get", "amp_en"],
                "\n",
                ["to-string", ["get", "pm25"]]
              ],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                6, 11,
                9, 13,
                12, 15
              ],
              "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              "text-anchor": "bottom",
              "text-allow-overlap": true,
              "text-ignore-placement": true,
              "text-offset": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   ["literal", [0, 0.3]],
                30,  ["literal", [0, 0.9]],
                60,  ["literal", [0, 1.5]],
                100, ["literal", [0, 2.2]]
              ],
              "text-pitch-alignment": "viewport",
              "text-rotation-alignment": "viewport"
            },
            paint: {
              "text-color": "#ffffff",
              "text-halo-color": "#000000",
              "text-halo-width": 1.5
            }
          });

          map.addLayer({
            id: "north-district-cube-labels",
            type: "symbol",
            source: "north-district-cubes",
            layout: {
              "text-field": [
                "concat",
                ["get", "amp_en"],
                "\n",
                ["to-string", ["get", "pm25"]]
              ],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                6, 10,
                9, 12,
                12, 14
              ],
              "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              "text-anchor": "bottom",
              "text-allow-overlap": true,
              "text-ignore-placement": true,
              "text-offset": [
                "interpolate",
                ["linear"],
                ["get", "pm25"],
                0,   ["literal", [0, 0.4]],
                30,  ["literal", [0, 1.0]],
                60,  ["literal", [0, 1.7]],
                100, ["literal", [0, 2.4]]
              ],
              "text-pitch-alignment": "viewport",
              "text-rotation-alignment": "viewport"
            },
            paint: {
              "text-color": "#ffffff",
              "text-halo-color": "#000000",
              "text-halo-width": 1.5
            }
          });

          const toggle3d = document.getElementById("toggle-3d");
          if (toggle3d) {
            const applyVisibility = () => {
              const vis = toggle3d.checked ? "visible" : "none";
              ["north-province-bars", "north-district-bars", "north-province-labels", "north-district-labels"].forEach((id) => {
                if (map.getLayer(id)) {
                  map.setLayoutProperty(id, "visibility", vis);
                }
              });
            };
            toggle3d.addEventListener("change", applyVisibility);
            applyVisibility();
          }

          const toggleCube = document.getElementById("toggle-cube");
          if (toggleCube) {
            const applyCubeVisibility = () => {
              const vis = toggleCube.checked ? "visible" : "none";
              ["north-province-cubes-3d", "north-district-cubes-3d", "north-province-cube-labels", "north-district-cube-labels"].forEach((id) => {
                if (map.getLayer(id)) {
                  map.setLayoutProperty(id, "visibility", vis);
                }
              });
            };
            toggleCube.addEventListener("change", applyCubeVisibility);
            applyCubeVisibility();
          }

          const fontScaleInput = document.getElementById("font-scale");
          const fontScaleValue = document.getElementById("font-scale-value");
          if (fontScaleInput) {
            const applyFontScale = () => {
              const rawScale = parseFloat(fontScaleInput.value);
              const scale = Number.isFinite(rawScale) ? rawScale : 1;
              if (fontScaleValue) {
                fontScaleValue.textContent = Math.round(scale * 100) + "%";
              }
              const provinceSize = [
                "interpolate",
                ["linear"],
                ["zoom"],
                4, 12 * scale,
                6, 14 * scale,
                8, 16 * scale
              ];
              const provinceCubeSize = [
                "interpolate",
                ["linear"],
                ["zoom"],
                4, 11 * scale,
                6, 13 * scale,
                8, 15 * scale
              ];
              const districtSize = [
                "interpolate",
                ["linear"],
                ["zoom"],
                6, 11 * scale,
                9, 13 * scale,
                12, 15 * scale
              ];
              const districtCubeSize = [
                "interpolate",
                ["linear"],
                ["zoom"],
                6, 10 * scale,
                9, 12 * scale,
                12, 14 * scale
              ];
              if (map.getLayer("north-province-labels")) {
                map.setLayoutProperty("north-province-labels", "text-size", provinceSize);
              }
              if (map.getLayer("north-province-cube-labels")) {
                map.setLayoutProperty("north-province-cube-labels", "text-size", provinceCubeSize);
              }
              if (map.getLayer("north-district-labels")) {
                map.setLayoutProperty("north-district-labels", "text-size", districtSize);
              }
              if (map.getLayer("north-district-cube-labels")) {
                map.setLayoutProperty("north-district-cube-labels", "text-size", districtCubeSize);
              }
            };
            fontScaleInput.addEventListener("input", applyFontScale);
            applyFontScale();
          }

          const colorMinInput = document.getElementById("color-min");
          const colorMaxInput = document.getElementById("color-max");
          const defaultMin = "#021002";
          const defaultMax = "#7fff00";

          function getColor(value, fallback) {
            if (typeof value !== "string") return fallback;
            const v = value.trim();
            return /^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(v) ? v : fallback;
          }

          function colorExpr(field, minColor, maxColor) {
            return [
              "interpolate",
              ["linear"],
              ["coalesce", ["get", field], 0],
              0, minColor,
              100, maxColor
            ];
          }

          function applyColorScale() {
            const minColor = getColor(colorMinInput?.value, defaultMin);
            const maxColor = getColor(colorMaxInput?.value, defaultMax);

            const pmExpr = colorExpr("pm25", minColor, maxColor);

            const paintTargets = [
              ["north-province-bars", "fill-extrusion-color", pmExpr],
              ["north-province-cubes-3d", "fill-extrusion-color", pmExpr],
              ["north-district-bars", "fill-extrusion-color", pmExpr],
              ["north-district-cubes-3d", "fill-extrusion-color", pmExpr],
              ["north-district-outline", "line-color", pmExpr]
            ];
            paintTargets.forEach(([layer, prop, expr]) => {
              if (map.getLayer(layer)) {
                map.setPaintProperty(layer, prop, expr);
              }
            });
          }

          if (colorMinInput && colorMaxInput) {
            colorMinInput.addEventListener("input", applyColorScale);
            colorMaxInput.addEventListener("input", applyColorScale);
            applyColorScale();
          }

          const heightScaleInput = document.getElementById("height-scale");
          const heightScaleValue = document.getElementById("height-scale-value");
          if (heightScaleInput) {
            const applyHeightScale = () => {
              const raw = parseFloat(heightScaleInput.value);
              const scale = Number.isFinite(raw) ? raw : 1;
              if (heightScaleValue) {
                heightScaleValue.textContent = Math.round(scale * 100) + "%";
              }
              const scaledHeight = ["*", ["get", "pm25_height"], scale];
              const targets = [
                "north-province-bars",
                "north-province-cubes-3d",
                "north-district-bars",
                "north-district-cubes-3d"
              ];
              targets.forEach((id) => {
                if (map.getLayer(id)) {
                  map.setPaintProperty(id, "fill-extrusion-height", scaledHeight);
                }
              });
            };
            heightScaleInput.addEventListener("input", applyHeightScale);
            applyHeightScale();
          }

          const districtMinZoomInput = document.getElementById("district-minzoom");
          const districtMinZoomValue = document.getElementById("district-minzoom-value");
          if (districtMinZoomInput) {
            const applyDistrictMinZoom = () => {
              const z = parseFloat(districtMinZoomInput.value) || 7;
              if (districtMinZoomValue) districtMinZoomValue.textContent = z.toFixed(1);
              const provinceMax = Math.max(z - 0.01, 4.01);
              const provinceLayers = [
                "north-province-bars",
                "north-province-cubes-3d",
                "north-province-labels",
                "north-province-cube-labels"
              ];
              provinceLayers.forEach((id) => {
                if (map.getLayer(id)) {
                  map.setLayerZoomRange(id, 3.8, provinceMax);
                }
              });
              const districtLayers = [
                "north-district-outline",
                "north-district-bars",
                "north-district-cubes-3d",
                "north-district-labels",
                "north-district-cube-labels"
              ];
              districtLayers.forEach((id) => {
                if (map.getLayer(id)) {
                  map.setLayerZoomRange(id, z, 24);
                }
              });
            };
            districtMinZoomInput.addEventListener("input", applyDistrictMinZoom);
            applyDistrictMinZoom();
          }

          if (pmProvinceEditor) {
            pmProvinceEditor.addEventListener("input", applyProvincePmFromEditor);
          }
          if (pmDistrictEditor) {
            pmDistrictEditor.addEventListener("input", applyDistrictPmFromEditor);
          }

          const tabButtons = document.querySelectorAll("#sidebar-tabs .tab-button");
          const provinceTab = document.getElementById("province-tab");
          const districtTab = document.getElementById("district-tab");
          tabButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
              const target = btn.getAttribute("data-target");
              tabButtons.forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              if (target === "district") {
                provinceTab.style.display = "none";
                districtTab.style.display = "flex";
              } else {
                provinceTab.style.display = "flex";
                districtTab.style.display = "none";
              }
            });
          });

          const bounds = new maplibregl.LngLatBounds();

          function addCoords(coords) {
            coords.forEach((c) => {
              if (Array.isArray(c[0])) {
                addCoords(c);
              } else {
                bounds.extend(c);
              }
            });
          }

          northernProvinces.features.forEach((f) => {
            if (f.geometry?.coordinates) {
              addCoords(f.geometry.coordinates);
            }
          });

          if (!bounds.isEmpty()) {
            map.fitBounds(bounds, {
              padding: 40,
              pitch: map.getPitch(),
              bearing: map.getBearing()
            });

            const centerLL = bounds.getCenter ? bounds.getCenter() : null;
            const demoLngLat = centerLL
              ? [centerLL.lng, centerLL.lat]
              : [100.5, 15.5];
            const demoHeightMeters = 2500;

            if (!map.getLayer("threejs-demo-label")) {
              threeDemoLayer = {
                id: "threejs-demo-label",
                type: "custom",
                renderingMode: "3d",
                camera: null,
                scene: null,
                renderer: null,
                sprite: null,
                cube: null,
                visible: true,
                mapRef: null,
                onAdd(mapInstance, gl) {
                  this.mapRef = mapInstance;
                  this.camera = new THREE.Camera();
                  this.scene = new THREE.Scene();
                  this.renderer = new THREE.WebGLRenderer({
                    canvas: mapInstance.getCanvas(),
                    context: gl
                  });
                  this.renderer.autoClear = false;
                  const mc = maplibregl.MercatorCoordinate.fromLngLat(
                    demoLngLat,
                    demoHeightMeters
                  );

                  const sprite = createTextSprite("Three.js\\nDemo", {
                    fontSize: 96,
                    color: "#00ffe6"
                  });
                  sprite.position.set(mc.x, mc.y, mc.z + 1200);
                  const spriteScale = 900;
                  sprite.scale.set(spriteScale, spriteScale, 1);
                  this.scene.add(sprite);
                  this.sprite = sprite;

                  const boxSize = 1800;
                  const geometry = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
                  const material = new THREE.MeshNormalMaterial();
                  const cube = new THREE.Mesh(geometry, material);
                  cube.position.set(mc.x, mc.y, mc.z);
                  this.scene.add(cube);
                  this.cube = cube;
                },
                render(gl, matrix) {
                  if (!this.visible) return;
                  if (!this.camera || !this.renderer) return;
                  if (this.cube) {
                    this.cube.rotation.x += 0.01;
                    this.cube.rotation.y += 0.015;
                  }
                  const m = new THREE.Matrix4().fromArray(matrix);
                  this.camera.projectionMatrix = m;
                  this.renderer.state.reset();
                  this.renderer.render(this.scene, this.camera);
                  this.mapRef?.triggerRepaint();
                }
              };

              map.addLayer(threeDemoLayer);

              const toggleThreeDemo = document.getElementById("toggle-threejs-demo");
              if (toggleThreeDemo) {
                const applyVis = () => {
                  threeDemoLayer.visible = !!toggleThreeDemo.checked;
                  map.triggerRepaint();
                };
                toggleThreeDemo.addEventListener("change", applyVis);
                applyVis();
              }
            }

            if (!map.getLayer("north-gltf-dish") && window.THREE_GLTFLoader) {
              const MODEL_URL = "https://sibsansuk.github.io/epona.glb";
              const refFeature =
                northernDistricts.features.find((f) => (f.properties || {}).amp_en) ||
                northernProvinces.features[0];
              const modelOrigin = getFeatureCenter(refFeature) || demoLngLat;
              const modelAltitude = 0;
              const mcModel = maplibregl.MercatorCoordinate.fromLngLat(
                modelOrigin,
                modelAltitude
              );
              const modelRotate = [Math.PI / 2, 0, 0];
              const modelScale = mcModel.meterInMercatorCoordinateUnits() * 120;

              gltfModelLayer = {
                id: "north-gltf-dish",
                type: "custom",
                renderingMode: "3d",
                camera: null,
                scene: null,
                renderer: null,
                model: null,
                visible: true,
                mapRef: null,
                onAdd(mapInstance, gl) {
                  this.mapRef = mapInstance;
                  this.camera = new THREE.Camera();
                  this.scene = new THREE.Scene();
                  this.renderer = new THREE.WebGLRenderer({
                    canvas: mapInstance.getCanvas(),
                    context: gl
                  });
                  this.renderer.autoClear = false;

                  const LoaderClass = window.THREE_GLTFLoader || THREE.GLTFLoader;
                  if (!LoaderClass) {
                    console.error("GLTFLoader ไม่พร้อมใช้งาน");
                    return;
                  }
                  const loader = new LoaderClass();
                  loader.load(
                    MODEL_URL,
                    (gltf) => {
                      this.model = gltf.scene;
                      this.model.scale.set(modelScale, modelScale, modelScale);
                      this.model.rotation.set(modelRotate[0], modelRotate[1], modelRotate[2]);
                      this.model.position.set(mcModel.x, mcModel.y, mcModel.z);
                      this.scene.add(this.model);
                      this.mapRef?.triggerRepaint();
                    },
                    undefined,
                    (err) => {
                      console.error("โหลด glTF โมเดลไม่สำเร็จ", err);
                    }
                  );
                },
                render(gl, matrix) {
                  if (!this.visible) return;
                  if (!this.camera || !this.renderer) return;
                  if (this.model) {
                    this.model.rotation.y += 0.01;
                  }
                  const m = new THREE.Matrix4().fromArray(matrix);
                  this.camera.projectionMatrix = m;
                  this.renderer.state.reset();
                  this.renderer.render(this.scene, this.camera);
                  if (this.model) this.mapRef?.triggerRepaint();
                }
              };

              map.addLayer(gltfModelLayer);

              const toggleThreeDemo = document.getElementById("toggle-threejs-demo");
              if (toggleThreeDemo) {
                const applyVisDish = () => {
                  gltfModelLayer.visible = !!toggleThreeDemo.checked;
                  map.triggerRepaint();
                };
                toggleThreeDemo.addEventListener("change", applyVisDish);
                applyVisDish();
              }
            }
          }
        })
        .catch((err) => {
          console.error("โหลดขอบเขตจังหวัด/อำเภอภาคเหนือไม่สำเร็จ:", err);
          alert("โหลดขอบเขตจังหวัด/อำเภอในภาคเหนือจาก GitHub ไม่สำเร็จ ลองรีเฟรชหรือเช็คเน็ตดูครับ");
        });
    });
  </script>
