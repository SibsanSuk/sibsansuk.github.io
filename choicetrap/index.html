<script>(() => {

  const current = routes.includes(route) ? route : "/menu";
  const gadget = current.startsWith("/gadget");
  const shops = {"food": {"html": "\n\u003cheader>\u003cb>\u003cspan aria-hidden=\"true\">🍔\u003c/span> ThinkBurger\u003c/b>\n  \u003cnav>\u003ca href=\"?demo=/menu\">เมนู\u003c/a>\u003ca href=\"?demo=/cart\" id=\"cartlink\">ตะกร้า\u003c/a>\u003c/nav>\u003c/header>\n\u003cmain id=\"m\">\u003c/main>\n\n\n\n", "css": "\n  body { margin: 0; font: 16px/1.6 system-ui, \"Sukhumvit Set\", \"Noto Sans Thai\", sans-serif; color: #2B1A12;\n    background: #FFF4E4 radial-gradient(1200px 400px at 50% -120px, #FFE1B8, transparent) no-repeat; }\n  header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: #fff;\n    border-top: 4px solid #E63B2E; box-shadow: 0 6px 18px -12px rgba(120,40,10,.35); }\n  header b { color: #E63B2E; font-size: 21px; font-weight: 800; letter-spacing: -.2px; }\n  header nav { margin-left: auto; display: flex; gap: 18px; }\n  header a { color: #2B1A12; text-decoration: none; font-weight: 500; }\n  main { max-width: 760px; margin: 24px auto; padding: 0 24px; display: grid; gap: 14px; }\n  .note { font-size: 13px; color: #8A6A55; }\n  .card { background: #fff; border-radius: 18px; padding: 12px 16px 12px 12px; display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; align-items: center;\n    box-shadow: 0 10px 24px -16px rgba(150,60,10,.45); transition: transform .15s ease, box-shadow .15s ease; }\n  .card:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -16px rgba(150,60,10,.5); }\n  .card.hero { border: 2px solid #FFC21A; background: linear-gradient(120deg, #FFFBEA, #fff 60%); }\n  .card h3 { margin: 0; font-size: 18px; }\n  .card p { margin: 0; color: #8A6A55; font-size: 14px; }\n  .badge { background: #FFC21A; color: #2B1A12; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; margin-left: 6px; display: inline-block; white-space: nowrap; vertical-align: 2px; line-height: 1.5; }\n  .price { font-weight: 800; font-size: 19px; color: #E63B2E; }\n  .price s { color: #B9A797; font-weight: 400; font-size: 14px; margin-right: 6px; }\n  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 16px; background: #E63B2E; color: #fff; cursor: pointer;\n    box-shadow: 0 6px 14px -8px rgba(230,59,46,.8); transition: transform .1s ease, background .15s ease; }\n  button:hover { background: #D12F22; }\n  button:active { transform: scale(.97); }\n  button:focus-visible { outline: 3px solid #FFC21A; outline-offset: 2px; }\n  button.quiet { background: #FFE8D2; color: #D2381F; box-shadow: none; }\n  button.quiet:hover { background: #FFDABC; }\n  .promo { background: linear-gradient(100deg, #FF4D2E, #FF8A1F); color: #fff; padding: 12px 14px; border-radius: 14px; font-weight: 700;\n    box-shadow: 0 10px 24px -14px rgba(255,77,46,.9); }\n  .card img { width: 112px; height: 84px; border-radius: 12px; object-fit: cover; background: #FFE8D2; }\n  .card.hero img { height: 96px; }\n  .line img { width: 64px; height: 48px; border-radius: 10px; object-fit: cover; background: #FFE8D2; }\n  .line { background: #fff; border-radius: 16px; padding: 12px 16px 12px 12px; display: grid; grid-template-columns: 64px 1fr auto auto; gap: 14px; align-items: center;\n    box-shadow: 0 10px 24px -18px rgba(150,60,10,.45); }\n  .line h3 { margin: 0; font-size: 17px; }\n  .line small { color: #8A6A55; }\n  .qty { display: inline-flex; gap: 8px; align-items: center; }\n  .qty button { padding: 4px 10px; background: #FFE8D2; color: #D2381F; box-shadow: none; }\n  .suggest { background: #FFF0C7; border-radius: 16px; padding: 14px 16px; }\n  .suggest .card { box-shadow: none; }\n  .summary { background: #fff; border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; }\n  .summary div { display: flex; justify-content: space-between; }\n  .summary .grand { font-weight: 800; font-size: 19px; border-top: 1px dashed #F6DEC4; padding-top: 8px; }\n  .summary .grand span:last-child { color: #E63B2E; }\n  .pay { display: flex; gap: 12px; align-items: center; }\n  .pay a { color: #D2381F; }\n\n@media(max-width:600px) {\n  header { flex-wrap:wrap; padding:12px; gap:8px; }\n  header nav { gap:12px; }\n  main { padding:0 12px; }\n  .card { grid-template-columns:96px 1fr; }\n  .card img, .card.hero img { width:96px; height:76px; }\n  .card .pay { grid-column:1 / -1; justify-content:flex-end; }\n  .line { grid-template-columns:48px 1fr; gap:8px; }\n  .line img { width:48px; height:40px; }\n}\n"}, "gadget": {"html": "\n\u003cheader>\u003cb>ThinkGadget\u003c/b>\n  \u003cnav>\u003ca href=\"?demo=/gadget\">สินค้า\u003c/a>\u003ca href=\"?demo=/gadget/cart\" id=\"cartlink\">ตะกร้า\u003c/a>\u003c/nav>\u003c/header>\n\u003cmain id=\"m\">\u003c/main>\n\n\n\n", "css": "\n  body { margin: 0; font: 16px/1.6 system-ui, \"Sukhumvit Set\", \"Noto Sans Thai\", sans-serif; background: #F4F5F7; color: #16181D; }\n  header { position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 14px -10px rgba(0,0,0,.25); display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #E3E5EA; }\n  header b { color: #1F4FD8; font-size: 20px; }\n  header nav { margin-left: auto; display: flex; gap: 18px; }\n  header a { color: #16181D; text-decoration: none; }\n  main { max-width: 920px; margin: 24px auto; padding: 0 24px; }\n  .note { font-size: 13px; color: #6B7080; }\n  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n  .card { background: #fff; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }\n  .card.featured { grid-column: span 2; grid-row: span 2; border: 2px solid #1F4FD8; }\n  .card img { width: 100%; max-width: 160px; height: 110px; object-fit: contain; }\n  .card.featured img { max-width: none; height: 300px; }\n  .card h3 { margin: 0; font-size: 17px; }\n  .badges { display: flex; gap: 6px; }\n  .badge { background: #FFB020; color: #16181D; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }\n  .badge.blue { background: #E6EEFF; color: #1F4FD8; }\n  .price { font-weight: 700; font-size: 18px; }\n  .btn, button { display: inline-block; font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; background: #1F4FD8; color: #fff; cursor: pointer; text-decoration: none; text-align: center; }\n  .btn.quiet { background: #E9EBF0; color: #16181D; }\n  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; background: #fff; border-radius: 16px; padding: 24px; }\n  .detail img { width: 100%; height: 280px; object-fit: contain; }\n  .opt { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #EEF0F3; }\n  .line { background: #fff; border-radius: 14px; padding: 12px 16px; display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; margin-bottom: 10px; }\n  .line img { width: 64px; height: 48px; object-fit: contain; }\n  .line h3 { margin: 0; font-size: 16px; }\n  .summary { background: #fff; border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; margin: 14px 0; }\n  .summary div { display: flex; justify-content: space-between; }\n  .summary .grand { font-weight: 700; font-size: 19px; border-top: 1px dashed #E3E5EA; padding-top: 8px; }\n\n\n@media(max-width:600px) {\n  header { flex-wrap:wrap; padding:12px; gap:8px; }\n  header nav { gap:12px; }\n  main { padding:0 12px; }\n  .card { grid-template-columns:72px 1fr; }\n  .card img { width:72px; }\n  .card .pay { grid-column:1 / -1; justify-content:flex-end; }\n  .line { grid-template-columns:48px 1fr; gap:8px; }\n  .line img { width:48px; }\n  .grid, .detail { grid-template-columns:1fr; }\n  .card.featured { grid-column:auto; grid-row:auto; }\n  .grid .card img { width:100%; }\n  .card.featured img { height:180px; }\n  }\n"}};
  const shop = gadget ? shops.gadget : shops.food;
  document.title = gadget ? "ThinkGadget" : "ThinkBurger";
  document.getElementById("shop-style").textContent = shop.css;
  document.body.innerHTML = shop.html;

  function navigate(next) {
    const url = new URL(window.location.href);
    url.searchParams.set("demo", next.replace(/\/+$/, "") || "/menu");
    window.location.assign(url.href);
  }
  // The actual extension gets a virtual shop pathname. Browser navigation always
  // reloads this same HTM file, including when hosted in a repository subfolder.
  const location = {
    pathname: current,
    search: window.location.search,
    hostname: window.location.hostname,
    origin: window.location.origin,
    get href() { return window.location.href; },
    set href(next) { navigate(next); },
    assign: navigate
  };
  // Keep this single-file demo's data separate from other pages on the same host.
  const prefix = "thinkagain-single:" + window.location.pathname + ":";
  const localStorage = {
    getItem: key => window.localStorage.getItem(prefix + key),
    setItem: (key, value) => window.localStorage.setItem(prefix + key, value),
    removeItem: key => window.localStorage.removeItem(prefix + key)
  };

  // Fly a copy of the product picture into the header cart link, then bump the link.
  // Lives on <html> (outside <body>) so it never looks like page content.
  function flyToCart(from, onLand) {
    const target = document.getElementById("cartlink");
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!from || !target || reduce || !from.animate) { onLand(); return; }
    const a = from.getBoundingClientRect();
    const b = target.getBoundingClientRect();
    if (!a.width || !b.width) { onLand(); return; }
    const ghost = from.cloneNode(from.tagName !== "IMG"); // tickets need their content
    ghost.removeAttribute("id");
    ghost.alt = "";
    ghost.setAttribute("aria-hidden", "true");
    Object.assign(ghost.style, {
      position: "fixed", left: a.left + "px", top: a.top + "px", width: a.width + "px", height: a.height + "px",
      margin: "0", zIndex: "2147483000", pointerEvents: "none", objectFit: "contain",
      borderRadius: "12px", boxShadow: "0 12px 28px -10px rgba(0,0,0,.45)", willChange: "transform, opacity"
    });
    document.documentElement.appendChild(ghost);
    const dx = b.left + 11 - (a.left + a.width / 2); // aim at the cart icon (22px, left edge of the link)
    const dy = b.top + b.height / 2 - (a.top + a.height / 2);
    // Arc upward, but keep the picture (shrunk to .7 at the peak) inside the window.
    const lift = Math.max(0, Math.min(120, Math.abs(dy) * 0.35 + 40, a.top + a.height * 0.15 + dy * 0.35 - 8));
    const end = Math.max(0.08, 28 / Math.max(a.width, a.height));
    const flight = ghost.animate([
      { transform: "translate(0,0) scale(1)", opacity: 1 },
      { transform: `translate(${dx * 0.35}px, ${dy * 0.35 - lift}px) scale(.7)`, opacity: 1, offset: 0.4 },
      { transform: `translate(${dx}px, ${dy}px) scale(${end})`, opacity: 0.4 }
    ], { duration: 750, easing: "cubic-bezier(.45,.05,.55,.95)", fill: "forwards" });
    let landed = false;
    const land = () => {
      if (landed) return;
      landed = true;
      ghost.remove();
      onLand();
      // Catch the item: squash down, spring up, settle with a small wobble.
      target.getAnimations().forEach(x => x.cancel());
      target.animate([
        { transform: "translateY(0) scale(1, 1)", offset: 0 },
        { transform: "translateY(2px) scale(1.25, .75)", color: "#CF4510", offset: 0.18 },
        { transform: "translateY(-9px) scale(.9, 1.15)", color: "#CF4510", offset: 0.42 },
        { transform: "translateY(0) scale(1.08, .94)", offset: 0.66 },
        { transform: "translateY(-2px) scale(.98, 1.03)", offset: 0.82 },
        { transform: "translateY(0) scale(1, 1)", offset: 1 }
      ], { duration: 650, easing: "ease-out" });
      target.classList.remove("cart-caught");
      void target.offsetWidth; // restart the ring
      target.classList.add("cart-caught");
    };
    flight.onfinish = land;
    setTimeout(land, 1200); // safety net if the animation never finishes (hidden tab)
  }
  // Small confirmation bubble at the bottom of the screen.
  let toastTimer = 0;
  function toast(text) {
    document.querySelector(".shop-toast")?.remove();
    const el = document.createElement("div");
    el.className = "shop-toast";
    el.setAttribute("role", "status");
    el.textContent = text;
    document.documentElement.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2400);
  }
  if (!document.getElementById("cart-bump-style")) {
    const st = document.createElement("style");
    st.id = "cart-bump-style";
    // The icon is a CSS pseudo-element, so the link's text stays "ตะกร้า (n)".
    const cartIcon = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h2.2l2.4 11a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8l1.6-7.5H6"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>');
    st.textContent = `
      #cartlink { position:relative; display:inline-flex; align-items:center; gap:6px; transform-origin:50% 100%; }
      #cartlink::before { content:""; width:22px; height:22px; background:currentColor;
        -webkit-mask:url("${cartIcon}") center / contain no-repeat; mask:url("${cartIcon}") center / contain no-repeat; }
      #cartlink::after { content:""; position:absolute; left:11px; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px;
        border-radius:50%; border:2px solid #CF4510; opacity:0; pointer-events:none; }
      #cartlink.cart-caught::after { animation:cart-ring .6s ease-out; }
      @keyframes cart-ring { 0% { transform:scale(.4); opacity:.8; } 100% { transform:scale(1.6); opacity:0; } }
      @media (prefers-reduced-motion: reduce) { #cartlink.cart-caught::after { animation:none; } }`;
    document.head.appendChild(st);
  }

  if (gadget) {
    (() => {

  // Fixture only: a laptop shop that uses the persuasive patterns ThinkAgain reflects on.
  const svg = body => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110">${body}</svg>`);
  const laptop = (screen, base) => svg(`<rect x="28" y="14" width="104" height="66" rx="6" fill="${base}"/><rect x="34" y="20" width="92" height="54" rx="3" fill="${screen}"/><path d="M14 84h132l-8 12H22z" fill="${base}"/>`);
  const PRODUCTS = [
    { id: "pro", name: "ThinkBook Pro 14", price: 39990, desc: "จอ 14\" · RAM 32GB · SSD 1TB", img: laptop("#7FA3FF", "#3B3F4A"), featured: true },
    { id: "air", name: "ThinkBook Air 13", price: 24990, desc: "จอ 13\" · RAM 16GB · SSD 512GB", img: laptop("#9BE0D2", "#8E95A3") },
    { id: "lite", name: "ThinkBook Lite 14", price: 17990, desc: "จอ 14\" · RAM 8GB · SSD 256GB", img: laptop("#F7D27A", "#A7ADB8") }
  ];
  const ADDONS = [
    { id: "care", name: "ประกันอุบัติเหตุ 1 ปี", price: 1290, preset: true, img: svg('<path d="M80 12l46 16v28c0 28-20 44-46 52-26-8-46-24-46-52V28z" fill="#1F4FD8"/><path d="M62 58l12 12 24-26" stroke="#fff" stroke-width="8" fill="none"/>') },
    { id: "bag", name: "กระเป๋าโน้ตบุ๊ก", price: 590, preset: true, img: svg('<rect x="22" y="34" width="116" height="66" rx="10" fill="#3B3F4A"/><path d="M60 34v-10h40v10" stroke="#3B3F4A" stroke-width="8" fill="none"/>') },
    { id: "mouse", name: "เมาส์ไร้สาย", price: 390, preset: false, img: svg('<rect x="58" y="20" width="44" height="72" rx="22" fill="#8E95A3"/>') }
  ];
  const baht = n => "฿" + n.toLocaleString("th-TH");
  const load = () => { try { return JSON.parse(localStorage.getItem("gadget-cart") || "[]"); } catch { return []; } };
  const save = c => localStorage.setItem("gadget-cart", JSON.stringify(c));
  const m = document.getElementById("m");
  const path = location.pathname.replace(/\/+$/, "");
  document.getElementById("cartlink").textContent = "ตะกร้า (" + load().length + ")";

  if (path.startsWith("/gadget/cart")) {
    const cart = load();
    const total = cart.reduce((a, l) => a + l.price, 0);
    m.innerHTML = `<h1>ตะกร้าสินค้า</h1>
      ${cart.map(l => `<div class="line"><img src="${l.img}" alt="${l.name}"><div><h3>${l.name}</h3></div><span class="price">${baht(l.price)}</span></div>`).join("") || "<p>ตะกร้าว่าง</p>"}
      <section class="summary"><div><span>ราคาสินค้า</span><span>${baht(total)}</span></div><div><span>ค่าจัดส่ง</span><span>ส่งฟรี</span></div>
        <div class="grand"><span>ยอดรวมทั้งหมด (${cart.length} รายการ)</span><span>${baht(total)}</span></div></section>
      <button>ชำระเงิน</button> <a href="?demo=/gadget">เลือกเพิ่ม</a>`;
  } else if (path.startsWith("/gadget/p/")) {
    const p = PRODUCTS.find(x => path.endsWith("/" + x.id)) || PRODUCTS[0];
    m.innerHTML = `<div class="detail"><img src="${p.img}" alt="${p.name}">
      <div><h1 style="margin:0">${p.name}</h1><p class="note">${p.desc}</p><p class="price">${baht(p.price)}</p>
        <h2 style="font-size:16px">ตัวเลือกเสริม</h2>
        ${ADDONS.map(a => `<label class="opt"><input type="checkbox" name="${a.id}" ${a.preset ? "checked" : ""}> ${a.name} (+${baht(a.price)})</label>`).join("")}
        <p><button id="add">เพิ่มลงตะกร้า</button></p></div></div>`;
    document.getElementById("add").addEventListener("click", e => {
      const btn = e.currentTarget;
      if (btn.disabled) return;
      btn.disabled = true;
      const cart = load();
      cart.push({ name: p.name, price: p.price, img: p.img });
      for (const a of ADDONS) if (m.querySelector(`input[name=${a.id}]`).checked) cart.push({ name: a.name, price: a.price, img: a.img });
      save(cart);
      flyToCart(m.querySelector(".detail img"), () => {
        document.getElementById("cartlink").textContent = "ตะกร้า (" + cart.length + ")";
        setTimeout(() => { location.href = "/gadget/cart"; }, 350);
      });
    });
  } else {
    m.innerHTML = `<h1 style="margin-top:0">โน้ตบุ๊ก</h1><div class="grid">
      ${PRODUCTS.map(p => `<div class="card${p.featured ? " featured" : ""}">
        ${p.featured ? '<div class="badges"><span class="badge">BEST SELLER</span><span class="badge blue">แนะนำสำหรับคุณ</span></div>' : ""}
        <img src="${p.img}" alt="${p.name}"><h3>${p.name}</h3><p class="note" style="margin:0">${p.desc}</p>
        <span class="price">${baht(p.price)}</span>
        <a class="btn${p.featured ? "" : " quiet"}" href="?demo=/gadget/p/${p.id}">เพิ่มลงตะกร้า</a></div>`).join("")}
      </div><p class="note">สถานการณ์และราคาสมมติ ไม่มีการสั่งซื้อจริง</p>`;
  }

    })();
  } else {
    (() => {

  // Fixture only: the page keeps its own cart in its own localStorage.
  const MENU = [
    { id: "box", name: "ชุดสุดคุ้ม ThinkBox", desc: "เบอร์เกอร์ไก่กรอบ + เฟรนช์ฟรายส์ + น้ำอัดลม", price: 139, was: 169, hero: true },
    { id: "burger", name: "เบอร์เกอร์ไก่กรอบ", desc: "ไม่มีเครื่องเคียง", price: 89 },
    { id: "chicken", name: "ไก่ทอด", desc: "1 ชิ้น สูตรกรอบ", price: 45 },
    { id: "fries", name: "เฟรนช์ฟรายส์", desc: "ขนาดปกติ", price: 39 },
    { id: "drink", name: "น้ำอัดลม", desc: "1 แก้ว", price: 25 },
    { id: "pie", name: "พายแอปเปิล", desc: "อบร้อน ๆ", price: 29 }
  ];
  // Simple drawn product pictures (data: URLs) so the fixture has real <img> elements.
  const BG = '<rect width="120" height="90" rx="10" fill="#FFF3D9"/>';

(() => {
  "use strict";
  const ta = globalThis.ThinkAgain = globalThis.ThinkAgain || {};
  const corners = ["bl", "br", "tr", "tl"];
  const INTENT_TTL_MS = 24 * 60 * 60 * 1000; // an intention is for today's shopping trip
  let writes = Promise.resolve();

  // chrome.storage.local only (never sync): the shopping intentions stay on this device.
  async function read() {
    const saved = await chrome.storage.local.get(["schema", "prefs", "sites", "userDenied", "intents", "seen", "reflections"]);
    return {
      schema: saved.schema ?? 2,
      prefs: { lang: "th", motion: "auto", side: "right", y: 0.62, ...saved.prefs },
      sites: saved.sites || {},
      userDenied: saved.userDenied || [],
      intents: saved.intents || {},
      seen: saved.seen || {},              // persuasive UI noticed per shop (24 h)
      reflections: saved.reflections || [] // the user's own answers, on this device only
    };
  }

  function site(settings, origin) {
    const saved = settings.sites[origin] || {};
    return {
      always: false, paused: false, seen: false, ...saved,
      corner: corners.includes(saved.corner) ? saved.corner : "bl"
    };
  }

  function queue(change) {
    // Serialize this content context's writes and merge against fresh storage.
    const operation = writes.then(async () => {
      const settings = await read();
      const result = change(settings);
      await chrome.storage.local.set({ ...settings, schema: 2 });
      return result;
    });
    writes = operation.catch(() => {});
    return operation;
  }

  function updateSite(origin, patch) {
    return queue(settings => {
      const updated = { ...site(settings, origin), ...patch };
      settings.sites = { ...settings.sites, [origin]: updated };
      return updated;
    });
  }

  function updatePrefs(patch) {
    return queue(settings => {
      settings.prefs = { ...settings.prefs, ...patch };
      return settings.prefs;
    });
  }

  function intent(settings, siteKey, now = Date.now()) {
    const saved = settings.intents[siteKey];
    return saved && now - saved.setAt < INTENT_TTL_MS ? saved : null;
  }

  function saveIntent(siteKey, entry) {
    return queue(settings => {
      const fresh = {};
      const now = Date.now();
      for (const [keyName, saved] of Object.entries(settings.intents)) {
        if (saved && now - saved.setAt < INTENT_TTL_MS) fresh[keyName] = saved; // drop stale ones
      }
      if (entry) fresh[siteKey] = { ...entry, setAt: now };
      else delete fresh[siteKey];
      settings.intents = fresh;
      return fresh[siteKey] || null;
    });
  }

  function seenFor(settings, siteKey, now = Date.now()) {
    const saved = settings.seen[siteKey];
    return saved && now - saved.at < INTENT_TTL_MS ? saved.items : [];
  }

  // Merge newly noticed tactics into this shop's list (deduplicated, capped).
  function addSeen(siteKey, items) {
    return queue(settings => {
      const now = Date.now();
      const fresh = {};
      for (const [name, entry] of Object.entries(settings.seen)) if (entry && now - entry.at < INTENT_TTL_MS) fresh[name] = entry;
      const list = fresh[siteKey] ? [...fresh[siteKey].items] : [];
      for (const item of items) {
        if (!list.some(old => old.type === item.type && old.text === item.text)) list.push({ type: item.type, text: item.text, priciest: Boolean(item.priciest) });
      }
      fresh[siteKey] = { at: now, items: list.slice(-16) };
      settings.seen = fresh;
      return fresh[siteKey].items;
    });
  }

  function clearSeen(siteKey) {
    return queue(settings => { delete settings.seen[siteKey]; return []; });
  }

  function addReflection(entry) {
    return queue(settings => {
      settings.reflections = [...settings.reflections, { ...entry, at: Date.now() }].slice(-200);
      return settings.reflections.length;
    });
  }

  ta.storage = Object.freeze({ read, site, updateSite, updatePrefs, intent, saveIntent, seenFor, addSeen, clearSeen, addReflection, INTENT_TTL_MS });
})();

// Pure helpers for the "intention → budget → cart" reflection. No DOM, no storage.
(() => {
  "use strict";
  const ta = globalThis.ThinkAgain = globalThis.ThinkAgain || {};

  // A price written the way shops write it: ฿1,290 · 1,290.00 บาท · THB 89 · $12.50
  const PRICE = /(?:฿|THB\s?|US\$|\$|€|£)\s?(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?|(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?\s?(?:บาท|(?:THB|฿)(?!\s?\d)|\.-)/gi;

  function prices(text) {
    const out = [];
    for (const match of String(text || "").matchAll(PRICE)) {
      const whole = (match[1] || match[3]).replace(/,/g, "");
      const cents = match[2] || match[4] || "";
      const value = Number(whole + (cents ? "." + cents : ""));
      if (Number.isFinite(value) && value > 0 && value < 10000000) out.push(value);
    }
    return out;
  }
  const parsePrice = text => prices(text)[0] ?? null;
  const hasPrice = text => prices(text).length > 0;

  // Thai-aware fuzzy name matching: lower-case, drop spaces/punctuation/digits,
  // then compare character bigrams (Dice coefficient).
  function key(name) {
    return String(name || "").toLowerCase()
      .replace(/(?:x|×)?\s*[\d๐-๙]+\s*(?:ชิ้น|อัน|ชุด|กล่อง|แก้ว|ถุง|ขวด|จาน|ถ้วย|ห่อ|ตัว|เครื่อง|คู่|pcs?|ea)?/gi, "")
      .replace(/\bqty\b/g, "")
      .replace(/[^\p{L}\p{M}]+/gu, "");
  }
  function bigrams(text) {
    const grams = new Map();
    for (let i = 0; i < text.length - 1; i += 1) {
      const gram = text.slice(i, i + 2);
      grams.set(gram, (grams.get(gram) || 0) + 1);
    }
    return grams;
  }
  // Words of a name ("ThinkBook Air 13" → thinkbook, air, 13).
  const words = name => String(name || "").toLowerCase().split(/[^\p{L}\p{M}\p{N}]+/u).filter(word => word.length >= 2 || /\d/.test(word));
  function similarity(a, b) {
    const score = rawSimilarity(a, b);
    // Model names share most letters ("ThinkBook Air 13" vs "ThinkBook Pro 14"):
    // when both have several words, every word of the shorter one must appear.
    const wa = words(a);
    const wb = words(b);
    if (wa.length >= 2 && wb.length >= 2) {
      const [short, long] = wa.length <= wb.length ? [wa, wb] : [wb, wa];
      const covered = short.every(word => long.some(other => other === word || (word.length >= 3 && other.length >= 3 && (other.includes(word) || word.includes(other)))));
      if (!covered) return Math.min(score, 0.4);
    }
    return score;
  }
  function rawSimilarity(a, b) {
    const x = key(a);
    const y = key(b);
    if (!x || !y) return 0;
    if (x === y) return 1;
    if (x.length >= 3 && y.length >= 3 && (x.includes(y) || y.includes(x))) return 0.9;
    const gx = bigrams(x);
    const gy = bigrams(y);
    let shared = 0;
    for (const [gram, count] of gx) shared += Math.min(count, gy.get(gram) || 0);
    const total = Math.max(1, x.length - 1) + Math.max(1, y.length - 1);
    return (2 * shared) / total;
  }
  const MATCH = 0.5;

  // "ไก่ทอด 2 ชิ้น" → { name: "ไก่ทอด", qty: 2 }
  function parseIntentText(text) {
    const raw = String(text || "").replace(/\s+/g, " ").trim().slice(0, 80);
    if (!raw) return null;
    const qtyMatch = raw.match(/(?:^|\s|x|×)(\d{1,2})\s*(?:[\u0E01-\u0E2E\u0E30-\u0E4E]{1,7}|pcs?|ea|pack|box|cups?)?\s*$/i)
      || raw.match(/^(\d{1,2})\s*(?:x|×)?\s+/i);

    const name = (qtyMatch ? raw.replace(qtyMatch[0], " ") : raw).replace(/\s+/g, " ").trim() || raw;
    return { name, qty };
  }

  // Budget chips: "nice" ceilings at or above what the user intends to spend.
  const NICE = [50, 100, 150, 200, 300, 500, 800, 1000, 1500, 2000, 3000, 5000, 8000, 10000, 20000, 50000, 100000];
  function budgetOptions(estimate) {
    const base = Math.max(1, Number(estimate) || 0);
    const chips = NICE.filter(value => value >= base).slice(0, 4);
    let next = chips.length ? chips[chips.length - 1] : Math.ceil(base / 1000) * 1000;
    if (!chips.length) chips.push(next);
    while (chips.length < 4) { next *= 2; chips.push(next); }

    const step = max <= 1000 ? 10 : max <= 5000 ? 50 : max <= 20000 ? 100 : 500;
    return { chips, min: step, max, step, initial: chips[0] };
  }

  // Compare what the user meant to buy with what the cart page shows.
  function compare(intent, cart) {
    const items = (intent && intent.items) || [];
    const lines = (cart && cart.lines) || [];
    const used = new Set();
    const matched = [];
    const missing = [];
    for (const item of items) {
      let best = -1;
      let score = 0;
      lines.forEach((line, index) => {
        if (used.has(index)) return;
        const value = similarity(item.name, line.name);
        if (value > score) { score = value; best = index; }
      });
      if (best !== -1 && score >= MATCH) {
        used.add(best);
        const line = lines[best];
        matched.push({ item, line, moreQty: Math.max(0, (line.qty || 1) - (item.qty || 1)) });
      } else {
        missing.push(item);
      }
    }
    const extras = lines.filter((_, index) => !used.has(index));
    const total = cart && Number.isFinite(cart.total) ? cart.total : null;
    const budget = intent && Number.isFinite(intent.budget) ? intent.budget : null;
    const over = total !== null && budget !== null ? Math.round((total - budget) * 100) / 100 : null;
    return { matched, missing, extras, total, budget, over, estimated: Boolean(cart && cart.estimated) };
  }

  // Group sub-domains of one shop: cart.lazada.co.th and www.lazada.co.th → lazada.co.th
  const SECOND_LEVEL = /^(?:co|or|ac|go|in|mi|net|com|org|edu|gov)\.(?:th|uk|jp|au|nz|sg|my|id|ph|vn|kr|in|za|br)$/;
  function siteKey(hostname) {
    const host = String(hostname || "").toLowerCase().replace(/\.$/, "");
    if (!host.includes(".") || /^\d+\.\d+\.\d+\.\d+$/.test(host) || host.startsWith("[")) return host;
    const labels = host.split(".");
    const lastTwo = labels.slice(-2).join(".");
    return SECOND_LEVEL.test(lastTwo) ? labels.slice(-3).join(".") : lastTwo;
  }

  const formatBaht = value => "฿" + Number(value).toLocaleString("th-TH", { maximumFractionDigits: 2 });

  const api = Object.freeze({ prices, parsePrice, hasPrice, key, similarity, parseIntentText,
    budgetOptions, compare, siteKey, formatBaht, MATCH });
  ta.intent = api;
  if (typeof module === "object" && module.exports) module.exports = api;
})();

// Pure classification helpers. No DOM access here: page-scan.js collects the
// booleans and short button/link labels, and this file only decides the zone.
(() => {
  "use strict";
  const ta = globalThis.ThinkAgain = globalThis.ThinkAgain || {};

  // Brief §2.6 seed list. manifest.json carries the same hosts as
  // exclude_matches, so the content script is never even injected there.
  const DENIED_HOSTS = Object.freeze([
    "kasikornbank.com", "kbank.co.th", "scb.co.th", "krungthai.com", "bangkokbank.com",
    "krungsri.com", "ttbbank.com", "gsb.or.th", "baac.or.th", "ghbank.co.th", "uob.co.th",
    "cimbthai.com", "kkpfg.com", "lhbank.co.th", "tisco.co.th",
    "truemoney.com", "paypal.com", "stripe.com", "checkout.stripe.com", "omise.co", "2c2p.com",
    "gbprimepay.com", "ksher.com", "rabbitlinepay.com", "adyen.com", "wise.com",
    "rd.go.th", "sso.go.th",
    "set.or.th", "settrade.com", "bitkub.com", "binance.com", "binance.th"
  ]);

  // Path segments. "bag" alone is left out: fashion shops use /bag for handbags.
  const PAYMENT_PATH = /(?:^|\/)(?:checkout|check-out|checkouts|payment|payments|pay|billing|place-?order|onepage|order\/(?:confirm|review|pay|payment)|cart\/confirm)(?:\/|$|[.?#;])/i;
  const CART_PATH = /(?:^|\/)(?:cart|carts|basket|shopping-?cart|shopping-?bag|viewcart|view-cart|trolley)(?:\/|$|[.?#;])/i;
  const LOGIN_PATH = /(?:^|\/)(?:login|log-in|signin|sign-in|signup|sign-up|register|account\/security)(?:\/|$|[.?#;])/i;
  const PAYMENT_SUBDOMAIN = /^(?:checkout|pay|payment|payments|billing)\./i;
  const CART_SUBDOMAIN = /^(?:cart|basket)\./i;

  // Whole-label matches after normalise(). Short labels only, so a paragraph
  // that merely mentions "ชำระเงิน" never counts.
  const CHECKOUT_LABELS = [
    // Thai
    /^(?:ไป(?:ที่)?(?:หน้า)?)?(?:ดำเนินการ)?ชำระ(?:เงิน)?(?:ทันที|เลย|ตอนนี้)?$/,
    /^(?:ไป)?(?:ที่)?(?:หน้า)?(?:จ่ายเงิน|จ่ายเลย)$/,
    /^ยืนยัน(?:การ)?(?:ชำระ(?:เงิน)?|สั่งซื้อ(?:สินค้า)?|คำสั่งซื้อ|และชำระเงิน|การจ่ายเงิน)$/,
    /^(?:ทำการ|ดำเนินการ)?สั่งซื้อ(?:สินค้า)?(?:เลย|ทันที)?$/,
    /^สั่งสินค้า$/,
    /^เช็คเอาท์$|^เช็กเอาต์$|^เช็คเอาต์$/,
    // English
    /^(?:proceed to |go to |continue to |secure )?check ?out(?: now| securely)?$/,
    /^(?:place|submit|complete|confirm|review) (?:your |my )?(?:order|purchase|payment)$/,
    /^(?:pay|pay now|pay securely|confirm and pay|confirm & pay|continue to payment|proceed to payment|complete purchase)$/
  ];

  // Buttons that put something in a cart (product / menu pages).
  const BUY_LABELS = [
    /^(?:\+\s*)?(?:เพิ่ม|ใส่|หยิบ)(?:ลง|ใส่|เข้า)?(?:ใน)?(?:ตะกร้า|รถเข็น)(?:สินค้า)?$/,
    /^ซื้อ(?:เลย|ทันที|ตอนนี้|สินค้า|สินค้านี้)?$/,
    /^สั่ง(?:เลย|อาหาร|เลยตอนนี้)$/,
    /^(?:add to (?:cart|bag|basket|order)|add|buy now|buy it now|order now|add to my order)$/

    return String(hostname || "").toLowerCase().replace(/\.$/, "");
  }

  function isDeniedHost(hostname, userDenied = []) {
    const host = normaliseHost(hostname);

  function normalise(label) {
    return String(label || "")
      .toLowerCase()
      .replace(/[\d๐-๙]+(?:[.,]\d+)?/g, " ")
      .replace(/[()[\]{}<>«»‹›→←➔➜›»"'“”‘’.:;,!?*•·|/\\+\-–—_฿$€£¥%#@]/g, " ")
      .replace(/\b(?:thb|baht|items?)\b|บาท|ชิ้น|รายการ/g, " ")
      .replace(/\s+/g, " ")

  }
  function isCartLinkLabel(label) {
    const text = normalise(label);
    return Boolean(text) && CART_LINK_LABELS.some(pattern => pattern.test(text));
  }

  // Is this a page where people pick things to buy? Several weak signals must agree.
  function shoppingScore({ labels = [], priceCount = 0, hasProductData = false } = {}) {
    let score = 0;
    if (labels.some(isBuyLabel)) score += 2;
    if (hasProductData) score += 2;
    if (labels.some(isCartLinkLabel)) score += 1;
    if (priceCount >= 1) score += 1;

  //   "denied"  : finance site, render nothing
  //   "payment" : card fields or a payment/checkout URL
  //   "cart"    : a cart/basket URL
  //   "checkout": an ordinary-looking URL that shows a visible checkout/pay button

    const fromPath = pathZone(hostname, pathname);

    if (shoppingScore({ labels, priceCount, hasProductData }) >= 3) return { zone: "shopping", reasons: ["shop"] };
    return { zone: "normal", reasons: [] };
  }

  const api = Object.freeze({ DENIED_HOSTS, isDeniedHost, pathZone, normalise, isCheckoutLabel,
    isBuyLabel, isCartLinkLabel, shoppingScore, classify });
  ta.sensitive = api;
  if (typeof module === "object" && module.exports) module.exports = api;
})();

// Reads what the page SHOWS: product names, prices, cart lines and totals.
// It never reads form fields or what the user types, never changes the page,
// and nothing leaves the device. Results are short-lived summaries.
(() => {
  "use strict";
  const ta = globalThis.ThinkAgain = globalThis.ThinkAgain || {};
  const { prices, parsePrice, hasPrice, key } = ta.intent;

  const SKIP = "script,style,noscript,template,svg,thinkagain-companion";
  const CHROME = "nav,header,footer,[role=navigation],[role=banner],[role=contentinfo]";
  const NAME = 'h1,h2,h3,h4,h5,[itemprop="name"],[class*="name" i],[class*="title" i]';
  const TOTAL = /^(?:ยอด(?:รวม|ชำระ|สุทธิ|ที่ต้องชำระ|เงินรวม|คำสั่งซื้อ)|รวม(?:ทั้งหมด|ทั้งสิ้น|เงิน|ยอด|สุทธิ)?|ราคา(?:รวม|สุทธิ)|ชำระทั้งหมด|(?:grand |order |estimated |cart )?total|amount due|to pay)/i;
  const SUBTOTAL = /^(?:subtotal|sub-total|ค่าอาหาร|ราคาสินค้า|ยอดสินค้า|รวมค่าสินค้า|ยอดรวมสินค้า)/i;
  const PRICE_AT = /(?:฿|THB|US\$|\$|€|£)\s?\d|\d[\d,]*(?:\.\d{1,2})?\s?(?:บาท|(?:THB|฿)(?!\s?\d)|\.-)/i;
  const FEE = /^(?:ค่า(?:จัด)?ส่ง|ค่าบริการ|ส่วนลด|ภาษี|vat|shipping|delivery|discount|tax|service)/i;
  const ADD_BUTTON = /^(?:\+\s*)?(?:เพิ่ม|ใส่ตะกร้า|เพิ่มลงตะกร้า|add|add to cart)$/i;

  function nameOf(el) {
    const own = clean([...el.childNodes].filter(node => node.nodeType === 3).map(node => node.nodeValue).join(" "));

          items.push({ name: clean(entry.name).slice(0, 70), price: Number.isFinite(price) ? price : null });
