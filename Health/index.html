<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Personalised Wellness</title>

  <!-- เต็มจอ / รองรับ iPhone notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#6c8cff" />
  <!-- (เสริม) เปิดแบบเต็มจอเมื่อ Add to Home Screen บน iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Prefetch หน้ารอง -->
  <link rel="prefetch" href="./pages/notify/Index.js" as="script">
  <link rel="prefetch" href="./pages/notify/Appointment.js" as="script">
  <link rel="prefetch" href="./pages/notify/General.js" as="script">

  <!-- React 17 + Router v5 (UMD, no npm) -->
  <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js" crossorigin></script>

  <style>
    :root{
      /* สี/เงา */
      --bg:#f6f8ff; --grad1:#7db4ff; --grad2:#6c8cff;
      --card:#fff; --bubble:#eaf2ff; --text:#20314f;
      --shadow:0 10px 24px rgba(23,62,139,.15); --radius:18px;

      /* ตัวอักษร */
      --fz-1:14px; --fz-2:16px; --fz-3:18px;

      /* viewport & safe-area */
      --vh: 1vh;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      /* ความสูงแถบล่าง */
      --nav-h: 64px;

      /* TopBar */
      --topbar-h: 56px;     /* สูงขึ้น แตะง่าย */
      --topbar-side: 72px;  /* เว้นพื้นที่ซ้าย/ขวาให้เท่าปุ่ม back */
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{
      height:100%; margin:0; overflow:hidden; /* กัน PTR ของ Safari โดยให้เลื่อนใน .page แทน */
      background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Prompt, Inter, sans-serif;
      font-size: var(--fz-2); line-height:1.35;
      overscroll-behavior: none;
    }

    /* ===== App Shell ===== */
    .app{
      height: calc(var(--vh) * 100);
      display:flex; flex-direction:column;
      background: linear-gradient(180deg, var(--grad1), var(--grad2));
      padding: calc(var(--safe-top) + 10px)
               max(10px, calc(var(--safe-left) + 10px))
               calc(var(--safe-bottom) + var(--nav-h))
               max(10px, calc(var(--safe-right) + 10px));
      margin: 0 auto; max-width: 520px;
      overflow:hidden; /* ห้ามทะลุไปเลื่อน body */
    }

    .page{
      flex:1 1 auto;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch; /* inertia iOS */
      overscroll-behavior-y: contain;
      padding-bottom:1px;
    }

    /* การ์ด/บับเบิล/หัวข้อ */
    h1{font-size:18px; margin:2px 6px 10px; color:#fff; font-weight:800;}
    .bubble{background:var(--bubble); padding:12px 14px; border-radius:14px; margin:10px 6px; display:flex; gap:10px; align-items:center; box-shadow:inset 0 0 0 1px #d7e6ff}
    .card{background:var(--card); border-radius:var(--radius); padding:14px; margin:12px 6px; box-shadow:var(--shadow)}
    .section-title{font-weight:800; color:#2b4b88; background:#d9e8ff; display:inline-block; padding:6px 10px; border-radius:14px; margin-bottom:8px}

    /* Grid (อาจใช้ในบางหน้า) */
    .grid{display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:10px}
    .tile{background:var(--card); border-radius:14px; padding:10px; text-align:center; font-size:12px; box-shadow:var(--shadow); user-select:none; cursor:pointer}
    .tile .emoji{font-size:24px; display:block; margin-bottom:4px}

    /* รายการแบบ pill */
    .list{display:flex; flex-direction:column; gap:12px; margin:6px}
    .pill{background:#e2efff; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; font-weight:700; box-shadow:var(--shadow)}

    /* Bottom Nav */
    .nav{
      position: fixed; left:0; right:0; bottom:0;
      display:flex; justify-content:center; gap:14px;
      padding: 10px calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.15) 38%, rgba(255,255,255,.25) 100%);
      backdrop-filter: blur(6px);
    }
    .btn{
      appearance:none; border:none; text-decoration:none; color:inherit; cursor:pointer;
      background:var(--card); box-shadow:var(--shadow);
      border-radius:999px; padding:12px 18px; min-height:48px;
      display:flex; align-items:center; gap:8px; font-weight:800;
      touch-action: manipulation;
    }
    .btn:active{ transform: translateY(1px) scale(0.98); transition: transform 120ms ease; }
    .back{ display:inline-flex; align-items:center; gap:8px; color:#fff; font-weight:800; margin:4px 6px; text-decoration:none }
    .center{text-align:center}
    .ghost{opacity:.6}

    /* ===== Dock เหนือ nav (ใช้เฉพาะบางหน้า เช่น Home) ===== */
    .dock{
      position: fixed; left:0; right:0;
      bottom: calc(var(--safe-bottom) + var(--nav-h) + 8px);
      pointer-events:none;
    }
    .dock-inner{
      max-width:520px; margin:0 auto; padding:0 12px;
      pointer-events:auto;
    }
    .dock .card{ margin:0; }
    .has-dock .page{ padding-bottom: calc(var(--nav-h) + 180px); }

    /* ===== Skeleton Loader ===== */
    .skeleton-wrap{ padding: 8px 6px 96px; }
    .skeleton{ border-radius: 12px; background: #e8edf7; position: relative; overflow: hidden; }
    .shimmer::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.6) 50%, rgba(255,255,255,0) 100%);
      transform: translateX(-100%); animation: shimmer 1.25s infinite;
    }
    @keyframes shimmer{ 100%{ transform: translateX(100%); } }
    .sk-title{ height:24px; width:55%; margin:14px 6px; }
    .sk-bubble{ height:48px; margin:10px 6px; }
    .sk-card{ height:140px; margin:12px 6px; }
    .sk-grid{ margin:12px 6px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .sk-tile{ height:60px; border-radius:14px; }

    /* ===== Native feel: ปิด select/callout ยกเว้นจุดที่อนุญาต ===== */
    html, body, .app, .card, .bubble, .pill, .tile, .btn, nav, header, footer {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    input, textarea, [contenteditable], .selectable {
      -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
    }
    img, svg { -webkit-user-drag: none; user-drag: none; }

    /* ===== Activities Carousel ===== */
    .carousel-wrap{ position:relative; margin:8px 6px 2px; }
    .carousel{
      display:flex; gap:10px; padding:4px 6px 8px;
      overflow-x:auto; overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar{ display:none }
    .carousel .tile{
      flex: 0 0 auto; width:96px; scroll-snap-align:start; scroll-snap-stop:always;
      text-align:center; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    }
    .carousel, .carousel * { touch-action: pan-x; }
    /* เงาบอกทิศ */
    .carousel-wrap::before, .carousel-wrap::after{
      content:""; position:absolute; top:0; bottom:0; width:28px; pointer-events:none; opacity:0; transition:opacity .2s ease;
    }
    .carousel-wrap::before{ left:0;  background:linear-gradient(90deg, #fff 0%, rgba(255,255,255,0) 100%) }
    .carousel-wrap::after { right:0; background:linear-gradient(270deg,#fff 0%, rgba(255,255,255,0) 100%) }
    .carousel-wrap.shadow-left::before{ opacity:1 }
    .carousel-wrap.shadow-right::after{ opacity:1 }
    /* ปุ่มเลื่อน (เดสก์ท็อปเท่านั้น) */
    .carousel-nav{ position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; pointer-events:none }
    .nav-ctl{
      pointer-events:auto; display:none; width:36px; height:36px; border-radius:999px; border:none; cursor:pointer;
      background:rgba(255,255,255,.9); box-shadow:var(--shadow); font-size:20px; font-weight:800;
    }
    .nav-ctl:disabled{ opacity:.4; cursor:default }
    /* ซ่อนปุ่มเมื่อเป็นอุปกรณ์สัมผัส */
    .touch .nav-ctl{ display:none !important; }

    /* ===== TopBar: หัวข้อกึ่งกลางคงที่ + ปุ่มย้อนกลับใหญ่แตะง่าย ===== */
    .topbar{
      position:relative; height:var(--topbar-h);
      display:flex; align-items:center; margin:6px 6px 8px;
    }
    .topbar h1{
      position:absolute; left:var(--topbar-side); right:var(--topbar-side);
      margin:0; text-align:center; color:#fff; font-weight:800; font-size:18px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .topbar .back{
      position:absolute; left:6px; top:50%; transform:translateY(-50%);
      display:inline-flex; align-items:center; justify-content:center;
      min-width:48px; min-height:48px; padding:10px 14px;
      border-radius:999px; text-decoration:none; font-weight:800;
      background:rgba(255,255,255,.92); color:#2b4b88; box-shadow:var(--shadow);
      -webkit-tap-highlight-color: transparent;
      font-size:26px; line-height:1;
    }
    /* โชว์คำว่า “ย้อนกลับ” อัตโนมัติบนจอใหญ่ โดยไม่ต้องแก้ JS */
    @media (min-width:680px){
      :root{ --topbar-side: 128px; }
      .topbar .back::after{
        content:"ย้อนกลับ"; display:inline-block; margin-left:8px; font-size:16px; font-weight:800;
      }
    }
    /* กดแล้วเด้งนิด ๆ แบบ native */
    .topbar .back:active{ transform:translateY(calc(-50% + 1px)) scale(.98); transition:transform 120ms ease; }

    /* ===== Responsive ===== */
    @media (max-width:360px){
      .grid{ grid-template-columns: repeat(3, 1fr); }
      .tile .emoji{ font-size:22px }
      .btn{ padding:12px 16px }
    }
    @media (min-width:680px){
      :root{ --fz-1:15px; --fz-2:17px; --fz-3:19px; }
      .grid{ grid-template-columns: repeat(5, 1fr); }
      .app{ border-radius:24px; margin:14px auto calc(14px + var(--nav-h)); }
      .carousel .tile{ width:110px }
      .nav-ctl{ display:inline-flex; align-items:center; justify-content:center }
    }
    @media (orientation:landscape) and (max-height:520px){
      .app{ padding-bottom: calc(var(--safe-bottom) + 72px); }
      .grid{ grid-template-columns: repeat(6, 1fr); }
      .btn{ min-height:44px; padding:10px 14px; }
      .carousel .tile{ width:120px }
    }
    @media (prefers-reduced-motion: reduce){
      *{scroll-behavior:auto; transition:none !important; animation:none !important;}
    }

    /* Login page */
    .login-wrap{ display:flex; flex-direction:column; justify-content:center; padding:24px 12px 96px; }
    .brand{ color:#fff; font-weight:800; text-align:center; margin:6px 0 12px; }
    .login-card{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin:0 6px;
      display:flex; flex-direction:column; gap:12px; }
    .login-card h2{ margin:0 0 4px; font-size:18px; color:#2b4b88; }
    .input-row{ display:flex; flex-direction:column; gap:6px; font-weight:600; }
    .input{ font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid #d9e3ff; outline:none; }
    .input:focus{ border-color:#6c8cff; box-shadow:0 0 0 3px rgba(108,140,255,.2); }
    .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:14px; }
    .login-btn{ width:100%; justify-content:center; margin-top:4px; }

    /* User bar บนหน้าแรก */
    .userbar{ display:flex; align-items:center; justify-content:space-between; margin:4px 6px 4px; }
    .userbar-name{ color:#fff; font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:8px; }
    .avatar{
      width:40px; height:40px; border-radius:50%;
      background:#fff; color:#2b4b88; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      text-decoration:none; box-shadow:var(--shadow);
    }
    .avatar:active{ transform: translateY(1px) scale(.98); }

    /* โปรไฟล์ */
    .avatar-lg{
      width:88px; height:88px; border-radius:50%; background:#fff; color:#2b4b88;
      display:flex; align-items:center; justify-content:center; font-weight:900; font-size:28px; margin:4px auto 6px;
      box-shadow:var(--shadow);
    }
    .profile-card{ padding-top:18px; padding-bottom:18px; }
    .profile-name{ font-weight:900; color:#2b4b88; font-size:18px; margin-top:4px; }
    .profile-username{ opacity:.7; font-size:14px; }

    .logout-btn{ background:#ffe8e8; color:#b42323; font-weight:800; }

    /* รายการการแจ้งเตือน */
    .notify-list{ display:flex; flex-direction:column; gap:16px; margin:12px 10px 0; }
    a.notify-item, .notify-item{ text-decoration:none; color:inherit; display:flex; align-items:center; gap:12px;
      background:#cfe3ff; border-radius:18px; padding:10px; box-shadow:var(--shadow); }
    .notify-emoji{ font-size:34px; width:42px; text-align:center; }
    .notify-chip{ flex:1; background:#fff; border-radius:14px; padding:10px 16px; font-weight:800; box-shadow:var(--shadow); }
    .btn-sm{ padding:8px 12px; min-height:36px; font-weight:700; font-size:14px; }
  </style>
</head>
<body>
  <div id="root" class="app"></div>

  <!-- ตั้งค่า --vh และใส่คลาส .touch ให้เร็วที่สุด -->
  <script>
    (function setVH(){
      const set = () => document.documentElement.style.setProperty('--vh', (innerHeight * 0.01) + 'px');
      set(); addEventListener('resize', set); addEventListener('orientationchange', set);
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      document.documentElement.classList.toggle('touch', !!isTouch);
    })();
  </script>

  <!-- โหลด main.js พร้อม cache-busting -->
  <script>
    (function(){
      window.APP_VER = Date.now(); // เปลี่ยนทุกครั้งที่รีเฟรช
      const s = document.createElement('script');
      s.type = 'module';
      s.src = './main.js?v=' + window.APP_VER;
      document.body.appendChild(s);
    })();
  </script>

  <!-- กัน Pull-to-Refresh บน iOS: ดึงลงจากขอบบนของ .page -->
  <script>
    (function preventPTR(){
      let startY = 0, targetEl = null;
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) { targetEl = null; return; }
        startY = e.touches[0].clientY;
        targetEl = e.target.closest('.page');
      }, { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (!targetEl) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 0 && targetEl.scrollTop <= 0) e.preventDefault();
      }, { passive: false });
    })();
  </script>

  <!-- ปิด context menu / select / drag ยกเว้นจุดที่อนุญาต -->
  <script>
    (function(){
      const allow = 'input, textarea, [contenteditable], .selectable';
      addEventListener('contextmenu', e => { if (!e.target.closest(allow)) e.preventDefault(); }, { passive:false });
      addEventListener('selectstart', e => { if (!e.target.closest(allow)) e.preventDefault(); }, { passive:false });
      addEventListener('dragstart',  e => { if (!e.target.closest(allow)) e.preventDefault(); }, { passive:false });
      document.querySelectorAll('a, img').forEach(el => el.setAttribute('draggable','false'));
    })();
  </script>
</body>
</html>
