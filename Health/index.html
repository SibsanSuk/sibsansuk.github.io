<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Personalised Wellness</title>


  <!-- เต็มจอ / รองรับ iPhone notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#6c8cff" />
  <!-- (เสริม) เปิดแบบเต็มจอเมื่อ Add to Home Screen บน iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Prefetch หน้ารอง -->
  <link rel="prefetch" href="./pages/notify/Index.js" as="script">
  <link rel="prefetch" href="./pages/notify/Appointment.js" as="script">
  <link rel="prefetch" href="./pages/notify/General.js" as="script">

  <!-- React 17 + Router v5 (UMD, no npm) -->
  <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js" crossorigin></script>


  <link id="app-css" rel="stylesheet" href="./styles/app.css">


</head>
<body>
  <div id="root" class="app"></div>

  <!-- ตั้งค่า --vh และใส่คลาส .touch ให้เร็วที่สุด -->
  <script>
    (function setVH(){
      const set = () => document.documentElement.style.setProperty('--vh', (innerHeight * 0.01) + 'px');
      set(); addEventListener('resize', set); addEventListener('orientationchange', set);
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      document.documentElement.classList.toggle('touch', !!isTouch);
    })();
  </script>

  <!-- โหลด main.js พร้อม cache-busting -->
  <script>
    (function(){
      window.APP_VER = Date.now(); // เปลี่ยนทุกครั้งที่รีเฟรช

    // ใส่ cache-busting ให้ CSS ด้วย
    const css = document.getElementById('app-css');
    if (css) css.href = css.href + '?v=' + window.APP_VER;

      const s = document.createElement('script');
      s.type = 'module';
      s.src = './main.js?v=' + window.APP_VER;
      document.body.appendChild(s);
    })();
  </script>

  <!-- กัน Pull-to-Refresh บน iOS: ดึงลงจากขอบบนของ .page -->
  <script>
    (function preventPTR(){
      let startY = 0, targetEl = null;
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) { targetEl = null; return; }
        startY = e.touches[0].clientY;
        targetEl = e.target.closest('.page');
      }, { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (!targetEl) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 0 && targetEl.scrollTop <= 0) e.preventDefault();
      }, { passive: false });
    })();
  </script>

  <!-- ปิด context menu / select / drag ยกเว้นจุดที่อนุญาต -->
  <script>
    (function(){
      const allow = 'input, textarea, [contenteditable], .selectable';
      addEventListener('contextmenu', e => { if (!e.target.closest(allow)) e.preventDefault(); }, { passive:false });
      addEventListener('selectstart', e => { if (!e.target.closest(allow)) e.preventDefault(); }, { passive:false });
      addEventListener('dragstart',  e => { if (!e.target.closest(allow)) e.preventDefault(); }, { passive:false });
      document.querySelectorAll('a, img').forEach(el => el.setAttribute('draggable','false'));
    })();
  </script>

  
</body>
</html>
