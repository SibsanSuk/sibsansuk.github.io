<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Data - Google Drive Saver</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status-badge.signed-out {
            background: #ffebee;
            color: #c62828;
        }

        .status-badge.signed-in {
            background: #e8f5e9;
            color: #2e7d32;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #757575;
            color: white;
        }

        .btn-secondary:hover {
            background: #616161;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .game-data-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .game-data-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            min-width: 150px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .files-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .files-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .file-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #e0e0e0;
        }

        .file-item-info {
            flex: 1;
        }

        .file-item-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .file-item-date {
            color: #999;
            font-size: 12px;
        }

        .file-item-actions {
            display: flex;
            gap: 8px;
        }

        .file-item-actions button {
            padding: 6px 12px;
            font-size: 12px;
            margin: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .message.info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .user-info {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        label {
            display: block;
            color: #666;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            margin-top: 12px;
        }

        label:first-of-type {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Game Data Saver</h1>
        <p class="subtitle">Save and load your game progress to Google Drive</p>

        <!-- Auth Section -->
        <div class="auth-section">
            <div class="status-badge signed-out" id="authStatus">Not Signed In</div>
            <button class="btn-primary" id="authBtn" onclick="authorizeUser()">Sign in with Google</button>
            <button class="btn-secondary" id="signOutBtn" onclick="signOut()" style="display: none;">Sign Out</button>
            <div class="user-info" id="userInfo"></div>
        </div>

        <!-- Message Section -->
        <div class="message" id="message"></div>

        <!-- Game Data Input Section -->
        <div class="game-data-section" id="gameDataSection" style="display: none;">
            <h3>Create Game Save</h3>
            
            <label for="playerName">Player Name:</label>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Enter player name">
            </div>

            <label for="level">Level:</label>
            <div class="input-group">
                <input type="number" id="level" placeholder="1" min="1" value="1">
            </div>

            <label for="score">Score:</label>
            <div class="input-group">
                <input type="number" id="score" placeholder="0" min="0" value="0">
            </div>

            <label for="gameData">Game Data (JSON):</label>
            <div class="input-group">
                <textarea id="gameData" placeholder='{"inventory": [], "position": {"x": 0, "y": 0}}'>{"inventory": ["sword", "shield"], "position": {"x": 100, "y": 200}, "health": 100}</textarea>
            </div>

            <button class="btn-success" onclick="saveGameData()">💾 Save to Google Drive</button>
            <button class="btn-primary" onclick="refreshFileList()">🔄 Refresh Files</button>
        </div>

        <!-- Files Section -->
        <div class="files-section" id="filesSection" style="display: none;">
            <h3>Your Game Saves</h3>
            <div class="file-list" id="fileList">
                <div class="empty-state">
                    <p>No save files yet. Create one to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CLIENT_ID = 'YOUR_CLIENT_ID_HERE'; // Replace with your Client ID
        const API_KEY = 'YOUR_API_KEY_HERE'; // Replace with your API Key
        const DISCOVERY_DOCS = ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'];
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        const FOLDER_NAME = 'GameSaves';

        let authenticator = null;
        let folderId = null;

        // Initialize Google API
        function initGoogleAPI() {
            gapi.load('client:auth2', () => {
                gapi.client.init({
                    apiKey: API_KEY,
                    clientId: CLIENT_ID,
                    discoveryDocs: DISCOVERY_DOCS,
                    scope: SCOPES
                }).then(() => {
                    authenticator = gapi.auth2.getAuthInstance();
                    updateAuthUI();
                    authenticator.isSignedIn.listen(updateAuthUI);
                }).catch(error => {
                    showMessage(`API Initialization Error: ${error.error.error}`, 'error');
                    console.error('Error initializing API:', error);
                });
            });
        }

        // Authorize user
        function authorizeUser() {
            if (authenticator) {
                authenticator.signIn().then(() => {
                    ensureGameFolder().then(() => {
                        refreshFileList();
                    });
                }).catch(error => {
                    showMessage('Failed to sign in: ' + error.error, 'error');
                });
            }
        }

        // Sign out
        function signOut() {
            if (authenticator) {
                authenticator.signOut();
            }
        }

        // Update Auth UI
        function updateAuthUI() {
            const isSignedIn = authenticator && authenticator.isSignedIn.get();
            const gameDataSection = document.getElementById('gameDataSection');
            const filesSection = document.getElementById('filesSection');
            const authBtn = document.getElementById('authBtn');
            const signOutBtn = document.getElementById('signOutBtn');
            const authStatus = document.getElementById('authStatus');
            const userInfo = document.getElementById('userInfo');

            if (isSignedIn) {
                const profile = authenticator.currentUser.get().getBasicProfile();
                authStatus.textContent = 'Signed In';
                authStatus.className = 'status-badge signed-in';
                authBtn.style.display = 'none';
                signOutBtn.style.display = 'inline-block';
                userInfo.textContent = `Logged in as: ${profile.getName()} (${profile.getEmail()})`;
                gameDataSection.style.display = 'block';
                filesSection.style.display = 'block';
                showMessage(`Welcome, ${profile.getName()}!`, 'info');
            } else {
                authStatus.textContent = 'Not Signed In';
                authStatus.className = 'status-badge signed-out';
                authBtn.style.display = 'inline-block';
                signOutBtn.style.display = 'none';
                userInfo.textContent = '';
                gameDataSection.style.display = 'none';
                filesSection.style.display = 'none';
            }
        }

        // Ensure GameSaves folder exists
        async function ensureGameFolder() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: `name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`,
                    spaces: 'drive',
                    fields: 'files(id, name)',
                    pageSize: 1
                });

                if (response.result.files && response.result.files.length > 0) {
                    folderId = response.result.files[0].id;
                } else {
                    // Create folder
                    const createResponse = await gapi.client.drive.files.create({
                        resource: {
                            name: FOLDER_NAME,
                            mimeType: 'application/vnd.google-apps.folder'
                        },
                        fields: 'id'
                    });
                    folderId = createResponse.result.id;
                    showMessage(`Created "${FOLDER_NAME}" folder on Google Drive`, 'success');
                }
            } catch (error) {
                showMessage('Error managing folder: ' + error.message, 'error');
            }
        }

        // Save game data
        async function saveGameData() {
            if (!folderId) {
                showMessage('Please sign in first', 'error');
                return;
            }

            const playerName = document.getElementById('playerName').value || 'Unnamed';
            const level = document.getElementById('level').value || '1';
            const score = document.getElementById('score').value || '0';
            const gameData = document.getElementById('gameData').value;

            // Validate JSON
            try {
                JSON.parse(gameData);
            } catch (e) {
                showMessage('Invalid JSON in game data: ' + e.message, 'error');
                return;
            }

            const timestamp = new Date().toLocaleString();
            const fileName = `GameSave_${playerName}_L${level}_${Date.now()}.json`;

            const fileData = {
                playerName,
                level: parseInt(level),
                score: parseInt(score),
                gameData: JSON.parse(gameData),
                savedAt: timestamp
            };

            try {
                const response = await gapi.client.drive.files.create({
                    resource: {
                        name: fileName,
                        mimeType: 'application/json',
                        parents: [folderId]
                    },
                    media: {
                        mimeType: 'application/json',
                        body: JSON.stringify(fileData, null, 2)
                    },
                    fields: 'id'
                });

                showMessage(`✓ Game saved successfully as "${fileName}"`, 'success');
                document.getElementById('playerName').value = '';
                document.getElementById('level').value = '1';
                document.getElementById('score').value = '0';
                document.getElementById('gameData').value = '{}';
                
                setTimeout(() => refreshFileList(), 500);
            } catch (error) {
                showMessage('Error saving file: ' + error.message, 'error');
            }
        }

        // Refresh file list
        async function refreshFileList() {
            if (!folderId) return;

            try {
                const response = await gapi.client.drive.files.list({
                    q: `'${folderId}' in parents and trashed=false`,
                    spaces: 'drive',
                    fields: 'files(id, name, createdTime, webContentLink)',
                    orderBy: 'createdTime desc',
                    pageSize: 50
                });

                const fileList = document.getElementById('fileList');
                const files = response.result.files || [];

                if (files.length === 0) {
                    fileList.innerHTML = `
                        <div class="empty-state">
                            <p>No save files yet. Create one to get started!</p>
                        </div>
                    `;
                    return;
                }

                fileList.innerHTML = files.map(file => `
                    <div class="file-item">
                        <div class="file-item-info">
                            <div class="file-item-name">📄 ${escapeHtml(file.name)}</div>
                            <div class="file-item-date">Created: ${new Date(file.createdTime).toLocaleString()}</div>
                        </div>
                        <div class="file-item-actions">
                            <button class="btn-primary" onclick="loadGameData('${file.id}', '${escapeHtml(file.name)}')">Load</button>
                            <button class="btn-danger" onclick="deleteGameFile('${file.id}', '${escapeHtml(file.name)}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                showMessage('Error loading files: ' + error.message, 'error');
            }
        }

        // Load game data
        async function loadGameData(fileId, fileName) {
            try {
                const response = await gapi.client.drive.files.get({
                    fileId: fileId,
                    alt: 'media'
                });

                const data = response.result;
                document.getElementById('playerName').value = data.playerName || '';
                document.getElementById('level').value = data.level || '1';
                document.getElementById('score').value = data.score || '0';
                document.getElementById('gameData').value = JSON.stringify(data.gameData, null, 2);

                showMessage(`✓ Loaded "${fileName}"`, 'success');
                
                // Scroll to top
                document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                showMessage('Error loading file: ' + error.message, 'error');
            }
        }

        // Delete game file
        async function deleteGameFile(fileId, fileName) {
            if (confirm(`Are you sure you want to delete "${fileName}"?`)) {
                try {
                    await gapi.client.drive.files.delete({
                        fileId: fileId
                    });
                    showMessage(`✓ Deleted "${fileName}"`, 'success');
                    refreshFileList();
                } catch (error) {
                    showMessage('Error deleting file: ' + error.message, 'error');
                }
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on load
        window.addEventListener('load', initGoogleAPI);
    </script>
</body>
</html>
