<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#0d9488" />
<title>โปรไฟล์สมรรถนะ AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Tokens follow students/v2/dashboard.css (student dashboard) and the
   teacher dashboard header. Light theme only, same as both dashboards. */
:root {
  color-scheme: light;
  --bgA: #f7fbfb;
  --bgB: #ffffff;
  --panel: #ffffff;
  --panel-2: #f4f7f9;
  --ink: #102a2f;
  --ink-2: #334155;
  --muted: #5b6b6f;
  --line: #e3e8ee;
  --track: #e8eef2;
  --brand: #18a4aa;
  --brand-50: #e0faf8;
  --brand-500: #1fb9b7;
  --brand-700: #138a92;
  --brand-800: #0f6b72;
  --cat-1: #f56a6a;
  --cat-2: #f6b86a;
  --cat-3: #8ccf7a;
  --cat-4: #5f76c8;
  --ok: #166534; --ok-bg: #dcfce7; --ok-line: #bbf7d0;
  --info: #1d4ed8; --info-bg: #dbeafe; --info-line: #bfdbfe;
  --warn: #b45309; --warn-bg: #fef3c7;
  --idle: #475569; --idle-bg: #f1f5f9; --idle-line: #e2e8f0;
  --rXL: 24px; --rLG: 18px; --rMD: 14px;
  --shadow-sm: 0 6px 14px rgba(12,34,46,.07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 5%, rgba(31,185,183,.08), transparent 40%),
    radial-gradient(circle at 95% 15%, rgba(79,208,200,.10), transparent 45%),
    linear-gradient(180deg, var(--bgA), var(--bgB));
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Kanit", "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
  font-size: 15px; font-weight: 400; line-height: 1.5;
}
.num { font-feature-settings: "tnum" 1; }
h1, h2, h3 { margin: 0; line-height: 1.35; }
h2 { font-size: 18px; font-weight: 600; }
button, select { font: inherit; color: inherit; }

/* header: same shape as the teacher dashboard header */
.topnav {
  position: sticky; top: 0; z-index: 50; height: 60px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 22px; background: rgba(255,255,255,.82);
  backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border-bottom: 1px solid rgba(0,0,0,.05); box-shadow: 0 1px 2px rgba(16,24,40,.05);
}
.topnav .left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.topnav img { height: 34px; object-fit: contain; }
.topnav .vr { width: 1px; height: 26px; background: #e2e8f0; flex: none; }
.topnav .page { font-size: 15px; font-weight: 600; color: #1e293b; white-space: nowrap; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 600; background: linear-gradient(135deg, #2dd4bf, #0d9488); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
.clay { background: var(--panel); border: 1px solid var(--line); border-radius: var(--rXL); box-shadow: var(--shadow-sm); }
.clay-soft { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--rLG); }
.cat-card { border-left: 6px solid transparent; }
.cat-1 { border-left-color: var(--cat-1); } .cat-2 { border-left-color: var(--cat-2); }
.cat-3 { border-left-color: var(--cat-3); } .cat-4 { border-left-color: var(--cat-4); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 1.3; }
.st-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
.st-dev { background: var(--info-bg); color: var(--info); border-color: var(--info-line); }
.st-idle { background: var(--idle-bg); color: var(--idle); border-color: var(--idle-line); }

/* hero */
.hero { padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.org { display: inline-block; margin-top: 4px; padding: 2px 12px; border-radius: 999px; background: var(--brand-500); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.who .av { width: 56px; height: 56px; font-size: 20px; border-radius: 18px; }
.who h1 { font-size: 22px; font-weight: 700; }
.who .meta { color: var(--muted); font-size: 13px; font-weight: 300; }
.ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.demo-tag { padding: 3px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 12px; white-space: nowrap; }
select { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; font-size: 14px; }
select:focus { outline: none; border-color: rgba(31,185,183,.72); box-shadow: 0 0 0 4px rgba(31,185,183,.18); }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 12px 16px; }
.stat .label { color: #64748b; font-size: 13px; }
.stat .value { font-size: 26px; font-weight: 700; line-height: 1.25; }
.stat .value small { font-size: 14px; font-weight: 400; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: #e2e8f0; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand-700), var(--brand-500)); }

/* main */
.grid-main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 20px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

.wheel { display: block; width: 100%; height: auto; padding: 4px 8px 12px; }
.wheel .seg { cursor: pointer; outline: none; }
.wheel .seg:hover .name-bg { filter: brightness(.96); }
.wheel .seg:focus-visible .sel { stroke: #0f172a; stroke-width: 2.5; stroke-dasharray: 4 3; }
.wheel text { font-family: "Kanit", "Noto Sans Thai", sans-serif; pointer-events: none; }
.wheel .code { font-size: 14px; font-weight: 600; fill: #fff; }
.wheel .name { font-size: 10.5px; font-weight: 400; fill: #1e293b; }
.wheel .dname { font-size: 10.5px; font-weight: 600; fill: #fff; }

/* detail */
.detail { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.src { display: flex; flex-direction: column; gap: 10px; }
.crs { display: flex; gap: 10px; align-items: center; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
.crs:hover { border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(31,185,183,.12); }
.crs img { flex: none; width: 64px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: var(--panel-2); }
.crs .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.crs .n { font-size: 13px; font-weight: 500; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.crs .s { font-size: 12px; color: var(--muted); font-weight: 300; }
.crs .sc { flex: none; font-size: 13px; font-weight: 600; }
.crs.rec { background: var(--panel-2); }
.gain { display: inline-block; margin: 3px 4px 0 0; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.go { flex: none; padding: 6px 12px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; background: linear-gradient(90deg, var(--brand-700), var(--brand-500)); }
.d-title { font-size: 19px; font-weight: 600; margin-top: 8px; }
.d-title .c { color: var(--muted); margin-right: 6px; }
.meter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.step { position: relative; border-radius: var(--rMD); padding: 12px 6px; text-align: center; font-size: 14px; font-weight: 500; background: #f1f4f7; color: #94a3b8; border: 2px solid transparent; }
.step.need { background: #fff; border-style: dashed; }
.step .flag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 11px; padding: 0 8px; border-radius: 99px; background: #0f172a; color: #fff; white-space: nowrap; }
.status { font-size: 15px; font-weight: 500; }
.next { border-radius: var(--rMD); padding: 10px 14px; font-size: 14px; font-weight: 300; border-left: 5px solid; }
.next b { display: block; font-size: 12px; font-weight: 600; }
.label-sm { font-size: 13px; color: #64748b; margin-bottom: 8px; }
.ev { display: flex; flex-wrap: wrap; gap: 6px; }
.ev .chip { font-size: 13px; padding: 4px 10px; }
.ev .chip.sec { border-style: dashed; }
.muted { color: var(--muted); font-size: 14px; font-weight: 300; }

/* lessons */
.lessons { margin-top: 16px; overflow: hidden; }
.grid-main, #detail { scroll-margin-top: 76px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 0; border-bottom: 1px solid var(--line); }
.tab { flex: none; width: 250px; display: flex; gap: 10px; align-items: center; padding: 8px 10px; margin-bottom: -1px; border: 1px solid var(--line); border-radius: 14px 14px 0 0; background: var(--panel-2); cursor: pointer; text-align: left; opacity: .8; }
.tab:hover { opacity: 1; }
.tab.on { background: #fff; border-bottom-color: #fff; opacity: 1; box-shadow: inset 0 3px 0 var(--brand-500); }
.tab img { flex: none; width: 60px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; }
.tab .n { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; font-weight: 500; line-height: 1.3; }
.tab .chip { margin-top: 4px; font-size: 11px; padding: 0 8px; }
.cpanel { padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 18px; }
.ctop { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr); gap: 16px; align-items: center; }
.cinfo { display: flex; gap: 14px; align-items: center; min-width: 0; }
.cinfo img { flex: none; width: 150px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--panel-2); }
.cinfo .t { font-size: 15px; font-weight: 600; line-height: 1.4; }
.cinfo .link { margin-left: 10px; font-size: 13px; color: var(--brand-700); text-decoration: none; }
.cinfo .link:hover { text-decoration: underline; }
.cstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.got { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.got button { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; text-align: left; font-size: 14px; }
.got button:hover { border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(31,185,183,.12); }
.got .cd { flex: none; min-width: 36px; text-align: center; padding: 1px 6px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; }
.got .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.got .gain { margin: 0; flex: none; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 680px; }
th { text-align: left; font-size: 12px; font-weight: 500; color: #64748b; padding: 8px 12px; background: var(--panel-2); white-space: nowrap; }
th:first-child { border-radius: 10px 0 0 10px; } th:last-child { border-radius: 0 10px 10px 0; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td .lc { color: var(--muted); font-weight: 600; margin-right: 8px; }
.mini { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.mini .bar { flex: 1; margin: 0; }
.mini span { width: 40px; text-align: right; font-size: 13px; }
.cchip { display: inline-block; padding: 1px 8px; margin: 2px 4px 2px 0; border-radius: 8px; border: 1.5px solid; font-size: 12px; font-weight: 600; cursor: pointer; background: #fff; }
.cchip.sec { border-style: dashed; font-weight: 500; }
.foot { margin-top: 14px; color: var(--muted); font-size: 12px; font-weight: 300; text-align: center; }

@media (max-width: 1000px) {
  .ctop { grid-template-columns: minmax(0, 1fr); }
  .grid-main { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .topnav { padding: 0 12px; }
  .hide-sm { display: none; }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .cinfo img { width: 110px; }
  .got { grid-template-columns: minmax(0, 1fr); }
  .tabs { padding: 12px 12px 0; }
  .tab { width: 210px; }
  .cpanel { padding: 16px 14px 10px; }
  .ctrl { justify-content: flex-start; }
  .stat .value { font-size: 22px; }
}
@media print {
  .topnav, .ctrl select { display: none; }
  .clay { box-shadow: none; break-inside: avoid; }
}
</style>
</head>
<body>
<header class="topnav">
  <div class="left">
    <img src="https://lms.mooc.meca.in.th/static/sbs-themes/images/logo-adap-green-untext.1c98bf032947.png" alt="MECA" />
    <span class="vr hide-sm"></span>
    <img class="hide-sm" src="https://www.nectec.or.th/wp-content/uploads/2021/08/cropped-logo.png" alt="NECTEC" />
    <span class="vr"></span>
    <span class="page">โปรไฟล์สมรรถนะ AI</span>
  </div>
  <span class="av" id="nav-av"></span>
</header>

<main class="wrap">
  <section class="clay hero">
    <div class="who">
      <div class="av" id="avatar"></div>
      <div>
        <h1 id="s-name"></h1>
        <div class="meta" id="s-meta"></div>
      </div>
    </div>
    <div class="ctrl">
      <span class="demo-tag">ข้อมูลตัวอย่าง</span>
      <select id="band" aria-label="เป้าหมายช่วงชั้น"></select>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <div class="grid-main">
    <section class="clay">
      <div class="head">
        <h2>วงล้อสมรรถนะ AI</h2>
        <div class="legend" id="legend"></div>
      </div>
      <svg class="wheel" id="wheel" viewBox="-380 -380 760 760" role="img" aria-label="วงล้อสมรรถนะ AI"></svg>
    </section>
    <section class="clay" aria-live="polite">
      <div class="detail" id="detail"></div>
    </section>
  </div>

  <section class="clay lessons">
    <div class="head"><h2>หลักสูตรที่เรียน</h2></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="cpanel" id="cpanel" role="tabpanel"></div>
  </section>

  <div class="foot">ข้อมูลนักเรียน และการ mapping ของหลักสูตรอื่นนอกจาก ม.ปลาย Module 1 เป็นข้อมูลจำลอง · กรอบสมรรถนะ AI ฉบับร่าง</div>
</main>

<script>
(function () {
  "use strict";

  // ---------- Framework (from the reference images) ----------
  var LEVELS = ["", "เข้าใจ", "ประยุกต์", "ต่อยอด"];

  var BANDS = [
    { id: "p", label: "เป้าหมาย ประถมศึกษา" },
    { id: "m1", label: "เป้าหมาย ม.ต้น" },
    { id: "m2", label: "เป้าหมาย ม.ปลาย + ปวช." },

  ];

  // shade[0..2] = เข้าใจ / ประยุกต์ / ต่อยอด (light → dark, like the rubric table header)
  // on[0..2] = text color on each shade; tint = name ring; solid = code ring.
  var DOMAINS = [
    { id: 1, name: ["การอยู่ร่วมกับ", "ปัญญาประดิษฐ์"], full: "การอยู่ร่วมกับปัญญาประดิษฐ์", icon: "chip",
      bubble: "#2563a8", solid: "#1d4f8c", tint: "#e3edf8", shade: ["#a9c8ec", "#5b93d3", "#1f5aa0"], on: ["#123d6e", "#fff", "#fff"] },

      bubble: "#16967a", solid: "#0f7a64", tint: "#ddf2eb", shade: ["#9edcc8", "#3aae92", "#0f7a64"], on: ["#0b5244", "#fff", "#fff"] },
    { id: 3, name: ["การจัดการการใช้", "ปัญญาประดิษฐ์"], full: "การจัดการการใช้ปัญญาประดิษฐ์", icon: "shield",

  // t = target level per band [ประถม, ม.ต้น, ม.ปลาย+ปวช., ปวส.+อุดมศึกษา]; l = wheel label lines
  var COMPETENCIES = [
    { code: "1.1", d: 1, t: [1, 2, 3, 3], name: "ตระหนักถึงบทบาทของ AI ในชีวิตและสังคม", l: ["ตระหนักถึง", "บทบาทของ AI", "ในชีวิตและสังคม"] },

    { code: "1.3", d: 1, t: [1, 2, 3, 3], name: "ประเมินผลลัพธ์ของ AI อย่างมีวิจารณญาณ", l: ["ประเมินผลลัพธ์", "ของ AI อย่างมี", "วิจารณญาณ"] },
    { code: "1.4", d: 1, t: [1, 2, 3, 3], name: "รู้เท่าทัน AI แนะนำเนื้อหา", l: ["รู้เท่าทัน AI", "แนะนำเนื้อหา"] },
    { code: "1.5", d: 1, t: [1, 2, 3, 3], name: "วิเคราะห์อคติและความเป็นธรรมในการใช้ AI", l: ["วิเคราะห์อคติ", "และความเป็นธรรม", "ในการใช้ AI"] },

  var ICONS = {
    chip: '<rect x="-9" y="-9" width="18" height="18" rx="3"/><rect x="-4" y="-4" width="8" height="8" rx="1"/><path d="M-5 -13v4M0 -13v4M5 -13v4M-5 9v4M0 9v4M5 9v4M-13 -5h4M-13 0h4M-13 5h4M9 -5h4M9 0h4M9 5h4"/>',
    bulb: '<path d="M-6 6c0-4-6-6-6-12a12 12 0 0 1 24 0c0 6-6 8-6 12z"/><path d="M-5 10h10M-3 14h6M0 -20v-3M14 -14l2-2M-14 -14l-2-2"/>',
    shield: '<path d="M0 -14l11 4v8c0 8-5 13-11 16c-6-3-11-8-11-16v-8z"/><path d="M-5 0l4 4l7-8"/>',
    code: '<rect x="-14" y="-11" width="28" height="19" rx="2"/><path d="M-6 14h12M0 8v6M-4 -5l-4 3l4 3M4 -5l4 3l-4 3M1 -6l-2 8"/>'
  };

  function renderWheel() {
    var gapD = 2, gapS = 0.7, seg = (360 - gapD * 4) / COMPETENCIES.length;
    var cur = 270 - 6 * seg / 2, lastD = 1, html = "";
    html += '<defs><radialGradient id="disc" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4e9ef"/></radialGradient></defs>';

    COMPETENCIES.forEach(function (c) {
      if (c.d !== lastD) { cur += gapD; lastD = c.d; }
      var a0 = cur + gapS / 2, a1 = cur + seg - gapS / 2, mid = (a0 + a1) / 2, d = dom(c);
      cur += seg;
      var a = achieved(c);
      var g = '<g class="seg" tabindex="0" role="button" data-code="' + c.code + '" aria-label="' + esc(c.code + " " + c.name) + '">';
      g += "<title>" + esc(c.code + " " + c.name + " · " + (a ? LEVELS[a] : "ยังไม่มีระดับ")) + "</title>";
      g += '<path d="' + arc(R.code[0], R.code[1], a0, a1) + '" fill="' + d.solid + '"/>';
      var cp = pt((R.code[0] + R.code[1]) / 2, mid);
      g += '<text class="code" x="' + cp[0].toFixed(1) + '" y="' + cp[1].toFixed(1) + '" text-anchor="middle" dominant-baseline="central">' + c.code + "</text>";
      g += '<path class="name-bg" d="' + arc(R.name[0], R.name[1], a0, a1) + '" fill="' + d.tint + '"/>';
      var np = pt((R.name[0] + R.name[1]) / 2, mid);
      g += multiline(c.l, np[0], np[1], "name", 13);
      // 3 level blocks: เข้าใจ / ประยุกต์ / ต่อยอด, shaded light → dark
      var bw = (a1 - a0) / 3;
      for (var k = 1; k <= 3; k++) {
        var b0 = a0 + (k - 1) * bw + (k > 1 ? 0.35 : 0), b1 = a0 + k * bw - (k < 3 ? 0.35 : 0);
        // Student's level only (target is shown in the side panel): reached = shade, not yet = gray
        g += '<path d="' + arc(R.lv[0], R.lv[1], b0, b1) + '" fill="' + (k <= a ? d.shade[k - 1] : "#e6ebf0") + '"/>';
      }
      var on = state.selected === c.code;
      g += '<path class="sel" d="' + arc(R.code[0] - 1, R.lv[1] + 2, a0 - 0.3, a1 + 0.3) + '" fill="none" stroke="' + (on ? "#0f172a" : "transparent") + '" stroke-width="' + (on ? 3 : 0) + '" stroke-linejoin="round"/>';
      html += g + "</g>";
    });

    // center: 4 domain bubbles
    html += '<circle r="' + R.disc + '" fill="url(#disc)"/>';
    html += '<circle r="84" fill="none" stroke="#cbd5e1" stroke-dasharray="3 5"/>';
    var pos = { 1: [-84, 0], 2: [0, -84], 3: [84, 0], 4: [0, 84] };
    DOMAINS.forEach(function (d) {
      var p = pos[d.id];
      html += '<g transform="translate(' + p[0] + " " + p[1] + ')">' +
        '<circle r="56" fill="' + d.bubble + '" stroke="#fff" stroke-width="3"/>' +
        '<g transform="translate(0 -20)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[d.icon] + "</g>" +
        multiline(d.name, 0, 16, "dname", 13) + "</g>";
    });
    $("wheel").innerHTML = html;
  }

  function renderLegend() {
    var s = DOMAINS[0].shade;
    $("legend").innerHTML =
      '<span><i class="sw" style="background:' + s[0] + '"></i>เข้าใจ</span>' +
      '<span><i class="sw" style="background:' + s[1] + '"></i>ประยุกต์</span>' +
      '<span><i class="sw" style="background:' + s[2] + '"></i>ต่อยอด</span>' +
      '<span><i class="sw" style="background:#e6ebf0"></i>ยังไม่ได้</span>';
  }

  // ---------- detail ----------
  function courseLabel(crs) { return crs.band + " · " + crs.name; }

  function renderDetail() {
    var c = byCode[state.selected], d = dom(c), a = achieved(c), t = target(c), ev = evidenceOf(c.code);

    var meter = "";
    for (var k = 1; k <= 3; k++) {
      var style = "", cls = "step";
      if (k <= a) style = "background:" + d.shade[k - 1] + ";color:" + d.on[k - 1];
      // not reached yet but required: white box, dashed border + text in the domain color
      // (level 1 uses the medium shade for the border so it stays visible on white)
      else if (k <= t) { cls += " need"; style = "background:#fff;border-color:" + d.shade[Math.max(k - 1, 1)] + ";color:" + d.solid; }
      meter += '<div class="' + cls + '" style="' + style + '">' + (k === t ? '<span class="flag">เป้าหมาย</span>' : "") + LEVELS[k] + "</div>";
    }

    var status;
    if (a >= t) status = '<span style="color:var(--ok)">✓ ถึงเป้าหมายแล้ว</span>';
    else if (a) status = "ได้ระดับ" + LEVELS[a] + " · อีก " + (t - a) + " ระดับถึงเป้าหมาย";
    else status = '<span class="muted">ยังไม่มีระดับ</span>';

    var html = "<div>" +
      '<span class="chip" style="background:' + d.bubble + ';color:#fff">โดเมน ' + d.id + " · " + esc(d.full) + "</span>" +
      '<div class="d-title"><span class="c">' + c.code + "</span>" + esc(c.name) + "</div></div>" +
      '<div class="meter">' + meter + "</div>" +
      '<div class="status">' + status + "</div>";

    // where the levels came from: one row per course, with level tags like the recommendations
    if (ev.length) {
      var byCourse = {};
      ev.forEach(function (e) { (byCourse[e.course] = byCourse[e.course] || []).push(e); });
      var maxLv = function (list) { return list.reduce(function (m, e) { return Math.max(m, e.lv); }, 0); };
      var keys = Object.keys(byCourse).sort(function (x, y) { return maxLv(byCourse[y]) - maxLv(byCourse[x]); });
      html += '<div><div class="label-sm">ได้มาจาก</div><div class="src">' + keys.map(function (k) {
        var crs = COURSES[k], list = byCourse[k];
        var lessons = list.map(function (e) {
          var l = lessonByCode[e.lesson];
          return k === CURRENT && l ? "บท " + e.lesson + (list.length === 1 ? " " + l.name : "") : e.lesson;
        }).filter(function (v, i, arr) { return arr.indexOf(v) === i; }).join(", ");
        var lvs = list.map(function (e) { return e.lv; }).filter(function (v, i, arr) { return arr.indexOf(v) === i; }).sort();
        var tags = lvs.map(function (l) {
          return '<span class="gain" style="background:' + d.shade[l - 1] + ";color:" + d.on[l - 1] + '">' + LEVELS[l] + "</span>";
        }).join("");
        var score = Math.round(list.reduce(function (s, e) { return s + e.score; }, 0) / list.length);
        return '<a class="crs" href="' + crs.url + '" target="_blank" rel="noopener">' +
          '<img src="' + crs.cover + '" alt="" loading="lazy">' +
          '<span class="tx"><span class="n">' + esc(courseLabel(crs)) + '</span><span class="s">' + esc(lessons) + "</span><span>" + tags + "</span></span>" +
          '<span class="sc num">' + score + "%</span></a>";
      }).join("") + "</div></div>";
    }

    // courses that would fill this competency further
    var rec = recommend(c);
    if (rec.length) {
      html += '<div><div class="label-sm">แนะนำเพื่อเติมเต็มสมรรถนะนี้</div><div class="src">' + rec.map(function (r) {
        var cur = r.crs.key === CURRENT;
        var gains = r.gain.map(function (l) {
          return '<span class="gain" style="background:' + d.shade[l - 1] + ";color:" + d.on[l - 1] + '">+ ' + LEVELS[l] + "</span>";
        }).join("");
        var sub = cur ? "บทที่เหลือ " + r.rest.map(function (l) { return l.code; }).join(", ") : "";
        return '<a class="crs rec" href="' + r.crs.url + '" target="_blank" rel="noopener">' +
          '<img src="' + r.crs.cover + '" alt="" loading="lazy">' +
          '<span class="tx"><span class="n">' + esc(courseLabel(r.crs)) + "</span>" +
          (sub ? '<span class="s">' + esc(sub) + "</span>" : "") + "<span>" + gains + "</span></span>" +
          '<span class="go">' + (cur ? "เรียนต่อ" : "ไปเรียน") + " →</span></a>";
      }).join("") + "</div></div>";
    } else if (a >= 3) {
      html += '<div class="muted">ได้ระดับสูงสุดแล้ว</div>';
    }

    $("detail").innerHTML = html;
  }

  // ---------- courses taken (tab bar) ----------
  function fullTitle(crs) {
    return "ปัญญาประดิษฐ์สำหรับนักเรียนระดับชั้นมัธยมศึกษา" + (crs.band === "ม.ต้น" ? "ตอนต้น" : "ตอนปลาย") + " : " + crs.name;
  }
  function courseSummary(k) {
    if (k === CURRENT) {
      var ls = MODULE.lessons, done = ls.filter(function (l) { return lessonStatus(l.code) === "done"; }).length;
      var prog = Math.round(ls.reduce(function (s, l) { var p = STUDENT.progress[l.code]; return s + (p[0] + p[1]) / 2; }, 0) / ls.length);
      var q = ls.map(function (l) { return STUDENT.progress[l.code][2]; }).filter(function (v) { return v != null; });
      return { total: ls.length, done: done, progress: prog, score: q.length ? Math.round(q.reduce(function (a, b) { return a + b; }, 0) / q.length) : 0 };
    }
    var r = STUDENT.results[k];
    return { total: r.lessons, done: r.done, progress: Math.round(r.done / r.lessons * 100), score: r.score, year: r.year };
  }
  function takenCourses() {
    return Object.keys(STUDENT.courses).sort(function (x, y) { return (y === CURRENT) - (x === CURRENT); });
  }
  var COURSE_ST = { done: ["เรียนจบ", "st-ok"], doing: ["กำลังเรียน", "st-dev"] };

  function renderCourses() {
    $("tabs").innerHTML = takenCourses().map(function (k) {
      var crs = COURSES[k], st = COURSE_ST[STUDENT.courses[k]], on = state.course === k;
      return '<button class="tab' + (on ? " on" : "") + '" role="tab" aria-selected="' + on + '" data-course="' + k + '">' +
        '<img src="' + crs.cover + '" alt="">' +
        '<span><span class="n">' + esc(crs.band + " · " + crs.name) + '</span><span class="chip ' + st[1] + '">' + st[0] + "</span></span></button>";
    }).join("");

    var k = state.course, crs = COURSES[k], sum = courseSummary(k), cur = k === CURRENT;
    var html = '<div class="ctop"><div class="cinfo"><img src="' + crs.cover + '" alt=""><div>' +
      '<div class="t">' + esc(fullTitle(crs)) + "</div>" +
      '<span class="org">NECTEC</span><a class="link" href="' + crs.url + '" target="_blank" rel="noopener">เปิดหลักสูตร ↗</a></div></div>' +
      '<div class="cstats">' +
      stat("cat-2", "ความคืบหน้า", sum.progress + "%", "", sum.progress) +
      stat("cat-3", "บทเรียนที่ผ่าน", sum.done, " / " + sum.total, sum.done / sum.total * 100) +
      stat("cat-4", "คะแนนเฉลี่ย", sum.score + "%", "", sum.score) +
      "</div></div>";

    // competencies this course gave the student
    var byComp = {};
    STUDENT.evidence.forEach(function (e) {
      if (e.course !== k) return;
      (byComp[e.comp] = byComp[e.comp] || []).indexOf(e.lv) < 0 && byComp[e.comp].push(e.lv);
    });
    var codes = Object.keys(byComp).sort();
    html += '<div><div class="label-sm">สมรรถนะที่ได้จากหลักสูตรนี้ · ' + codes.length + " สมรรถนะ</div>";
    html += codes.length ? '<div class="got">' + codes.map(function (code) {
      var c = byCode[code], d = dom(c);
      var tags = byComp[code].sort().map(function (l) {
        return '<span class="gain" style="background:' + d.shade[l - 1] + ";color:" + d.on[l - 1] + '">' + LEVELS[l] + "</span>";
      }).join("");
      return '<button data-code="' + code + '" title="' + esc(c.name) + '"><span class="cd" style="background:' + d.solid + '">' + code + '</span><span class="nm">' + esc(c.name) + "</span>" + tags + "</button>";
    }).join("") + "</div>" : '<div class="muted">ยังไม่มีสมรรถนะที่ได้</div>';
    html += "</div>";

    if (cur) {
      html += '<div><div class="label-sm">บทเรียน</div><div class="table-wrap"><table>' +
        "<thead><tr><th>บทเรียน</th><th>สถานะ</th><th>ความคืบหน้า</th><th>แบบทดสอบ</th><th>สมรรถนะ</th></tr></thead><tbody>" +
        lessonRows() + "</tbody></table></div></div>";
    }
    $("cpanel").innerHTML = html;
  }
  function stat(cat, label, value, of, bar) {
    return '<div class="clay-soft cat-card ' + cat + ' stat"><div class="label">' + label + '</div><div class="value num">' + value +
      (of ? "<small>" + of + "</small>" : "") + '</div><div class="bar"><i style="width:' + Math.round(bar) + '%"></i></div></div>';
  }
  function lessonRows() {
    return MODULE.lessons.map(function (l) {
      var p = STUDENT.progress[l.code], st = LESSON_ST[lessonStatus(l.code)], prog = Math.round((p[0] + p[1]) / 2);
      var chips = l.main.map(function (k) { return chip(k, false); }).concat(l.sec.map(function (k) { return chip(k, true); })).join("");
      return "<tr><td><span class=\"lc num\">" + l.code + "</span>" + esc(l.name) + "</td>" +
        '<td><span class="chip ' + st[1] + '">' + st[0] + "</span></td>" +
        '<td><div class="mini"><div class="bar"><i style="width:' + prog + '%"></i></div><span class="num">' + prog + "%</span></div></td>" +
        '<td class="num">' + (p[2] != null ? p[2] + "%" : '<span class="muted">–</span>') + "</td><td>" + chips + "</td></tr>";
    }).join("");
  }
  function chip(code, sec) {
    var c = byCode[code], d = dom(c);
    return '<button class="cchip' + (sec ? " sec" : "") + '" data-code="' + code + '" title="' + esc(c.name + (sec ? " (รอง)" : "")) + '" style="border-color:' + d.solid + ";color:" + d.solid + (sec ? "" : ";background:" + d.tint) + '">' + code + "</button>";
  }

  // ---------- wiring ----------
  function render() { renderStats(); renderWheel(); renderDetail(); }
  function select(code, refocus, fromBelow) {
    if (!byCode[code]) return;
    state.selected = code;
    renderWheel(); renderDetail();
    if (refocus) { var el = $("wheel").querySelector('.seg[data-code="' + code + '"]'); if (el) el.focus(); }
    else if (window.innerWidth <= 1000) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
    else if (fromBelow) document.querySelector(".grid-main").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-course]");
    if (tab) { state.course = tab.getAttribute("data-course"); renderCourses(); return; }
    var el = e.target.closest("[data-code]");
    if (el) select(el.getAttribute("data-code"), false, !!el.closest(".lessons"));
  });
  $("wheel").addEventListener("keydown", function (e) {
    var el = e.target.closest(".seg");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(el.getAttribute("data-code"), true); }
  });
  var sel = $("band");
  sel.innerHTML = BANDS.map(function (b) { return '<option value="' + b.id + '"' + (b.id === state.band ? " selected" : "") + ">" + b.label + "</option>"; }).join("");
  sel.addEventListener("change", function () { state.band = sel.value; renderStats(); renderDetail(); });

  $("avatar").textContent = $("nav-av").textContent = STUDENT.initials;
  $("s-name").textContent = STUDENT.name;
  $("s-meta").textContent = STUDENT.meta;
  renderLegend();
  renderCourses();
  render();
})();
</script>
</body>
</html>
