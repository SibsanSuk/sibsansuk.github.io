<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kidbright</title>

  <!-- Tailwind (CDN) เพื่อลด CSS ที่ต้องเขียนเอง -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    /* Claymorphism helpers + subtle dotted background */
    :root{
      --bgA:#f7fbfb;
      --bgB:#ffffff;
      --surface:#ffffff;
      --surface-2:#f4f7f9;
      --ink:#102a2f;
      --muted:#5b6b6f;
      --border:#e3e8ee;
      --brand-900:#0b4f55;
      --brand-800:#0f6b72;
      --brand-700:#138a92;
      --brand-600:#18a4aa;
      --brand-500:#1fb9b7;
      --brand-400:#4fd0c8;
      --brand-300:#87e2da;
      --brand-200:#b7f1ec;
      --brand-100:#e0faf8;
      --success:#18b879;
      --info:#4f8cff;
      --warning:#f59e0b;
      --danger:#f97316;
      --cat-1:#f56a6a;
      --cat-2:#f6b86a;
      --cat-3:#8ccf7a;
      --cat-4:#5f76c8;
      --cat-5:#c59cff;
      --rXL:24px; --rLG:18px; --rMD:14px;
    }
    *{ -webkit-tap-highlight-color: transparent; }
    html, body{ height: 100%; }
    body{
      background:
        radial-gradient(circle at 10% 5%, rgba(31,185,183,.08), transparent 40%),
        radial-gradient(circle at 95% 15%, rgba(79,208,200,.10), transparent 45%),
        linear-gradient(180deg, var(--bgA), var(--bgB));
      color: var(--ink);
      font-family: "Kanit", "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
      margin: 0;
      padding: 16px 12px;
      overscroll-behavior: none;
      overflow: hidden;
    }
    .app-frame{
      border: 3px solid var(--brand-500);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 14px 30px rgba(15, 107, 114, .12);
      overflow: hidden;
      height: calc(100dvh - 32px);
      display: flex;
      flex-direction: column;
    }
    .app-body{
      flex: 1;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      background: var(--surface);
    }
    .app-content{
      height: 100%;
      padding: 12px;
      display: flex;
    }
    .app-shell{
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      gap: 12px;
    }
    .sidebar{
      width: 280px;
      background: linear-gradient(180deg, rgba(31,185,183,.12), rgba(255,255,255,1));
      border: 1px solid var(--border);
      border-radius: var(--rLG);
      box-shadow: 0 8px 18px rgba(24, 164, 170, .12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .2s ease, transform .2s ease;
    }
    .sidebar.is-collapsed{ width: 84px; }
    .sidebar-header{
      padding: 14px 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .sidebar-title{
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-logos{
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sidebar.is-collapsed .sidebar-logos,
    .sidebar.is-collapsed .sidebar-title span{
      display: none;
    }
    .sidebar-nav{
      flex: 1;
      overflow: auto;
      padding: 8px;
    }
    .sidebar-btn{
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 16px;
      transition: background .2s ease, transform .12s ease;
      color: var(--muted);
      font-weight: 600;
      text-align: left;
    }
    .sidebar-btn:hover{ background: rgba(255,255,255,.7); }
    .sidebar-btn.active{
      background: var(--brand-100);
      color: var(--brand-800);
      border: 1px solid var(--brand-200);
      box-shadow: 0 8px 16px rgba(12, 34, 46, .08);
    }
    .sidebar-short{ display: none; }
    .sidebar.is-collapsed .sidebar-label{ display: none; }
    .sidebar.is-collapsed .sidebar-short{ display: inline; }
    .sidebar-footer{
      padding: 10px 12px 12px;
      border-top: 1px solid var(--border);
    }
    .bottom-nav{
      display: none;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(14px);
    }
    .bottom-nav-inner{
      display: flex;
      justify-content: space-around;
      gap: 8px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    }
    .bottom-tab{
      flex: 1 1 0;
      min-width: 64px;
      padding: 8px 6px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2px;
      text-align: center;
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .bottom-tab.is-active{
      color: var(--brand-800);
      border-color: var(--brand-200);
      background: var(--brand-100);
      box-shadow: 0 10px 16px rgba(12, 34, 46, .12);
      transform: translateY(-2px);
    }
    .sidebar-toggle{ display: grid; }
    .app-main{
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .page-screen{
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .page-head{
      flex: 0 0 auto;
    }
    .page-scroll{
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .dots{
      background-image: none;
    }
    .clay{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--rXL);
      box-shadow: 0 8px 20px rgba(12, 34, 46, .05);
    }
    .clay-soft{
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--rLG);
      box-shadow: none;
    }
    .panel{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--rLG);
    }
    .input-inset{
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--rLG);
      box-shadow: inset 0 2px 6px rgba(12, 34, 46, .12);
    }
    .input-inset:focus-within{
      border-color: var(--brand-300);
      box-shadow: 0 0 0 4px rgba(79,208,200,.18), inset 0 2px 6px rgba(12, 34, 46, .12);
    }
    .pill{
      border-radius: 999px;
      border: 1px solid rgba(15,107,114,.18);
      box-shadow:
        0 18px 30px rgba(12, 34, 46, .18),
        0 6px 16px rgba(24, 164, 170, .18),
        inset 0 2px 0 rgba(255,255,255,.75),
        inset 0 -6px 12px rgba(0,0,0,.08);
    }
    .pill:hover{
      box-shadow:
        0 20px 34px rgba(12, 34, 46, .20),
        0 10px 22px rgba(24, 164, 170, .22),
        inset 0 2px 0 rgba(255,255,255,.8),
        inset 0 -8px 14px rgba(0,0,0,.10);
    }
    .pill:active{ transform: translateY(1px); filter: brightness(.98); }
    .ghost{
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 12px 20px rgba(12, 34, 46, .14), inset 0 1px 0 rgba(255,255,255,.7);
      border-radius: 999px;
    }
    .tabActive{
      border: 1px solid var(--brand-200);
      background: var(--brand-100);
      color: var(--brand-800);
    }
    .tabBtn{
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
    }
    .tabBtn:hover{
      border-color: var(--border);
      background: var(--surface-2);
      color: var(--ink);
    }
    .tab-strip{
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .chip{
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .cat-card{
      border-left: 6px solid transparent;
      padding-left: 14px;
    }
    .cat-1{ border-left-color: var(--cat-1); }
    .cat-2{ border-left-color: var(--cat-2); }
    .cat-3{ border-left-color: var(--cat-3); }
    .cat-4{ border-left-color: var(--cat-4); }
    .cat-5{ border-left-color: var(--cat-5); }
    .cat-pill{
      border-radius: 999px;
      padding: 4px 10px;
      font-size: .75rem;
      color: #0f172a;
      border: 1px solid rgba(0,0,0,.06);
    }
    .cat-pill.cat-1{ background: rgba(245,106,106,.18); }
    .cat-pill.cat-2{ background: rgba(246,184,106,.2); }
    .cat-pill.cat-3{ background: rgba(140,207,122,.2); }
    .cat-pill.cat-4{ background: rgba(95,118,200,.18); color: #1f2a52; }
    .cat-pill.cat-5{ background: rgba(197,156,255,.2); }
    .mono{ font-feature-settings: "tnum" 1, "ss01" 1; }
    .text-brand{ color: var(--brand-700); }
    .text-brand-soft{ color: var(--brand-600); }
    .grad-brand{ background: linear-gradient(90deg, var(--brand-700), var(--brand-500)); }
    .grad-success{ background: linear-gradient(90deg, #18b879, #2fd19a); }
    .grad-danger{ background: linear-gradient(90deg, #f97316, #fb923c); }
    .btn-soft{
      color: var(--brand-800);
      background: #ffffff;
      border: 1px solid var(--border);
    }
    .badge{
      font-size: .75rem;
      padding: .25rem .6rem;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .badge-done{ background: rgba(24,184,121,.12); color: #0f7a55; border-color: rgba(24,184,121,.25); }
    .badge-doing{ background: rgba(79,140,255,.12); color: #3566c6; border-color: rgba(79,140,255,.25); }
    .badge-todo{ background: rgba(148,163,184,.12); color: #637183; border-color: rgba(148,163,184,.25); }
    .badge-locked{ background: rgba(249,115,22,.12); color: #b45309; border-color: rgba(249,115,22,.25); }
    .dot-done{ background: var(--success); }
    .dot-doing{ background: var(--info); }
    .dot-todo{ background: #94a3b8; }
    .dot-locked{ background: var(--warning); }
    .chart-canvas{
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 1024px){
      body{
        padding: 0;
        background:
          radial-gradient(circle at 15% 5%, rgba(31,185,183,.10), transparent 40%),
          linear-gradient(180deg, var(--bgA), var(--bgB));
      }
      .app-frame{
        border: none;
        border-radius: 0;
        box-shadow: none;
        height: 100dvh;
      }
      .app-content{ padding: 10px; }
      .app-shell{ gap: 0; }
    }
    @media (orientation: portrait){
      .sidebar{ display: none; }
      .sidebar-toggle{ display: none; }
      .bottom-nav{ display: block; }
      .page-scroll{ padding-bottom: 72px; }
    }
    @media (orientation: landscape){
      .bottom-nav{ display: none; }
    }
    @media (hover: none){
      .pill:hover{ box-shadow: 0 18px 30px rgba(12, 34, 46, .18); }
      .tabBtn:hover{ background: transparent; }
    }
  </style>
</head>

<body class="min-h-screen dots">
  <div id="app"></div>

  <!-- React UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- htm (template literal) แทน JSX เพื่อไม่ต้องใช้ Babel -->
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <script>
    const { useMemo, useState, useEffect, useRef } = React;
    const html = htm.bind(React.createElement);

    const NAV = [
      { id:"course", label:"หลักสูตร", short:"คส" },
      { id:"content", label:"เนื้อหา", short:"นห" },
      { id:"forum", label:"กระดานถาม", short:"ถ" },
      { id:"wiki", label:"Wiki", short:"W" },
      { id:"analytics", label:"วิเคราะห์", short:"วค" },
      { id:"results", label:"ผลลัพธ์", short:"ผล" },
      { id:"table", label:"ตาราง", short:"ต" },
    ];

    const OIDC = {
      authorizationEndpoint: "https://id.meca.in.th/auth/realms/kidbright/protocol/openid-connect/auth",
      tokenEndpoint: "https://id.meca.in.th/auth/realms/kidbright/protocol/openid-connect/token",
      userinfoEndpoint: "https://id.meca.in.th/auth/realms/kidbright/protocol/openid-connect/userinfo",
      clientId: "dashboard",
      redirectUri: "https://sibsansuk.github.io/VK/index.html",
      scope: "openid profile email",
    };

    const base64Url = (buffer) => {
      const bytes = new Uint8Array(buffer);
      let str = "";
      for (let i = 0; i < bytes.length; i += 1) str += String.fromCharCode(bytes[i]);
      return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    };

    const sha256 = (plain) => crypto.subtle.digest("SHA-256", new TextEncoder().encode(plain));

    const createVerifier = () => {
      const arr = new Uint8Array(32);
      crypto.getRandomValues(arr);
      return base64Url(arr);
    };

    const buildAuthUrl = async () => {
      const verifier = createVerifier();
      const challenge = base64Url(await sha256(verifier));
      sessionStorage.setItem("pkce_verifier", verifier);
      const params = new URLSearchParams({
        client_id: OIDC.clientId,
        redirect_uri: OIDC.redirectUri,
        response_type: "code",
        scope: OIDC.scope,
        code_challenge: challenge,
        code_challenge_method: "S256",
      });
      return `${OIDC.authorizationEndpoint}?${params.toString()}`;
    };

    const startLogin = async () => {
      if (OIDC.clientId === "YOUR_CLIENT_ID") {
        alert("กรุณาใส่ client_id ก่อนใช้งานปุ่ม Login");
        return;
      }
      const url = await buildAuthUrl();
      window.location.href = url;
    };

    const decodeJwt = (token) => {
      try {
        const payload = token.split(".")[1];
        const padded = payload.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(payload.length / 4) * 4, "=");
        return JSON.parse(atob(padded));
      } catch (e) {
        return null;
      }
    };

    const storeAuth = (auth) => sessionStorage.setItem("oidc_auth", JSON.stringify(auth));
    const readAuth = () => {
      const raw = sessionStorage.getItem("oidc_auth");
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    };
    const clearAuth = () => sessionStorage.removeItem("oidc_auth");

    const exchangeCodeForToken = async (code) => {
      const verifier = sessionStorage.getItem("pkce_verifier");
      if (!verifier) throw new Error("missing PKCE verifier");
      const body = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: OIDC.clientId,
        redirect_uri: OIDC.redirectUri,
        code,
        code_verifier: verifier,
      });
      const res = await fetch(OIDC.tokenEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || "token exchange failed");
      }
      return res.json();
    };

    const fetchUserInfo = async (accessToken) => {
      const res = await fetch(OIDC.userinfoEndpoint, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) return null;
      return res.json();
    };

    const mock = {
      course: { title:"VK Test (25-01-30)", progress:0.74, schedule:"เริ่ม 20 ม.ค. 2026 • ปิด 30 ม.ค. 2026" },
      units: [
        { id:"u1", name:"unit 1", items:[
          { id:"p1", type:"quiz", name:"ข้อสอบก่อนเรียน", status:"done" },
          { id:"q1", type:"quiz", name:"ข้อ 1", status:"doing" },
          { id:"q2", type:"quiz", name:"ข้อ 2", status:"todo" },
        ]},
        { id:"u2", name:"unit 2", items:[
          { id:"l1", type:"lesson", name:"บทเรียน 1", status:"todo" },
          { id:"l2", type:"lesson", name:"บทเรียน 2", status:"todo" },
        ]},
        { id:"u3", name:"unit 3", items:[
          { id:"e1", type:"exam", name:"แบบทดสอบปลายหน่วย", status:"locked" },
        ]},
      ],
      wiki: { title:"VK Test (25-01-30)", body:"เนื้อหาสรุปสำหรับคอร์ส VK Test พร้อมเอกสารประกอบและลิงก์ที่เกี่ยวข้อง" },
      student: { name:"student", id:"student", overall:0.68, byUnit:[0.9,0.55,0.0] },
      results: { speed:0.62, performance:0.71 }
    };

    const Badge = ({status}) => {
      const map = {
        done: { t:"ผ่านแล้ว", c:"badge badge-done" },
        doing:{ t:"กำลังทำ", c:"badge badge-doing" },
        todo: { t:"ยังไม่เริ่ม", c:"badge badge-todo" },
        locked:{ t:"ล็อก", c:"badge badge-locked" },
      };
      const m = map[status] || map.todo;
      return html`<span class=${m.c}>${m.t}</span>`;
    };

    const CatPill = ({tone, children}) => html`
      <span class=${"cat-pill cat-" + tone}>${children}</span>
    `;

    const ClayButton = ({variant="primary", onClick, children, small}) => {
      const v = {
        primary: "text-white grad-brand",
        soft: "btn-soft",
        danger: "text-white grad-danger",
        success: "text-white grad-success",
      }[variant] || "text-white grad-brand";
      return html`
        <button
          class=${(small?"text-xs px-3 py-2":"text-sm px-4 py-3") + " pill font-semibold tracking-wide transition active:scale-[0.99] " + v}
          onClick=${onClick}
        >${children}</button>
      `;
    };

    const Segmented = ({value, onChange, items}) => html`
      <div class="tab-strip p-1 flex gap-1">
        ${items.map(it => html`
          <button
            class=${"px-3 py-2 text-sm rounded-full transition " + (value===it.value ? "tabActive font-semibold" : "tabBtn opacity-80")}
            onClick=${() => onChange(it.value)}
          >${it.label}</button>
        `)}
      </div>
    `;

    const Sidebar = ({route, setRoute, sidebarOpen, setSidebarOpen, auth, onLogout, authError}) => html`
      <aside class=${"sidebar " + (sidebarOpen ? "" : "is-collapsed")}>
        <div class="sidebar-header">
          <div class="flex items-center justify-between w-full">
            <div class="sidebar-title">
              <div class="clay-soft w-11 h-11 grid place-items-center">
                <img
                  src="https://lms.mooc.meca.in.th/static/sbs-themes/images/logo-adap-green-untext.1c98bf032947.png"
                  alt="App Logo"
                  class="w-8 h-8 object-contain"
                />
              </div>
              <span class="text-lg font-extrabold">VK LMS</span>
            </div>
            <button
              class="ghost w-9 h-9 rounded-full sidebar-toggle grid place-items-center"
              onClick=${() => setSidebarOpen(o => !o)}
              title="Toggle sidebar"
            >
              ${sidebarOpen ? "⟨" : "⟩"}
            </button>
          </div>
          <div class="sidebar-logos">
            <img
              src="https://lms.mooc.meca.in.th/static/sbs-themes/images/logo-nectec.4a797e97e6ed.png"
              alt="NECTEC"
              class="h-5 w-auto object-contain"
            />
            <img
              src="https://lms.mooc.meca.in.th/static/sbs-themes/images/logo-nstda.a0c679b2e45e.png"
              alt="NSTDA"
              class="h-5 w-auto object-contain"
            />
            <img
              src="https://lms.mooc.meca.in.th/static/sbs-themes/images/logo-mhesi.f3e5c05e5ebe.png"
              alt="MHESI"
              class="h-5 w-auto object-contain"
            />
          </div>
          <div class="text-xs text-slate-500 mono">build: UI-01 • ${new Date().toISOString().slice(0,10)}</div>
        </div>
        <div class="sidebar-nav grid gap-2">
          ${NAV.map(n => html`
            <button
              class=${"sidebar-btn " + (route===n.id ? "active" : "")}
              onClick=${() => {
                setRoute(n.id);
              }}
              title=${n.label}
            >
              <span class="sidebar-short">${n.short}</span>
              <span class="sidebar-label">${n.label}</span>
            </button>
          `)}
        </div>
        <div class="sidebar-footer">
          ${auth?.userId ? html`
            <${ClayButton} variant="danger" small onClick=${onLogout}>
              Logout
            </${ClayButton}>
          ` : html`
            <${ClayButton} variant="primary" small onClick=${startLogin}>
              Login
            </${ClayButton}>
          `}
          ${auth?.userId ? html`
            <div class="mt-3 panel p-3 text-xs">
              <div class="font-semibold text-slate-700">Logged in</div>
              <div class="mt-1 text-slate-600 mono break-all">user id: ${auth.userId}</div>
              <pre class="mt-2 text-[11px] text-slate-600 whitespace-pre-wrap break-all">${JSON.stringify(auth.profile || {}, null, 2)}</pre>
            </div>
          ` : null}
          ${authError ? html`
            <div class="mt-3 text-xs text-orange-600">${authError}</div>
          ` : null}
          <${ClayButton} variant="soft" small onClick=${() => alert("ตัวอย่าง UI เท่านั้น (ยังไม่ผูก backend)")}>
            ช่วยเหลือ
          </${ClayButton}>
        </div>
      </aside>

    const Analytics = () => {
      const barRef = useRef(null);
      const donutRef = useRef(null);
      const barWrapRef = useRef(null);
      const donutWrapRef = useRef(null);

      useEffect(() => {
        if (!barRef.current || !donutRef.current || !window.Chart) return;

        let barChart;
        let donutChart;
        let ro;
        let resizeHandler;

        const init = () => {
          const ctxBar = barRef.current.getContext("2d");
          const ctxDonut = donutRef.current.getContext("2d");

          barChart = new Chart(ctxBar, {
            type: "bar",
            data: {
              labels: ["unit 01", "unit 02", "unit 03", "unit 04", "unit 05"],
              datasets: [
                {
                  type: "bar",
                  label: "Learning speed",
                  data: [240, 410, 150, 320, 260],
                  backgroundColor: ["#f56a6a", "#f6b86a", "#a6d37a", "#5f76c8", "#c59cff"],
                  borderRadius: 10,
                },
                {
                  type: "line",
                  label: "Focus score",
                  data: [68, 72, 61, 78, 70],
                  borderColor: "#18a4aa",
                  backgroundColor: "rgba(24,164,170,.2)",
                  tension: 0.35,
                  fill: true,
                  yAxisID: "y1",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: {
                duration: 1200,
                easing: "easeOutQuart",
              },
              plugins: {
                legend: { display: true, labels: { boxWidth: 12, usePointStyle: true } },
                tooltip: { backgroundColor: "#0f6b72", padding: 10, cornerRadius: 8 },
              },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: "rgba(16,42,47,.08)" } },
                y1: {
                  beginAtZero: true,
                  position: "right",
                  grid: { drawOnChartArea: false },
                  ticks: { color: "#18a4aa" },
                },
              },
            },
          });

          donutChart = new Chart(ctxDonut, {
            type: "doughnut",
            data: {
              labels: ["เสร็จแล้ว", "กำลังทำ", "ยังไม่เริ่ม"],
              datasets: [
                {
                  data: [62, 24, 14],
                  backgroundColor: ["#1fb9b7", "#f6b86a", "#cfd8dd"],
                  hoverOffset: 6,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: "68%",
              animation: {
                animateRotate: true,
                duration: 1300,
                easing: "easeOutCubic",
              },
              plugins: {
                legend: { position: "bottom", labels: { boxWidth: 12, usePointStyle: true } },
                tooltip: { backgroundColor: "#0f6b72", padding: 10, cornerRadius: 8 },
              },
            },
          });

          resizeHandler = () => {
            if (barChart) barChart.resize();
            if (donutChart) donutChart.resize();
          };
          if (window.ResizeObserver) {
            ro = new ResizeObserver(resizeHandler);
            if (barWrapRef.current) ro.observe(barWrapRef.current);
            if (donutWrapRef.current) ro.observe(donutWrapRef.current);
          }
          window.addEventListener("orientationchange", resizeHandler);
          window.addEventListener("resize", resizeHandler);
        };

        const raf = requestAnimationFrame(init);

        return () => {
          cancelAnimationFrame(raf);
          if (ro) ro.disconnect();
          if (resizeHandler) {
            window.removeEventListener("orientationchange", resizeHandler);
            window.removeEventListener("resize", resizeHandler);
          }
          if (barChart) barChart.destroy();
          if (donutChart) donutChart.destroy();
        };
      }, []);

      `;
    };

    const Results = () => html`
      <div class="page-screen">
        <div class="page-scroll">
          <div class="clay p-5 sm:p-6">
        <div class="clay-soft p-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm text-slate-500">ผลการวิเคราะห์การเรียนรู้</div>
              <div class="text-2xl font-extrabold">student example</div>
              <div class="mt-2"><${CatPill} tone=${2}>ผลการเรียนรู้</${CatPill}></div>
            </div>
            <div class="chip px-4 py-2 rounded-full text-sm text-slate-600 mono">
              id: c5d44a6b-...-3144
            </div>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="clay-soft p-4 cat-card cat-2">
            <div class="font-bold">Learning Speed</div>
            <div class="mt-3">
              <${Bar} value=${mock.results.speed} label="Speed score" />
            </div>
            <div class="mt-3 panel p-4 text-sm text-slate-600">
              ตีความ: คะแนนความเร็วในการเรียนรู้ (mock) — ใช้แทน metric จริงได้
            </div>
          </div>

          <div class="clay-soft p-4 cat-card cat-3">
            <div class="font-bold">Learning Performance</div>
            <div class="mt-3">
              <${Bar} value=${mock.results.performance} label="Performance score" />
            </div>
            <div class="mt-3 panel p-4 text-sm text-slate-600">
              ตีความ: ผลสัมฤทธิ์รวม (mock) — เชื่อมกับคะแนน/ข้อสอบจริงภายหลัง
            </div>
          </div>
        </div>

        <div class="mt-4 clay-soft p-4 cat-card cat-4">
          <div class="font-bold">Notes</div>
          <textarea class="mt-3 w-full input-inset p-4 outline-none text-sm"
            rows="4"
            placeholder="จดบันทึกการวิเคราะห์ (demo)"></textarea>
          <div class="mt-3 flex justify-end">
            <${ClayButton} variant="soft" onClick=${() => alert("Saved (demo)")}>บันทึก</${ClayButton}>
          </div>
        </div>
          </div>
        </div>
      </div>
    `;

    const DataTable = () => {
      const rows = useMemo(() => ([
        { name:"student", role:"Student", unit:"unit 1", progress:74, updated:"2026-01-31" },
        { name:"staff01", role:"Staff", unit:"-", progress:100, updated:"2026-01-31" },
        { name:"student2", role:"Student", unit:"unit 2", progress:55, updated:"2026-01-30" },
      ]), []);
      const [q, setQ] = useState("");
      const filtered = rows.filter(r => (r.name+r.role+r.unit).toLowerCase().includes(q.toLowerCase()));
      return html`
        <div class="page-screen">
          <div class="page-scroll">
            <div class="clay p-5 sm:p-6">
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
            <div>
              <div class="text-2xl font-extrabold">ตารางรายการ (ปริมาณ/กิจกรรม)</div>
              <div class="mt-2"><${CatPill} tone=${3}>ตารางข้อมูล</${CatPill}></div>
              <div class="text-sm text-slate-500">ตัวอย่างตารางแบบ row-cards พร้อม toolbar</div>
            </div>
            <div class="input-inset p-1 flex items-center gap-1">
              <input class="bg-transparent px-3 py-2 outline-none text-sm w-64"
                     placeholder="ค้นหา..."
                     value=${q}
                     onInput=${(e)=>setQ(e.target.value)} />
              <${ClayButton} variant="soft" small onClick=${() => setQ("")}>ล้าง</${ClayButton}>
            </div>
          </div>

          <div class="mt-4 clay-soft p-4 cat-card cat-3">
            <div class="hidden md:grid grid-cols-[1.2fr_.8fr_.8fr_.6fr_.8fr_.6fr] gap-3 text-xs text-slate-500 px-2">
              <div>ชื่อ</div><div>บทบาท</div><div>หน่วย</div><div class="text-right">Progress</div><div>อัปเดต</div><div class="text-right">Action</div>
            </div>

            <div class="mt-3 grid gap-3">
              ${filtered.map(r => {
                const roleTone = r.role === "Staff" ? 4 : 3;
                const unitTone = r.unit === "-" ? 2 : 1;
                return html`
                  <div class="panel p-3">
                    <div class="grid md:grid-cols-[1.2fr_.8fr_.8fr_.6fr_.8fr_.6fr] gap-3 items-center">
                      <div class="font-semibold">${r.name}</div>
                      <div><${CatPill} tone=${roleTone}>${r.role}</${CatPill}></div>
                      <div><${CatPill} tone=${unitTone}>${r.unit}</${CatPill}></div>
                      <div class="text-right mono font-bold text-brand-soft">${r.progress}%</div>
                      <div class="text-sm text-slate-600 mono">${r.updated}</div>
                      <div class="flex md:justify-end gap-2">
                        <${ClayButton} variant="soft" small onClick=${() => alert("ดู: " + r.name)}>ดู</${ClayButton}>
                        <${ClayButton} variant="soft" small onClick=${() => alert("แก้ไข: " + r.name)}>แก้ไข</${ClayButton}>
                      </div>
                    </div>
                  </div>
                `;
              })}
              ${filtered.length===0 ? html`
                <div class="panel p-6 text-center text-slate-600">
                  ไม่พบข้อมูลที่ค้นหา
                </div>
              ` : null}
            </div>
          </div>
            </div>
          </div>
        </div>
      `;
    };

    function App(){
      const [route, setRoute] = useState("course");
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [auth, setAuth] = useState(() => readAuth());
      const [authError, setAuthError] = useState("");

      const goto = (r) => setRoute(r);

      useEffect(() => {
        const mq = window.matchMedia("(orientation: portrait)");
        const sync = () => setSidebarOpen(!mq.matches);
        sync();
        if (mq.addEventListener) mq.addEventListener("change", sync);
        else mq.addListener(sync);
        return () => {
          if (mq.removeEventListener) mq.removeEventListener("change", sync);
          else mq.removeListener(sync);
        };
      }, []);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const error = params.get("error");
        if (error) {
          setAuthError(`Login ไม่สำเร็จ: ${error}`);
          return;
        }
        if (!code) return;

        let cancelled = false;
        (async () => {
          try {
            const token = await exchangeCodeForToken(code);
            const claims = token.id_token ? decodeJwt(token.id_token) : null;
            const userinfo = token.access_token ? await fetchUserInfo(token.access_token) : null;
            const userId =
              (userinfo && (userinfo.sub || userinfo.preferred_username || userinfo.email)) ||
              (claims && (claims.sub || claims.preferred_username || claims.email)) ||
              "-";
            const authPayload = {
              userId,
              profile: userinfo || claims || {},
              token: {
                access_token: token.access_token,
                id_token: token.id_token,
                expires_in: token.expires_in,
              },
            };
            if (!cancelled) {
              setAuth(authPayload);
              storeAuth(authPayload);
            }
          } catch (e) {
            if (!cancelled) setAuthError(`Login ไม่สำเร็จ: ${e.message || "unknown error"}`);
          } finally {
            sessionStorage.removeItem("pkce_verifier");
            window.history.replaceState({}, document.title, OIDC.redirectUri);
          }
        })();

        return () => { cancelled = true; };
      }, []);

      const Page = () => {
        if(route==="course") return html`<${CourseOverview} goto=${goto} />`;
        if(route==="content") return html`<${ContentViewer} />`;
        if(route==="forum") return html`<${Forum} />`;
        if(route==="wiki") return html`<${Wiki} />`;
        if(route==="analytics") return html`<${Analytics} />`;
        if(route==="results") return html`<${Results} />`;
        if(route==="table") return html`<${DataTable} />`;
        return html`
          <div class="page-screen">
            <div class="page-scroll">
              <div class="clay p-6">Not found</div>
            </div>
          </div>
        `;
      };

      return html`
        <div class="app-frame">
          <div class="app-body">
            <${Layout}>
              <div class="app-shell">
                <${Sidebar}
                  route=${route}
                  setRoute=${setRoute}
                  sidebarOpen=${sidebarOpen}
                  setSidebarOpen=${setSidebarOpen}
                  auth=${auth}
                  authError=${authError}
                  onLogout=${() => { clearAuth(); setAuth(null); }}
                />
                <div class="app-main mt-4">
                  ${authError ? html`
                    <div class="clay-soft p-3 mb-3 text-xs text-orange-600">
                      ${authError}
                    </div>
                  ` : null}
                  ${auth?.userId ? html`
                    <div class="clay-soft p-3 mb-3 text-xs">
                      <div class="font-semibold text-slate-700">Login สำเร็จ</div>
                      <div class="mt-1 text-slate-600 mono break-all">user id: ${auth.userId}</div>
                      <pre class="mt-2 text-[11px] text-slate-600 whitespace-pre-wrap break-all">${JSON.stringify(auth.profile || {}, null, 2)}</pre>
                    </div>
                  ` : null}
                  <${Page} />
                </div>
              </div>
              <div class="text-center text-xs text-slate-500 py-4">
                Prototype UI • React UMD + htm + Tailwind CDN • Single HTML file
              </div>
            </${Layout}>
          </div>
          <${BottomNav} route=${route} setRoute=${setRoute} auth=${auth} onLogout=${() => { clearAuth(); setAuth(null); }} />
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
  </script>
</body>
</html>
