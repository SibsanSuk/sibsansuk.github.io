<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Leado API Lab</title>
  <style>
    :root{
      --bg:#f4f7f6;
      --surface:#ffffff;
      --soft:#eef5f3;
      --ink:#102326;
      --muted:#667579;
      --line:#dce6e4;
      --brand:#0f766e;
      --brand-2:#14b8a6;
      --blue:#2563eb;
      --amber:#b45309;
      --danger:#b42318;
      --shadow:0 18px 40px rgba(16,35,38,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Segoe UI",sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#f8fbfa,var(--bg));
      overflow:hidden;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .app{
      height:100dvh;
      padding:14px;
      display:grid;
      grid-template-rows:auto 1fr;
      gap:12px;
    }
    .topbar{
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.92);
      box-shadow:0 8px 20px rgba(16,35,38,.07);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .mark{
      width:42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      color:#fff;
      background:linear-gradient(135deg,var(--brand),var(--blue));
      font-weight:800;
      letter-spacing:.5px;
      flex:0 0 auto;
    }
    h1{
      font-size:20px;
      line-height:1.15;
      margin:0;
      letter-spacing:0;
    }
    .subtitle{
      margin-top:3px;
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:70vw;
    }
    .controls{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .date-range{
      display:flex;
      align-items:center;
      gap:6px;
      padding:6px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--soft);
    }
    input[type="date"], .search-input{
      border:1px solid var(--line);
      background:#fff;
      border-radius:10px;
      min-height:38px;
      padding:8px 10px;
      color:var(--ink);
      outline:none;
    }
    input:focus{
      border-color:rgba(20,184,166,.72);
      box-shadow:0 0 0 4px rgba(20,184,166,.14);
    }
    .btn{
      min-height:38px;
      border:1px solid transparent;
      border-radius:11px;
      padding:8px 12px;
      background:var(--ink);
      color:#fff;
      font-weight:700;
    }
    .btn.secondary{
      background:#fff;
      color:var(--ink);
      border-color:var(--line);
    }
    .btn:disabled{
      opacity:.58;
      cursor:not-allowed;
    }
    .layout{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(340px,430px) minmax(0,1fr);
      gap:12px;
    }
    .panel{
      min-height:0;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .chat{
      display:grid;
      grid-template-rows:auto 1fr auto;
    }
    .panel-head{
      padding:14px;
      border-bottom:1px solid var(--line);
      background:#fbfdfd;
    }
    .status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:var(--muted);
      font-size:13px;
    }
    .dot{
      width:9px;
      height:9px;
      border-radius:99px;
      background:var(--amber);
      display:inline-block;
      margin-right:7px;
    }
    .dot.ready{background:var(--brand-2)}
    .dot.error{background:var(--danger)}
    .messages{
      min-height:0;
      overflow:auto;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .bubble{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 13px;
      background:#fff;
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
    }
    .bubble.user{
      background:#102326;
      color:#fff;
      align-self:flex-end;
      max-width:88%;
      border-color:#102326;
    }
    .bubble.answer{
      background:#f7fbfa;
      max-width:100%;
    }
    .evidence{
      display:grid;
      gap:8px;
      margin-top:10px;
    }
    .evidence-item{
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      padding:9px 10px;
      color:var(--muted);
      font-size:13px;
    }
    .composer{
      padding:12px;
      border-top:1px solid var(--line);
      background:#fbfdfd;
      display:grid;
      gap:8px;
    }
    .quick{
      display:flex;
      gap:7px;
      overflow:auto;
      padding-bottom:2px;
    }
    .chip{
      white-space:nowrap;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      font-weight:700;
    }
    .ask-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
    }
    .search-input{
      width:100%;
      min-height:44px;
      border-radius:13px;
    }
    .dashboard{
      min-height:0;
      display:grid;
      grid-template-rows:auto 1fr;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      padding:14px;
      border-bottom:1px solid var(--line);
      background:#fbfdfd;
    }
    .stat{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:12px;
      min-width:0;
    }
    .stat-label{
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .stat-value{
      margin-top:6px;
      font-size:24px;
      line-height:1;
      font-weight:850;
      font-variant-numeric:tabular-nums;
    }
    .data-scroll{
      min-height:0;
      overflow:auto;
      padding:14px;
      display:grid;
      grid-template-columns:1fr 1fr;
      align-content:start;
      gap:12px;
    }
    .section{
      border:1px solid var(--line);
      border-radius:15px;
      overflow:hidden;
      background:#fff;
    }
    .section.wide{grid-column:1/-1}
    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 13px;
      border-bottom:1px solid var(--line);
      background:#f8fbfa;
      font-weight:800;
    }
    .rows{
      display:grid;
    }
    .row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      padding:10px 13px;
      border-bottom:1px solid #eef3f2;
      align-items:center;
      min-width:0;
    }
    .row:last-child{border-bottom:0}
    .row-main{
      min-width:0;
      overflow:hidden;
    }
    .row-title{
      font-weight:750;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .row-sub{
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .row-value{
      font-weight:850;
      font-variant-numeric:tabular-nums;
      color:var(--brand);
    }
    .empty{
      padding:16px;
      color:var(--muted);
      font-size:14px;
    }
    @media (max-width:980px){
      body{overflow:auto}
      .app{height:auto;min-height:100dvh}
      .layout{grid-template-columns:1fr}
      .chat{min-height:620px}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      .data-scroll{grid-template-columns:1fr}
      .section.wide{grid-column:auto}
      .topbar{align-items:flex-start;flex-direction:column}
      .controls{justify-content:flex-start}
    }
    @media (max-width:560px){
      .app{padding:8px}
      .date-range{width:100%;display:grid;grid-template-columns:1fr 1fr}
      .date-range span{display:none}
      input[type="date"]{width:100%}
      .controls,.btn.secondary{width:100%}
      .btn{width:100%}
      .stats{grid-template-columns:1fr}
      .ask-row{grid-template-columns:1fr}
      .subtitle{white-space:normal;max-width:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">L</div>
        <div>
          <h1>Leado API Lab</h1>
          <div class="subtitle" id="endpoint-label">kidbright/enroll/query</div>
        </div>
      </div>
      <div class="controls">
        <div class="date-range">
          <input id="from-date" type="date" value="2026-06-03" aria-label="เริ่มต้น" />
          <span>ถึง</span>
          <input id="to-date" type="date" value="2026-07-03" aria-label="สิ้นสุด" />
        </div>
        <button class="btn secondary" id="reload-btn" type="button">โหลดข้อมูล</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel chat" aria-label="Leado chat">
        <div class="panel-head">
          <div class="status">
            <div><span class="dot" id="status-dot"></span><span id="status-text">ยังไม่ได้โหลดข้อมูล</span></div>
            <div id="updated-text">-</div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <form class="composer" id="ask-form">
          <div class="quick" id="quick-actions">
            <button class="chip" type="button" data-question="มีผู้ใช้ทั้งหมดกี่คน">ยอดรวม</button>
            <button class="chip" type="button" data-question="จังหวัดไหนมีผู้ใช้มากที่สุด">จังหวัดสูงสุด</button>
            <button class="chip" type="button" data-question="โรงเรียนไหนมีผู้ใช้มากที่สุด">โรงเรียนสูงสุด</button>
            <button class="chip" type="button" data-question="วิชาไหนมีผู้ใช้มากที่สุด">วิชายอดนิยม</button>
            <button class="chip" type="button" data-question="กรุงเทพมหานครมีผู้ใช้กี่คน">กรุงเทพมหานคร</button>
          </div>
          <div class="ask-row">
            <input class="search-input" id="question-input" type="text" autocomplete="off" placeholder="ถามข้อมูลจาก API..." />
            <button class="btn" id="ask-btn" type="submit">ถาม</button>
          </div>
        </form>
      </section>

      <section class="panel dashboard" aria-label="API summary">
        <div class="stats">
          <div class="stat">
            <div class="stat-label">ผู้ใช้</div>
            <div class="stat-value" id="stat-users">-</div>
          </div>
          <div class="stat">
            <div class="stat-label">สถาบัน</div>
            <div class="stat-value" id="stat-institutes">-</div>
          </div>
          <div class="stat">
            <div class="stat-label">จังหวัด</div>
            <div class="stat-value" id="stat-provinces">-</div>
          </div>
          <div class="stat">
            <div class="stat-label">วิชา</div>
            <div class="stat-value" id="stat-courses">-</div>
          </div>
        </div>
        <div class="data-scroll">
          <div class="section">
            <div class="section-title">จังหวัดสูงสุด <span id="province-count">-</span></div>
            <div class="rows" id="province-list"><div class="empty">รอข้อมูล</div></div>
          </div>
          <div class="section">
            <div class="section-title">สถาบันสูงสุด <span id="institute-count">-</span></div>
            <div class="rows" id="institute-list"><div class="empty">รอข้อมูล</div></div>
          </div>
          <div class="section wide">
            <div class="section-title">วิชายอดนิยม <span id="course-count">-</span></div>
            <div class="rows" id="course-list"><div class="empty">รอข้อมูล</div></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./leado.js?v=20260710-1"></script>
</body>
</html>
