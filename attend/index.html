<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Camera + Location Check</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 12px; box-sizing: border-box; }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .pill { padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(127,127,127,.35); font-size: 14px; }
    .status { font-weight: 700; }
    .stage {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      min-height: 55vh;
      border: 8px solid #b00020; /* default red */
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* front cam feel; remove if you prefer */
    }
    .overlay {
      position: absolute; inset: 0;
      pointer-events: none;
      display: grid;
      place-items: end center;
      padding: 12px;
      box-sizing: border-box;
      background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 55%);
    }
    .card {
      width: min(720px, 100%);
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 14px;
      line-height: 1.35;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .row > div { opacity: .95; }
    .muted { opacity: .8; }
    button {
      border: 1px solid rgba(127,127,127,.4);
      background: rgba(127,127,127,.12);
      color: inherit;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: rgba(127,127,127,.18); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    footer { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
    .small { font-size: 12px; opacity: .8; }
    input[type="number"],
    input[type="text"]{
      width: 90px; padding: 8px 10px; border-radius: 10px;
      border: 1px solid rgba(127,127,127,.35);
      background: rgba(127,127,127,.10); color: inherit;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="pill status" id="statusText">กำลังเริ่มต้น…</div>
      <div class="pill">เป้าหมาย: ม.เกษตรฯ กำแพงแสน</div>
      <div class="pill">
        รัศมี (เมตร):
        <input id="radiusM" type="number" min="10" step="10" value="200" />
      </div>
    </header>
    <div class="pill" style="display:flex; flex-wrap:wrap; gap:10px; align-items:center">
      <label>รหัสนิสิต <input id="studentId" type="text" inputmode="numeric" placeholder="เช่น 66123456" /></label>
      <label>ชื่อ <input id="firstName" type="text" placeholder="ชื่อจริง" /></label>
      <label>สกุล <input id="lastName" type="text" placeholder="นามสกุล" /></label>
      <label>ชื่อเล่น <input id="nickname" type="text" placeholder="เช่น มิกซ์" /></label>
    </div>

    <div class="stage" id="stage">
      <video id="video" playsinline autoplay muted></video>
      <div class="overlay">
        <div class="card">
          <div class="row">
            <div>Lat: <span id="lat" class="muted">-</span></div>
            <div>Lng: <span id="lng" class="muted">-</span></div>
            <div>Accuracy: <span id="acc" class="muted">-</span></div>
          </div>
          <div class="row" style="margin-top:6px">
            <div>Distance: <span id="dist" class="muted">-</span></div>
            <div>Target: <span class="muted" id="targetText">-</span></div>
          </div>
          <div class="row" style="margin-top:6px">
            <div>รหัสนิสิต: <span id="showStudentId" class="muted">-</span></div>
            <div>ชื่อ: <span id="showFirstName" class="muted">-</span></div>
            <div>สกุล: <span id="showLastName" class="muted">-</span></div>
            <div>ชื่อเล่น: <span id="showNickname" class="muted">-</span></div>
          </div>
          <div class="small" style="margin-top:8px" id="hint">
            หมายเหตุ: ต้องเปิดผ่าน HTTPS (หรือ localhost) และอนุญาต “กล้อง” + “ตำแหน่ง”
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="small">
        ถ้าตำแหน่ง “สวิง” ลองออกไปโล่งๆ / เปิด GPS / ใช้มือถือแทนเดสก์ท็อป
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button id="toggleCam">สลับกล้อง (หลัง)</button>
        <button id="retryCam">ขอกล้องใหม่</button>
        <button id="retryLoc">ขอตำแหน่งใหม่</button>
      </div>
    </footer>
  </div>

<script>
(() => {
  // ====== ตั้งค่าเป้าหมาย (จากลิงก์ที่คุณให้) ======
  const TARGET = { lat: 14.021499, lng: 99.9758568 };

  const el = (id) => document.getElementById(id);
  const stage = el("stage");
  const statusText = el("statusText");
  const video = el("video");

  const latEl = el("lat");
  const lngEl = el("lng");
  const accEl = el("acc");
  const distEl = el("dist");
  const targetText = el("targetText");
  const radiusInput = el("radiusM");
  const hint = el("hint");

  const studentIdInput = el("studentId");
  const firstNameInput = el("firstName");
  const lastNameInput = el("lastName");
  const nicknameInput = el("nickname");
  const showStudentId = el("showStudentId");
  const showFirstName = el("showFirstName");
  const showLastName = el("showLastName");
  const showNickname = el("showNickname");

  const btnToggleCam = el("toggleCam");
  const btnRetryCam  = el("retryCam");
  const btnRetryLoc  = el("retryLoc");

  targetText.textContent = `${TARGET.lat.toFixed(6)}, ${TARGET.lng.toFixed(6)}`;

  let watchId = null;
  let stream = null;

  const supportsFacing = !!navigator.mediaDevices?.getSupportedConstraints?.().facingMode;

  // กล้องเริ่มต้น: หลัง (environment)
  let desiredFacing = "environment"; // "user" หรือ "environment"
  let currentFacing = "environment";
  let deviceId = null; // ถ้าระบุ จะบังคับใช้ตัวนั้น
  const preferredByFacing = { user: null, environment: null };

  function setBorder(ok) {
    stage.style.borderColor = ok ? "#00c853" : "#b00020";
    statusText.textContent = ok ? "อยู่ในพื้นที่ ✅ (กรอบเขียว)" : "อยู่นอกพื้นที่ ❌ (กรอบแดง)";
  }
  function setStatus(msg) { statusText.textContent = msg; }

  // Haversine distance (meters)
  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = (d) => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  async function listVideoInputs() {
    // ต้องได้ permission ก่อน enumerateDevices จะเห็น label ชัด
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d => d.kind === "videoinput");
  }

  function guessFacingFromLabel(label) {
    if (!label) return null;
    const text = label.toLowerCase();
    if (text.includes("front") || text.includes("user") || text.includes("facetime")) return "user";
    if (text.includes("back") || text.includes("rear") || text.includes("environment")) return "environment";
    return null;
  }

  function pickDeviceIdForFacing(inputs, facing) {
    const wanted = facing === "user"
      ? ["front", "user", "facetime"]
      : ["back", "rear", "environment"];
    const found = inputs.find(d => {
      const label = (d.label || "").toLowerCase();
      return wanted.some(k => label.includes(k));
    });
    return found?.deviceId || null;
  }

  function getFacingFromTrack(track, fallback) {
    const settings = track?.getSettings?.() || {};
    if (settings.facingMode === "user" || settings.facingMode === "environment") {
      return settings.facingMode;
    }
    const guess = guessFacingFromLabel(track?.label || "");
    return guess || fallback;
  }

  async function startCamera(nextFacing = desiredFacing) {
    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("เบราว์เซอร์นี้ไม่รองรับกล้อง");
        return;
      }
      desiredFacing = nextFacing;
      btnToggleCam.disabled = true;

      // ปิดกล้องเก่าถ้ามี
      if (stream) stream.getTracks().forEach(t => t.stop());

      // constraint: ถ้ามี deviceId ให้ใช้, ไม่งั้นใช้ facingMode
      let constraints = { audio: false, video: {} };
      if (deviceId) {
        constraints.video = { deviceId: { exact: deviceId } };
      } else if (supportsFacing) {
        constraints.video = { facingMode: { exact: desiredFacing } };
      } else {
        constraints.video = { facingMode: { ideal: desiredFacing } };
      }

      let nextStream;
      try {
        nextStream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        // บางเครื่องไม่ยอมรับ exact → fallback เป็น ideal
        if (!deviceId && supportsFacing && constraints.video.facingMode?.exact) {
          nextStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: desiredFacing } }
          });
        } else {
          throw err;
        }
      }

      stream = nextStream;
      video.srcObject = stream;
      await video.play().catch(() => {});

      // ให้ภาพ mirror เฉพาะกล้องหน้า (user)
      // (ถ้า browser บางตัวไม่ honor facingMode, จะลองเดาจาก device label)
      const track = stream.getVideoTracks()[0];
      const settings = track?.getSettings?.() || {};
      const actualFacing = getFacingFromTrack(track, desiredFacing);
      currentFacing = actualFacing;

      if (settings.deviceId) {
        preferredByFacing[actualFacing] = settings.deviceId;
      } else if (track?.label) {
        try {
          const inputs = await listVideoInputs();
          const match = inputs.find(d => d.label === track.label);
          if (match?.deviceId) preferredByFacing[actualFacing] = match.deviceId;
        } catch {}
      }

      video.style.transform = actualFacing === "user" ? "scaleX(-1)" : "none";

      hint.textContent = `กล้องทำงานแล้ว ✅ (โหมด: ${actualFacing === "user" ? "หน้า" : "หลัง"}) กำลังตรวจตำแหน่ง…`;

      // เปิดปุ่มสลับกล้อง ถ้ามีมากกว่า 1 ตัว
      try {
        const inputs = await listVideoInputs();
        btnToggleCam.disabled = inputs.length < 2;
      } catch {
        btnToggleCam.disabled = false; // ถ้าดูไม่ได้ ก็ให้ลองกดได้
      }

      // อัปเดตข้อความบนปุ่ม
      btnToggleCam.textContent = `สลับกล้อง (${actualFacing === "user" ? "หน้า" : "หลัง"})`;

    } catch (err) {
      console.error(err);
      setStatus("ขอกล้องไม่สำเร็จ (อนุญาตกล้อง/HTTPS?)");
      hint.textContent = "แก้ไข: เปิดผ่าน HTTPS, กดอนุญาตกล้อง, หรือเช็ค Settings ของเบราว์เซอร์";
      btnToggleCam.disabled = false;
    }
  }

  function stopLocationWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  function startLocation() {
    if (!navigator.geolocation) {
      setStatus("เบราว์เซอร์นี้ไม่รองรับตำแหน่ง (Geolocation)");
      return;
    }
    if (
      location.protocol !== "https:" &&
      location.hostname !== "localhost" &&
      location.hostname !== "127.0.0.1"
    ) {
      setStatus("ต้องเปิดผ่าน HTTPS เพื่อใช้ตำแหน่ง");
      hint.textContent = "iOS จะไม่อนุญาตตำแหน่งบน HTTP ให้เปิดผ่าน HTTPS เท่านั้น";
      stage.style.borderColor = "#b00020";
      return;
    }

    stopLocationWatch();
    setStatus("กำลังขอตำแหน่ง…");

    const highOptions = { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 };
    const lowOptions = { enableHighAccuracy: false, maximumAge: 10000, timeout: 15000 };

    const handlePosition = (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;

      latEl.textContent = latitude.toFixed(6);
      lngEl.textContent = longitude.toFixed(6);
      accEl.textContent = `${Math.round(accuracy)} m`;

      const d = distanceMeters(latitude, longitude, TARGET.lat, TARGET.lng);
      distEl.textContent = `${Math.round(d)} m`;

      const radius = Math.max(10, Number(radiusInput.value) || 200);
      setBorder(d <= radius);

      hint.textContent = (accuracy > 80)
        ? "ตำแหน่งยังไม่ค่อยแม่น (accuracy สูง) ลองออกไปที่โล่ง/เปิด GPS"
        : "ตำแหน่งอัปเดตแบบเรียลไทม์ ✅";
    };

    const handleError = (err) => {
      console.error(err);
      let msg = "ขอตำแหน่งไม่สำเร็จ";
      if (err?.code === 1) msg = "ถูกปฏิเสธการขอตำแหน่ง";
      if (err?.code === 2) msg = "หาตำแหน่งไม่พบ";
      if (err?.code === 3) msg = "ขอตำแหน่งนานเกินไป";
      setStatus(`${msg} (อนุญาตตำแหน่ง/HTTPS?)`);
      hint.textContent = "iOS: ไปที่ Settings > Privacy & Security > Location Services และ Settings > Safari > Location แล้วรีเฟรช";
      stage.style.borderColor = "#b00020";
    };

    const startWatch = (options) => {
      stopLocationWatch();
      watchId = navigator.geolocation.watchPosition(handlePosition, handleError, options);
    };

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        handlePosition(pos);
        startWatch(highOptions);
      },
      (err) => {
        if (err?.code === 3) {
          navigator.geolocation.getCurrentPosition(handlePosition, handleError, lowOptions);
          startWatch(lowOptions);
          return;
        }
        handleError(err);
      },
      highOptions
    );
  }

  // ====== สลับกล้อง หน้า/หลัง ======
  async function toggleCamera() {
    const nextFacing = (currentFacing === "user") ? "environment" : "user";
    deviceId = preferredByFacing[nextFacing];

    try {
      try {
        const inputs = await listVideoInputs();
        const picked = pickDeviceIdForFacing(inputs, nextFacing);
        if (picked) deviceId = picked;
      } catch {}

      await startCamera(nextFacing);
    } catch (e) {
      console.error(e);
      // ถ้าล้มเหลว ให้ลอง enumerate แล้วสลับ deviceId ตรงๆ
      try {
        const inputs = await listVideoInputs();
        if (inputs.length >= 2) {
          const current = stream?.getVideoTracks?.()[0]?.getSettings?.().deviceId;
          const idx = inputs.findIndex(d => d.deviceId === current);
          const next = inputs[(idx + 1) % inputs.length];
          if (next?.deviceId) {
            deviceId = next.deviceId;
            await startCamera(nextFacing);
          }
        }
      } catch {}
    }
  }

  // ปุ่มต่าง ๆ
  btnToggleCam.addEventListener("click", toggleCamera);
  btnRetryCam.addEventListener("click", () => startCamera());
  btnRetryLoc.addEventListener("click", () => startLocation());

  radiusInput.addEventListener("input", () => {
    const distText = distEl.textContent;
    const d = Number((distText.match(/\d+/) || [])[0]);
    if (Number.isFinite(d)) {
      const radius = Math.max(10, Number(radiusInput.value) || 200);
      setBorder(d <= radius);
    }
  });

  function syncStudentInfo() {
    showStudentId.textContent = studentIdInput.value.trim() || "-";
    showFirstName.textContent = firstNameInput.value.trim() || "-";
    showLastName.textContent = lastNameInput.value.trim() || "-";
    showNickname.textContent = nicknameInput.value.trim() || "-";
  }
  [studentIdInput, firstNameInput, lastNameInput, nicknameInput].forEach((input) => {
    input.addEventListener("input", syncStudentInfo);
  });
  syncStudentInfo();

  // เริ่มทำงานทันทีเมื่อเปิดหน้า
  (async () => {
    // iOS บางทีต้องกดปุ่มถึงจะเริ่มกล้องได้ → ถ้าโดนบล็อกกด "ขอกล้องใหม่"
    await startCamera();
    startLocation();
  })();

  window.addEventListener("beforeunload", () => {
    stopLocationWatch();
    if (stream) stream.getTracks().forEach(t => t.stop());
  });
})();
</script>
</body>
</html>
