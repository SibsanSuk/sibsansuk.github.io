<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>ประกาศนียบัตรเส้นทางการสอน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --brand: #0f766e;
      --brand-light: #14b8a6;
      --gold: #d99a24;
      --ink: #182230;
      --muted: #667085;
      --line: #e4e7ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(20,184,166,.15), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(245,158,11,.12), transparent 28%),
        #f5f7fa;
      font-family: "Noto Sans Thai", Inter, system-ui, sans-serif;
    }
    button, a { font: inherit; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px max(20px, calc((100vw - 1120px) / 2));
      border-bottom: 1px solid rgba(228,231,236,.9);
      background: rgba(255,255,255,.88);
      box-shadow: 0 6px 24px rgba(16,24,40,.06);
      backdrop-filter: blur(14px);
    }
    .toolbar a, .toolbar button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      border-radius: 12px;
      padding: 9px 14px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .back { color: #475467; border: 1px solid var(--line); background: white; }
    .print { color: white; border: 0; background: var(--brand); box-shadow: 0 8px 20px rgba(15,118,110,.2); }
    main { width: min(1120px, calc(100% - 32px)); margin: 28px auto 56px; }
    .certificate {
      position: relative;
      isolation: isolate;
      min-height: 610px;
      overflow: hidden;
      padding: 14px;
      border-radius: 28px;
      background: linear-gradient(135deg, #b7791f, #f9d779 35%, #b7791f 68%, #ffe6a3);
      box-shadow: 0 28px 70px rgba(16,24,40,.16);
    }
    .certificate-paper {
      position: relative;
      display: flex;
      min-height: 582px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 64px 72px;
      border: 1px solid rgba(185,121,31,.45);
      border-radius: 18px;
      text-align: center;
      background:
        linear-gradient(rgba(255,255,255,.94), rgba(255,255,255,.94)),
        repeating-linear-gradient(45deg, #faf3df 0, #faf3df 2px, #fff 2px, #fff 8px);
    }
    .certificate-paper::before, .certificate-paper::after {
      position: absolute;
      width: 250px;
      height: 250px;
      content: "";
    }
    .certificate-paper::before {
      left: -70px;
      top: -72px;
      width: 300px;
      height: 300px;
      opacity: .07;
      background: url("https://lms.mooc.meca.in.th/static/sbs-themes/images/logo-adap-green-untext.1c98bf032947.png") center / contain no-repeat;
    }
    .certificate-paper::after {
      right: -120px;
      bottom: -130px;
      border: 44px solid rgba(13,148,136,.06);
      border-radius: 50%;
    }
    .certificate-kicker { color: var(--gold); font: 800 12px/1 Inter, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
    .certificate-title { margin: 13px 0 0; color: var(--brand); font-size: clamp(28px, 4vw, 46px); line-height: 1.15; font-weight: 800; }
    .presented { margin-top: 28px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .teacher-name {
      min-width: min(600px, 90%);
      margin: 8px 0 0;
      padding: 0 22px 11px;
      border-bottom: 1px solid rgba(185,121,31,.5);
      color: #101828;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.3;
      font-weight: 800;
    }
    .recognition { max-width: 690px; margin: 18px auto 0; color: #667085; font-size: 14px; line-height: 1.8; }
    .level-name { margin-top: 8px; color: var(--brand); font-size: 24px; font-weight: 800; }
    .seal {
      display: flex;
      width: 92px;
      height: 92px;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      border: 5px double #f8d37a;
      border-radius: 50%;
      color: white;
      background: linear-gradient(145deg, #fbbf24, #c87913);
      box-shadow: 0 8px 22px rgba(185,121,31,.28), inset 0 0 0 4px rgba(255,255,255,.22);
      font: 800 13px/1.2 Inter, sans-serif;
      text-align: center;
      white-space: pre-line;
    }
    .certificate-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; margin-top: 18px; color: #667085; font-size: 11px; font-weight: 600; }
    .locked {
      display: grid;
      min-height: 320px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      background: white;
      box-shadow: 0 18px 50px rgba(16,24,40,.08);
    }
    .locked-icon { display: grid; width: 72px; height: 72px; margin: auto; place-items: center; border-radius: 22px; color: var(--brand); background: #e6fffb; font-size: 34px; }
    .locked h1 { margin: 18px 0 6px; font-size: 26px; }
    .locked p { margin: 0; color: var(--muted); }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
    .panel { border: 1px solid var(--line); border-radius: 20px; padding: 22px; background: rgba(255,255,255,.94); box-shadow: 0 10px 30px rgba(16,24,40,.06); }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .panel h2 { margin: 0; font-size: 18px; }
    .panel-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .level-chip { flex: none; border-radius: 999px; padding: 6px 10px; color: var(--brand); background: #e6fffb; font: 800 11px/1 Inter, sans-serif; }
    .criterion { padding: 13px 0; border-top: 1px solid #f0f2f5; }
    .criterion:first-child { padding-top: 0; border-top: 0; }
    .criterion-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .criterion-label { display: flex; min-width: 0; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; }
    .check { display: grid; width: 23px; height: 23px; flex: none; place-items: center; border-radius: 50%; font: 800 12px/1 Inter, sans-serif; }
    .check.met { color: white; background: #12b76a; }
    .check.pending { color: #b54708; background: #fef0c7; }
    .criterion-value { flex: none; color: #475467; font: 800 12px/1 Inter, sans-serif; }
    .track { height: 7px; overflow: hidden; margin: 9px 0 0 32px; border-radius: 99px; background: #f2f4f7; }
    .track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #14b8a6, #0f766e); }
    .roadmap { margin-top: 18px; }
    .roadmap-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 17px; }
    .roadmap-level { position: relative; min-height: 118px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: #fafafa; }
    .roadmap-level.unlocked { border-color: #99e7dc; background: #f0fdfa; }
    .roadmap-number { color: var(--brand); font: 800 11px/1 Inter, sans-serif; }
    .roadmap-name { margin-top: 7px; font-size: 12px; line-height: 1.5; font-weight: 800; }
    .roadmap-requirement { margin-top: 8px; color: var(--muted); font-size: 9px; line-height: 1.6; }
    .empty { display: grid; min-height: 70vh; place-items: center; text-align: center; }
    .empty-card { max-width: 520px; padding: 36px; border: 1px solid var(--line); border-radius: 22px; background: white; box-shadow: 0 18px 50px rgba(16,24,40,.08); }
    .empty h1 { margin: 0 0 8px; font-size: 24px; }
    .empty p { margin: 0 0 20px; color: var(--muted); }
    .empty a { display: inline-flex; border-radius: 12px; padding: 10px 16px; color: white; text-decoration: none; font-weight: 800; background: var(--brand); }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .toolbar { padding: 12px 16px; }
      main { width: min(100% - 20px, 1120px); margin-top: 16px; }
      .certificate { min-height: 560px; padding: 8px; border-radius: 20px; }
      .certificate-paper { min-height: 544px; padding: 44px 18px; border-radius: 14px; }
      .details { grid-template-columns: 1fr; }
      .roadmap-grid { grid-template-columns: 1fr; }
      .roadmap-level { min-height: auto; }
      .toolbar .label-optional { display: none; }
    }
    @media print {
      @page { size: A4 landscape; margin: 9mm; }
      body { background: white; }
      .toolbar, .details, .roadmap, .locked { display: none !important; }
      main { width: 100%; margin: 0; }
      .certificate { min-height: 185mm; padding: 8px; border-radius: 0; box-shadow: none; }
      .certificate-paper { min-height: calc(185mm - 16px); padding: 30px 60px; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header class="toolbar" id="toolbar" hidden>
    <a class="back" href="./"><span aria-hidden="true">←</span><span id="backLabel">กลับ Teacher Dashboard</span></a>
    <button class="print" id="printButton" type="button"><span aria-hidden="true">⤓</span><span id="printLabel">พิมพ์ / บันทึก PDF</span></button>
  </header>

  <main id="content" hidden>
    <section class="certificate" id="certificate">
      <div class="certificate-paper">
        <div class="certificate-kicker">Certificate of Achievement</div>
        <h1 class="certificate-title" id="certificateTitle">ประกาศนียบัตร</h1>
        <div class="presented" id="presentedLabel">ขอมอบให้แก่</div>
        <div class="teacher-name" id="teacherName"></div>
        <p class="recognition" id="recognition"></p>
        <div class="level-name" id="levelName"></div>
        <div class="seal" id="levelSeal"></div>
        <div class="certificate-meta"><span id="schoolName"></span><span id="issuedDate"></span></div>
      </div>
    </section>

    <section class="locked" id="locked" hidden>
      <div>
        <div class="locked-icon">🔒</div>
        <h1 id="lockedTitle"></h1>
        <p id="lockedDescription"></p>
      </div>
    </section>

    <div class="details">
      <section class="panel" id="earnedPanel">
        <div class="panel-head">
          <div><h2 id="earnedTitle"></h2><p class="panel-subtitle" id="earnedSubtitle"></p></div>
          <span class="level-chip" id="earnedLevel"></span>
        </div>
        <div id="earnedCriteria"></div>
      </section>
      <section class="panel" id="nextPanel">
        <div class="panel-head">
          <div><h2 id="nextTitle"></h2><p class="panel-subtitle" id="nextSubtitle"></p></div>
          <span class="level-chip" id="nextLevel"></span>
        </div>
        <div id="nextCriteria"></div>
      </section>
    </div>

    <section class="panel roadmap">
      <div class="panel-head"><div><h2 id="roadmapTitle"></h2><p class="panel-subtitle" id="roadmapSubtitle"></p></div></div>
      <div class="roadmap-grid" id="roadmapGrid"></div>
    </section>
  </main>

  <section class="empty" id="empty" hidden>
    <div class="empty-card">
      <h1 id="emptyTitle">ไม่พบข้อมูลประกาศนียบัตร</h1>
      <p id="emptyDescription">กรุณาเปิดหน้านี้จาก Teacher Dashboard</p>
      <a href="./" id="emptyBack">กลับ Teacher Dashboard</a>
    </div>
  </section>

  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "teacher_dashboard_certificate";
      const SESSION_KEY = "teacher_dashboard_certificate_session";
      const copy = {
        th: {
          title: "ประกาศนียบัตรเส้นทางการสอน",
          back: "กลับ Teacher Dashboard",
          print: "พิมพ์ / บันทึก PDF",
          certificateTitle: "ประกาศนียบัตร",
          presented: "ขอมอบให้แก่",
          teacherFallback: "คุณครู",
          recognition: "เพื่อรับรองความมุ่งมั่นในการสร้างพื้นที่การเรียนรู้ ดูแลผู้เรียน และนำเทคโนโลยีไปใช้ในการสอน จนผ่านเกณฑ์",
          issued: "ออกให้เมื่อ",
          school: "สถานศึกษา",
          lockedTitle: "ประกาศนียบัตรยังไม่ถูกปลดล็อก",
          lockedDescription: "ทำเกณฑ์ Level 1 ให้ครบ แล้วกลับมาเปิดประกาศนียบัตรอีกครั้ง",
          earnedTitle: "เหตุผลที่คุณได้รับระดับนี้",
          earnedSubtitle: "คุณผ่านเกณฑ์ของระดับปัจจุบันครบทั้งหมด",
          nextTitle: "เกณฑ์ของขั้นถัดไป",
          nextSubtitle: "ติดตามสิ่งที่ทำสำเร็จแล้วและสิ่งที่ยังเหลือ",
          allComplete: "คุณปลดล็อกครบทุกระดับแล้ว",
          roadmapTitle: "เส้นทาง Level ทั้งหมด",
          roadmapSubtitle: "แต่ละระดับใช้เกณฑ์สะสมจากหลักสูตร ห้องเรียน และนักเรียน",
          noCurrent: "ยังไม่มีเกณฑ์ระดับที่ปลดล็อก",
          emptyTitle: "ไม่พบข้อมูลประกาศนียบัตร",
          emptyDescription: "กรุณาเปิดหน้านี้จาก Teacher Dashboard",
          current: "ปัจจุบัน",
          target: "เป้าหมาย",
          passed: "ผ่านแล้ว"
        },
        en: {
          title: "Teaching Journey Certificate",
          back: "Back to Teacher Dashboard",
          print: "Print / Save PDF",
          certificateTitle: "Certificate of Achievement",
          presented: "Presented to",
          teacherFallback: "Teacher",
          recognition: "In recognition of your dedication to creating learning spaces, supporting learners, and using technology in teaching, meeting all criteria for",
          issued: "Issued on",
          school: "School",
          lockedTitle: "Certificate not unlocked yet",
          lockedDescription: "Complete all Level 1 criteria, then return to unlock your certificate.",
          earnedTitle: "Why you earned this level",
          earnedSubtitle: "You completed every criterion for your current level.",
          nextTitle: "Next-level criteria",
          nextSubtitle: "See what is complete and what remains to unlock the next level.",
          allComplete: "You have unlocked every level",
          roadmapTitle: "Complete level roadmap",
          roadmapSubtitle: "Levels use cumulative course, classroom, and learner criteria.",
          noCurrent: "No level criteria unlocked yet",
          emptyTitle: "Certificate data not found",
          emptyDescription: "Please open this page from the Teacher Dashboard.",
          current: "Current",
          target: "Target",
          passed: "Completed"
        }
      };
      const byId = id => document.getElementById(id);
      const setText = (id, value) => { byId(id).textContent = value == null ? "" : String(value); };
      const readPayload = () => {
        try {
          const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          sessionStorage.setItem(SESSION_KEY, raw);
          localStorage.removeItem(STORAGE_KEY);
          return JSON.parse(raw);
        } catch (_) {
          return null;
        }
      };
      const createCriterion = (criterion, labels) => {
        const row = document.createElement("div");
        row.className = "criterion";
        const top = document.createElement("div");
        top.className = "criterion-top";
        const label = document.createElement("div");
        label.className = "criterion-label";
        const check = document.createElement("span");
        check.className = `check ${criterion.met ? "met" : "pending"}`;
        check.textContent = criterion.met ? "✓" : "•";
        const text = document.createElement("span");
        text.textContent = criterion.label;
        label.append(check, text);
        const value = document.createElement("span");
        value.className = "criterion-value";
        value.textContent = criterion.met
          ? `${labels.passed} · ${criterion.current} ${criterion.unit}`
          : `${labels.current} ${criterion.current} / ${labels.target} ${criterion.target} ${criterion.unit}`;
        top.append(label, value);
        const track = document.createElement("div");
        track.className = "track";
        const fill = document.createElement("span");
        fill.style.width = `${Math.min(100, criterion.target ? criterion.current / criterion.target * 100 : 100)}%`;
        track.append(fill);
        row.append(top, track);
        return row;
      };
      const renderCriteria = (container, criteria, labels, emptyText) => {
        container.replaceChildren();
        if (!criteria || !criteria.length) {
          const empty = document.createElement("p");
          empty.className = "panel-subtitle";
          empty.textContent = emptyText;
          container.append(empty);
          return;
        }
        criteria.forEach(criterion => container.append(createCriterion(criterion, labels)));
      };
      const payload = readPayload();
      if (!payload || payload.version !== 1) {
        byId("empty").hidden = false;
        return;
      }
      const locale = payload.locale === "en" ? "en" : "th";
      const labels = copy[locale];
      document.documentElement.lang = locale;
      document.title = labels.title;
      setText("backLabel", labels.back);
      setText("printLabel", labels.print);
      setText("emptyTitle", labels.emptyTitle);
      setText("emptyDescription", labels.emptyDescription);
      setText("emptyBack", labels.back);
      byId("toolbar").hidden = false;
      byId("content").hidden = false;
      byId("printButton").addEventListener("click", () => window.print());

      const current = payload.currentLevel;
      const next = payload.nextLevel;
      if (current) {
        setText("certificateTitle", labels.certificateTitle);
        setText("presentedLabel", labels.presented);
        setText("teacherName", payload.teacherName || labels.teacherFallback);
        setText("recognition", labels.recognition);
        setText("levelName", `Level ${current.level} · ${current.name}`);
        setText("levelSeal", `LEVEL\n${current.level}`);
        setText("schoolName", payload.school ? `${labels.school}: ${payload.school}` : "");
        const date = new Intl.DateTimeFormat(locale === "th" ? "th-TH" : "en-US", {
          day: "numeric", month: "long", year: "numeric"
        }).format(new Date(payload.issuedAt));
        setText("issuedDate", `${labels.issued}: ${date}`);
      } else {
        byId("certificate").hidden = true;
        byId("locked").hidden = false;
        setText("lockedTitle", labels.lockedTitle);
        setText("lockedDescription", labels.lockedDescription);
        byId("printButton").hidden = true;
      }

      setText("earnedTitle", labels.earnedTitle);
      setText("earnedSubtitle", labels.earnedSubtitle);
      setText("earnedLevel", current ? `LEVEL ${current.level}` : "START");
      renderCriteria(byId("earnedCriteria"), current?.criteria, labels, labels.noCurrent);

      setText("nextTitle", next ? labels.nextTitle : labels.allComplete);
      setText("nextSubtitle", next ? labels.nextSubtitle : labels.allComplete);
      setText("nextLevel", next ? `LEVEL ${next.level}` : "MAX");
      renderCriteria(byId("nextCriteria"), next?.criteria, labels, labels.allComplete);

      setText("roadmapTitle", labels.roadmapTitle);
      setText("roadmapSubtitle", labels.roadmapSubtitle);
      payload.roadmap.forEach(level => {
        const card = document.createElement("article");
        card.className = `roadmap-level${level.unlocked ? " unlocked" : ""}`;
        const number = document.createElement("div");
        number.className = "roadmap-number";
        number.textContent = `LEVEL ${level.level}${level.unlocked ? "  ✓" : ""}`;
        const name = document.createElement("div");
        name.className = "roadmap-name";
        name.textContent = level.name;
        const requirements = document.createElement("div");
        requirements.className = "roadmap-requirement";
        requirements.textContent = level.criteria.map(item => `${item.target} ${item.unit} · ${item.label}`).join("\n");
        requirements.style.whiteSpace = "pre-line";
        card.append(number, name, requirements);
        byId("roadmapGrid").append(card);
      });
    })();
  </script>
</body>
</html>
