<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Chatbot Quiz API</title>
</head>
<body>
  <button id="login">Login</button>
  <button id="get">GET Chatbot</button>
  <button id="getExample">GET URL ตัวอย่าง</button>
  <p id="status"></p>
  <pre id="result"></pre>

  <script>
    // แก้ 2 ค่านี้ก่อนทดสอบ
    const COURSE_ID = "course-v1:ORG+COURSE+RUN";
    const EMAIL = "student@example.com";
    const EXAMPLE_URL = "https://adaptive-profile-bn.ae.app.meca.in.th/api/kidbright/course/course-v1:NECTEC+AILOWERSECONDARY01+NECTEC_000008/data/chatbot?email=natthaniskhotsikaew@gmail.com";

    const BASE_URL = "https://adaptive-profile-bn.ae.app.meca.in.th";
    const OIDC = {
      authorizationEndpoint: "https://id.meca.in.th/auth/realms/kidbright/protocol/openid-connect/auth",
      tokenEndpoint: "https://id.meca.in.th/auth/realms/kidbright/protocol/openid-connect/token",
      clientId: "dashboard",
      redirectUri: location.origin + location.pathname,
      scope: "openid profile email"
    };

    const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
    const API_LOG = [];
    const readAuth = () => JSON.parse(sessionStorage.getItem("oidc_auth") || "null");
    const authHeader = () => {
      const token = readAuth()?.token?.access_token;
      return token ? { Authorization: `Bearer ${token}` } : {};
    };

    const apiGet = async (url, { auth = true } = {}) => {
      const entry = { url, auth, at: new Date().toLocaleTimeString("th-TH") };
      API_LOG.push(entry);
      try {
        const res = await fetch(url, { headers: auth ? authHeader() : {} });
        entry.status = res.status;
        if (!res.ok) { entry.ok = false; entry.error = `${res.status} ${res.statusText}`; throw new Error(entry.error); }
        const json = await res.json();
        entry.ok = true;
        entry.count = Array.isArray(json) ? json.length : (Array.isArray(json?.data) ? json.data.length : undefined);
        if (DEBUG) entry.sample = json;
        return json;
      } catch (e) { entry.ok = false; entry.error = entry.error || e.message; throw e; }
    };

    const b64url = buffer => {
      let value = "";
      new Uint8Array(buffer).forEach(byte => value += String.fromCharCode(byte));
      return btoa(value).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    };

    async function login() {
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
      sessionStorage.setItem("pkce_verifier", verifier);
      const params = new URLSearchParams({
        client_id: OIDC.clientId,
        redirect_uri: OIDC.redirectUri,
        response_type: "code",
        scope: OIDC.scope,
        code_challenge: b64url(digest),
        code_challenge_method: "S256"
      });
      location.href = `${OIDC.authorizationEndpoint}?${params}`;
    }

    async function finishLogin(code) {
      const body = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: OIDC.clientId,
        redirect_uri: OIDC.redirectUri,
        code,
        code_verifier: sessionStorage.getItem("pkce_verifier")
      });
      const res = await fetch(OIDC.tokenEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      sessionStorage.setItem("oidc_auth", JSON.stringify({ token: await res.json() }));
      history.replaceState({}, "", OIDC.redirectUri);
    }

    async function getChatbot(url = `${BASE_URL}/api/kidbright/course/${encodeURIComponent(COURSE_ID)}/data/chatbot?email=${encodeURIComponent(EMAIL)}`) {
      document.querySelector("#status").textContent = "Loading...";
      try {
        const data = await apiGet(url);
        document.querySelector("#status").textContent = "Success";
        document.querySelector("#result").textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        document.querySelector("#status").textContent = error.message;
      }
    }

    document.querySelector("#login").onclick = login;
    document.querySelector("#get").onclick = () => getChatbot();
    document.querySelector("#getExample").onclick = () => getChatbot(EXAMPLE_URL);

    const code = new URLSearchParams(location.search).get("code");
    if (code) finishLogin(code).then(getChatbot).catch(error => {
      document.querySelector("#status").textContent = error.message;
    });
  </script>
</body>
</html>
